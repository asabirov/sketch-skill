<!-- Best for: A sign-in with an email address and a password. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in: Email</title>
<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<header class="sketch-bar"><strong>[Product]</strong></header>
<main class="sketch-narrow" style="max-width:420px;min-height:calc(100vh - 62px);align-content:center">
  <form class="sketch-panel sketch-frame sketch-stack" action="#">
    <h1>Sign in</h1>
    <label class="sketch-field">Email<input class="sketch-input" type="email" autocomplete="email" required></label>
    <label class="sketch-field">Password<input class="sketch-input" type="password" autocomplete="current-password" required></label>
    <button class="sketch-button">Continue</button>
    <a href="#" style="justify-self:start">Forgot password?</a>
  </form>
  <p>No account? <a href="#">Create one</a></p>
</main>
<script src="../../assets/sketch.js"></script>
