<!-- Best for: One record with a description, some properties and recent activity, such as a task, a ticket or a deal. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detail: Properties panel</title>
<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<header class="sketch-bar"><strong>[Product]</strong></header>
<main class="sketch-main">
  <a href="#">Back to projects</a>
  <div class="sketch-row" style="gap:12px"><h1>Website refresh</h1><span class="sketch-badge">In review</span><span class="sketch-spacer"></span>
    <button class="sketch-button secondary">Edit</button><button class="sketch-button">Complete</button></div>
  <nav class="sketch-nav" aria-label="Record" style="padding:0">
    <a href="#" aria-current="page">Overview</a><a href="#">Tasks</a><a href="#">Files</a></nav>
  <div class="sketch-cols">
    <div class="sketch-stack" style="gap:24px">
      <section class="sketch-stack"><h2>Description</h2><p>New home page and pricing page for the spring launch.</p></section>
      <section class="sketch-stack"><h2>Activity</h2>
        <ul class="sketch-list">
          <li><span>Mira moved it to review</span><span class="sketch-spacer"></span><span class="sketch-muted">Oct 24</span></li>
        </ul>
        <form class="sketch-row" action="#"><input class="sketch-input" aria-label="Comment" placeholder="Add a comment" style="flex:1 1 200px"><button class="sketch-button secondary">Comment</button></form>
      </section>
    </div>
    <aside class="sketch-panel sketch-frame sketch-stack" aria-label="Properties"><h2>Properties</h2>
      <dl class="sketch-facts">
        <dt>Owner</dt><dd>Mira Lane</dd><dt>Due</dt><dd>Nov 4</dd><dt>Priority</dt><dd>High</dd>
      </dl>
    </aside>
  </div>
</main>
<script src="../../assets/sketch.js"></script>
