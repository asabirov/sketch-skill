<!-- Best for: A service that keeps data the same on all devices, with its state and one switch. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings: Sync status</title>
<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<header class="sketch-bar"><span class="sketch-spacer"></span><h1 style="font-size:14px;margin:0">[Product] settings</h1><span class="sketch-spacer"></span></header>
<main class="sketch-narrow" style="--width:640px;padding-top:24px">
  <div class="sketch-tabs" aria-label="Settings" style="justify-content:center"><button role="tab">General</button><button role="tab" aria-selected="true">Sync</button><button role="tab">Icon</button><button role="tab">Themes</button><button role="tab">Typography</button></div>
  <label class="sketch-choice"><input type="checkbox" checked>Sync notes on all my devices</label>
  <p style="margin:0"><b>Up to date.</b> Last sync 2 minutes ago, 128 notes.</p>
  <p class="sketch-muted" style="margin:0">Sync uses your [Cloud] account. Notes stay on this device when sync is off. <a href="#">Help</a></p>
  <div class="sketch-placeholder" style="min-height:200px">Sync picture</div>
</main>
<script src="../../assets/sketch.js"></script>
