<!-- Best for: Limits and current use, such as messages, storage or seats. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings: Usage meters</title>
<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<header class="sketch-bar"><strong>[Product]</strong></header>
<main class="sketch-main" style="max-width:760px">
  <div class="sketch-row"><h1>Usage</h1><span class="sketch-spacer"></span><a class="sketch-button secondary" href="#">Upgrade</a></div>
  <p>Plan: Team. The limits reset on 1 November.</p>
  <section class="sketch-stack" style="gap:8px"><div class="sketch-row"><h2>Messages</h2><span class="sketch-spacer"></span><span>312 of 500</span></div><div class="sketch-meter" role="meter" aria-valuemin="0" aria-valuemax="500" aria-valuenow="312" aria-label="Messages"><i style="width:62%"></i></div></section>
  <section class="sketch-stack" style="gap:8px"><div class="sketch-row"><h2>Storage</h2><span class="sketch-spacer"></span><span>4.1 of 10 GB</span></div><div class="sketch-meter" role="meter" aria-valuemin="0" aria-valuemax="10" aria-valuenow="4.1" aria-label="Storage in GB"><i style="width:41%"></i></div></section>
  <section class="sketch-stack" style="gap:8px"><div class="sketch-row"><h2>Seats</h2><span class="sketch-spacer"></span><span>9 of 10</span></div><div class="sketch-meter" role="meter" aria-valuemin="0" aria-valuemax="10" aria-valuenow="9" aria-label="Seats"><i style="width:90%"></i></div>
    <p style="margin:0">One seat is left. Add seats before you invite more people.</p></section>
</main>
<script src="../../assets/sketch.js"></script>
