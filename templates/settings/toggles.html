<!-- Best for: Features that people turn on or off, each with one sentence about it. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings: Toggles</title>
<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<header class="sketch-bar"><strong>[Product]</strong></header>
<main class="sketch-main" style="max-width:760px">
  <h1>Features</h1>
  <ul class="sketch-list">
    <li style="flex-wrap:nowrap;padding:12px 8px"><div style="flex:1"><b>Memory</b><p style="margin:0">Use details from earlier chats in new answers.</p></div><label class="sketch-switch"><input type="checkbox" role="switch" aria-label="Memory" checked></label></li>
    <li style="flex-wrap:nowrap;padding:12px 8px"><div style="flex:1"><b>Web search</b><p style="margin:0">Look up recent facts on the web when a question needs them.</p></div><label class="sketch-switch"><input type="checkbox" role="switch" aria-label="Web search" checked></label></li>
    <li style="flex-wrap:nowrap;padding:12px 8px"><div style="flex:1"><b>Email digest</b><p style="margin:0">Get one email each Monday with the week's open tasks.</p></div><label class="sketch-switch"><input type="checkbox" role="switch" aria-label="Email digest"></label></li>
  </ul>
</main>
<script src="../../assets/sketch.js"></script>
