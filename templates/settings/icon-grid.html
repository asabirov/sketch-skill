<!-- Best for: A choice of one app icon or picture from a grid of small tiles. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings: Icon grid</title>
<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<header class="sketch-bar"><span class="sketch-spacer"></span><h1 style="font-size:14px;margin:0">[Product] settings</h1><span class="sketch-spacer"></span></header>
<main class="sketch-narrow" style="--width:640px;padding-top:24px">
  <div class="sketch-tabs" aria-label="Settings" style="justify-content:center"><button role="tab">General</button><button role="tab">Sync</button><button role="tab" aria-selected="true">Icon</button><button role="tab">Themes</button><button role="tab">Typography</button></div>
  <fieldset class="sketch-stack"><legend><h2>App icon</h2></legend>
    <div class="sketch-grid" style="--phone:3;--tablet:3;--wide:5">
      <label class="sketch-stack" style="gap:4px;justify-items:center;cursor:pointer"><span class="sketch-placeholder" style="width:100%;min-height:64px" aria-hidden="true"></span><span><input type="radio" name="icon" checked> Classic</span></label>
      <label class="sketch-stack" style="gap:4px;justify-items:center;cursor:pointer"><span class="sketch-placeholder" style="width:100%;min-height:64px" aria-hidden="true"></span><span><input type="radio" name="icon"> Ink</span></label>
      <label class="sketch-stack" style="gap:4px;justify-items:center;cursor:pointer"><span class="sketch-placeholder" style="width:100%;min-height:64px" aria-hidden="true"></span><span><input type="radio" name="icon"> Paper</span></label>
      <label class="sketch-stack" style="gap:4px;justify-items:center;cursor:pointer"><span class="sketch-placeholder" style="width:100%;min-height:64px" aria-hidden="true"></span><span><input type="radio" name="icon"> Night</span></label>
      <label class="sketch-stack" style="gap:4px;justify-items:center;cursor:pointer"><span class="sketch-placeholder" style="width:100%;min-height:64px" aria-hidden="true"></span><span><input type="radio" name="icon"> Mono</span></label>
      <label class="sketch-stack" style="gap:4px;justify-items:center;cursor:pointer"><span class="sketch-placeholder" style="width:100%;min-height:64px" aria-hidden="true"></span><span><input type="radio" name="icon"> Outline</span></label>
    </div></fieldset>
  <p class="sketch-muted" style="margin:0">The new icon shows after the next start.</p>
</main>
<script src="../../assets/sketch.js"></script>
