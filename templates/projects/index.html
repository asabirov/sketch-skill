<!-- Best for: A small set of workspaces that people open by name. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects: Index</title>
<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<header class="sketch-bar"><strong>[Product]</strong></header>
<main class="sketch-main">
  <div class="sketch-row"><h1>Projects</h1><span class="sketch-spacer"></span><button class="sketch-button"><i data-icon="plus"></i>New</button></div>
  <div class="sketch-row"><input class="sketch-input" type="search" aria-label="Search projects" placeholder="Search" style="flex:1;min-width:200px">
    <label class="sketch-row">Sort <select class="sketch-input" style="width:auto"><option>Last change</option><option>Name</option></select></label></div>
  <div class="sketch-grid" style="--wide:3">
    <article class="sketch-panel sketch-frame sketch-stack" style="gap:4px;padding:16px"><h3><a href="#">Spring launch</a></h3><span class="sketch-muted">Plans and copy for the April launch.</span><span class="sketch-muted">Changed 2 hours ago</span></article>
    <article class="sketch-panel sketch-frame sketch-stack" style="gap:4px;padding:16px"><h3><a href="#">Hiring</a></h3><span class="sketch-muted">Job posts and interview notes.</span><span class="sketch-muted">Changed yesterday</span></article>
    <article class="sketch-panel sketch-frame sketch-stack" style="gap:4px;padding:16px"><h3><a href="#">Thesis</a></h3><span class="sketch-muted">Sources and chapter drafts.</span><span class="sketch-muted">Changed 3 Oct</span></article>
  </div>
</main>
<script src="../../assets/sketch.js"></script>
