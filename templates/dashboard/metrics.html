<!-- Best for: A first page that shows a small number of key numbers and one chart, such as sales or sign-ups. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard: Metrics</title>
<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<header class="sketch-bar"><strong>[Product]</strong></header>
<main class="sketch-main" style="max-width:none">
  <h1>This week</h1>
  <div class="sketch-grid">
    <div class="sketch-panel sketch-frame sketch-stack" style="gap:4px"><span class="sketch-muted">Orders</span><div class="sketch-row"><b style="font-size:36px">128</b><span>▲ 12%</span></div>
      <svg class="sketch-spark" viewBox="0 0 100 24" preserveAspectRatio="none" role="img" aria-label="Orders, last 7 days: rising"><polyline points="0,18 17,12 33,15 50,6 67,9 83,11 100,4"/></svg></div>
    <div class="sketch-panel sketch-frame sketch-stack" style="gap:4px"><span class="sketch-muted">Refunds</span><div class="sketch-row"><b style="font-size:24px">3</b><span>▼ 25%</span></div>
      <svg class="sketch-spark" viewBox="0 0 100 24" preserveAspectRatio="none" role="img" aria-label="Refunds, last 7 days: falling"><polyline points="0,8 17,10 33,6 50,14 67,12 83,18 100,20"/></svg></div>
    <div class="sketch-panel sketch-frame sketch-stack" style="gap:4px"><span class="sketch-muted">New customers</span><div class="sketch-row"><b style="font-size:24px">41</b><span>▲ 5%</span></div>
      <svg class="sketch-spark" viewBox="0 0 100 24" preserveAspectRatio="none" role="img" aria-label="New customers, last 7 days: rising"><polyline points="0,14 17,16 33,12 50,13 67,10 83,11 100,9"/></svg></div>
    <div class="sketch-panel sketch-frame sketch-stack" style="gap:4px"><span class="sketch-muted">Open tickets</span><div class="sketch-row"><b style="font-size:24px">7</b><span>▲ 40%</span></div>
      <svg class="sketch-spark" viewBox="0 0 100 24" preserveAspectRatio="none" role="img" aria-label="Open tickets, last 7 days: rising"><polyline points="0,20 17,18 33,19 50,14 67,15 83,10 100,8"/></svg></div>
    <section class="sketch-panel sketch-frame sketch-stack sketch-span"><h2>Orders by day</h2>
      <div class="sketch-bars" role="img" aria-label="Orders by day: Mon 12, Tue 20, Wed 16, Thu 28, Fri 24, Sat 18, Sun 10">
        <i style="height:43%"></i><i style="height:71%"></i><i style="height:57%"></i><i style="height:100%"></i><i style="height:86%"></i><i style="height:64%"></i><i style="height:36%"></i>
      </div>
      <div class="sketch-bars sketch-muted" style="height:auto" aria-hidden="true"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
    </section>
    <section class="sketch-panel sketch-frame sketch-stack"><h2>Top products</h2>
      <ul class="sketch-list">
        <li>Desk lamp<span class="sketch-spacer"></span><b>42</b></li><li>Notebook<span class="sketch-spacer"></span><b>31</b></li><li>Pen set<span class="sketch-spacer"></span><b>18</b></li>
      </ul></section>
  </div>
</main>
<script src="../../assets/sketch.js"></script>
