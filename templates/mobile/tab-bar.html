<!-- Best for: A phone app with 3 to 5 main sections that people switch between with one tap. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile: Tab bar</title>
<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<div class="sketch-shell">
  <header class="sketch-bar"><strong>[Product]</strong></header>
  <nav class="sketch-nav" aria-label="Tabs">
    <a href="#" aria-current="page"><i data-icon="calendar"></i>Today</a><a href="#"><i data-icon="bell"></i>Inbox</a><a href="#"><i data-icon="search"></i>Search</a><a href="#"><i data-icon="user"></i>Profile</a>
  </nav>
  <main class="sketch-main" style="max-width:720px">
    <h1>Today</h1>
    <section class="sketch-stack" style="gap:0"><h2>Morning</h2>
      <ul class="sketch-list">
        <li><a href="#">Review pricing copy</a><span class="sketch-spacer"></span><span class="sketch-muted">9:00</span></li>
        <li><a href="#">Call with Theo</a><span class="sketch-spacer"></span><span class="sketch-muted">10:30</span></li>
      </ul></section>
    <section class="sketch-stack" style="gap:0"><h2>Afternoon</h2>
      <ul class="sketch-list"><li><a href="#">Ship the help centre</a><span class="sketch-spacer"></span><span class="sketch-muted">15:00</span></li></ul></section>
  </main>
</div>
<script src="../../assets/sketch.js"></script>
