<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<header class="sketch-bar"><strong>[Product]</strong></header>
<main class="sketch-main">
  <section class="sketch-panel sketch-frame sketch-cols" aria-label="Featured" style="--cols:minmax(0,1fr) minmax(0,1fr);align-items:center">
    <div class="sketch-stack"><h1>Connect your calendar</h1><p>Plan meetings without leaving the chat.</p><a class="sketch-button" href="#" style="justify-self:start">Add</a></div>

  <div class="sketch-row"><h2>Popular</h2><span class="sketch-spacer"></span><a href="#">Show all</a></div>
  <div class="sketch-grid" style="--wide:3">
    <article class="sketch-panel sketch-frame sketch-stack" style="gap:4px;padding:16px"><h3><a href="#">Calendar</a></h3><span class="sketch-muted">Plan and move meetings.</span></article>
    <article class="sketch-panel sketch-frame sketch-stack" style="gap:4px;padding:16px"><h3><a href="#">Drive</a></h3><span class="sketch-muted">Search your files.</span></article>
    <article class="sketch-panel sketch-frame sketch-stack" style="gap:4px;padding:16px"><h3><a href="#">Issue tracker</a></h3><span class="sketch-muted">Read and file tickets.</span></article>
  </div>
  <h2>Categories</h2>
  <div class="sketch-grid">
    <a class="sketch-panel sketch-frame" href="#" style="padding:16px">Writing</a><a class="sketch-panel sketch-frame" href="#" style="padding:16px">Data</a>
    <a class="sketch-panel sketch-frame" href="#" style="padding:16px">Design</a><a class="sketch-panel sketch-frame" href="#" style="padding:16px">Sales</a>
  </div>
</main>
