<!-- Best for: A product or a section that has no data yet, with one action that starts it. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empty: Full screen</title>
<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<header class="sketch-bar" style="position:absolute;inset:0 0 auto;border:0"><strong>[Product]</strong></header>
<main class="sketch-narrow" style="min-height:100vh;align-content:center;justify-items:center;text-align:center;padding-top:72px">
  <!-- An abstract picture in inline SVG: no image file. Replace it with the product's own picture. -->
  <svg viewBox="0 0 240 160" width="240" height="160" aria-hidden="true" style="max-width:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">
    <path d="M20 130 C60 100 90 140 130 110 S200 90 220 120"/>
    <circle cx="80" cy="60" r="28"/><rect x="128" y="36" width="64" height="48" rx="10" transform="rotate(8 160 60)"/>
    <path d="M60 140 h120"/><circle cx="196" cy="28" r="6"/>
  </svg>
  <h1>Nothing here yet</h1>
  <p>Add your first item to fill this space.</p>
  <button class="sketch-button">Add</button>
</main>
<script src="../../assets/sketch.js"></script>
