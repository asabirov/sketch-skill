<!-- Best for: A tool where people start a new work session from a list of earlier sessions. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home: Session start</title>
<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<header class="sketch-bar"><a class="sketch-phone-only" href="#">Sessions</a><strong>[Product]</strong></header>
<!-- Earlier sessions at the left, an empty session with the message box at the bottom. A phone shows the session only. -->
<main class="sketch-split">
  <nav class="sketch-nav sketch-from-tablet" aria-label="Sessions">
    <button class="sketch-button secondary" style="margin-bottom:8px"><i data-icon="plus"></i>New</button>
    <h2 class="sketch-muted" style="margin:8px 12px 0;font-size:14px">Earlier</h2>
    <a href="#">Fix the sign-in test</a><a href="#">Add CSV export</a><a href="#">Update the README</a><a href="#">Upgrade the router</a>
  </nav>
  <section class="sketch-stack" aria-label="New session" style="grid-template-rows:1fr auto;min-height:calc(100vh - 62px);padding:16px">
    <div class="sketch-stack" style="align-content:center;justify-items:center;text-align:center"><h1>New session</h1><p class="sketch-muted" style="margin:0">Pick a folder, then describe the task.</p></div>
    <form class="sketch-panel sketch-frame sketch-stack" action="#" style="width:100%;max-width:760px;margin:0 auto;padding:16px">
      <textarea class="sketch-input" aria-label="Task" placeholder="Describe the task" rows="3"></textarea>
      <div class="sketch-row"><select class="sketch-input" aria-label="Folder" style="width:auto"><option>web-app</option><option>api</option></select><span class="sketch-spacer"></span><button class="sketch-button">Start</button></div>
    </form>
  </section>
</main>
<script src="../../assets/sketch.js"></script>
