<!-- Best for: The first page of an assistant or a search tool, where people start by typing one request. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home: Composer-centred</title>
<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<header class="sketch-bar"><strong>[Product]</strong></header>
<!-- A greeting, one message box in the middle, then recent work. -->
<main class="sketch-narrow" style="--width:720px;padding-top:12vh">
  <h1 style="text-align:center">Good morning, Ana</h1>
  <form class="sketch-panel sketch-frame sketch-stack" action="#" style="padding:16px">
    <textarea class="sketch-input" aria-label="Request" placeholder="Ask for anything" rows="3"></textarea>
    <div class="sketch-row"><button class="sketch-icon-button" type="button" aria-label="Attach a file"><i data-icon="upload"></i></button><span class="sketch-spacer"></span><button class="sketch-button">Send</button></div>
  </form>
  <h2>Recent</h2>
  <div class="sketch-grid" style="--tablet:3;--wide:3">
    <article class="sketch-panel sketch-frame sketch-stack" style="gap:4px;padding:16px"><h3><a href="#">Trip plan for May</a></h3><span class="sketch-muted">Yesterday</span></article>
    <article class="sketch-panel sketch-frame sketch-stack" style="gap:4px;padding:16px"><h3><a href="#">Reply to the landlord</a></h3><span class="sketch-muted">2 days ago</span></article>
    <article class="sketch-panel sketch-frame sketch-stack" style="gap:4px;padding:16px"><h3><a href="#">Q3 sales summary</a></h3><span class="sketch-muted">Last week</span></article>
  </div>
</main>
<script src="../../assets/sketch.js"></script>
