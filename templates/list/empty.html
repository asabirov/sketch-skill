<!-- Best for: A list that has no items yet and needs no action. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List: Empty</title>
<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<header class="sketch-bar"><strong>[Product]</strong></header>
<main class="sketch-main" style="max-width:860px">
  <h1>Shared with you</h1>
  <div class="sketch-tabs" aria-label="Filter"><button role="tab" aria-controls="tab-all" aria-selected="true">All</button><button role="tab" aria-controls="tab-starred">Starred</button><button role="tab" aria-controls="tab-shared">Shared</button></div>
  <!-- One plain sentence where the rows will be. -->
  <p id="tab-all" style="padding:96px 0;text-align:center">Nobody has shared a chat with you yet.</p>
  <p id="tab-starred" style="padding:96px 0;text-align:center">No starred chats.</p>
  <p id="tab-shared" style="padding:96px 0;text-align:center">No shared chats.</p>
</main>
<script src="../../assets/sketch.js"></script>
