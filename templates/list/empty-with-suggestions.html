<!-- Best for: A list that has no items yet, with ideas that help people make the first one. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List: Empty with suggestions</title>
<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<header class="sketch-bar"><strong>[Product]</strong></header>
<main class="sketch-narrow" style="--width:760px;justify-items:center;text-align:center">
  <i data-icon="calendar" style="transform:scale(2);margin:16px"></i>
  <h1>No projects yet</h1>
  <p>A project keeps the chats, files and instructions for one piece of work.</p>
  <button class="sketch-button"><i data-icon="plus"></i>New</button>
  <h2 style="margin-top:32px">Start from an idea</h2>
  <div class="sketch-grid" style="--wide:3;width:100%;text-align:left">
    <a class="sketch-panel sketch-frame" href="#" style="justify-content:start;padding:16px">Plan a product launch</a>
    <a class="sketch-panel sketch-frame" href="#" style="justify-content:start;padding:16px">Write a grant proposal</a>
    <a class="sketch-panel sketch-frame" href="#" style="justify-content:start;padding:16px">Study for an exam</a>
  </div>
</main>
