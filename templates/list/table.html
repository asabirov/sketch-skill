<!-- Best for: Items with many fields and a status, such as connections, users or invoices. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List: Table</title>
<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<header class="sketch-bar"><strong>[Product]</strong></header>
<main class="sketch-main">
  <h1>Connections</h1>
  <div class="sketch-tabs" aria-label="Filter"><button role="tab" aria-controls="tab-all" aria-selected="true">All</button><button role="tab" aria-controls="tab-failed">Failed</button></div>
  <div class="sketch-row"><input class="sketch-input" type="search" aria-label="Search connections" placeholder="Search" style="width:min(280px,100%)"><span class="sketch-spacer"></span><button class="sketch-button"><i data-icon="plus"></i>Connect</button></div>
  <div class="sketch-table-box" id="tab-all"><table class="sketch-table">
    <thead><tr><th>Name</th><th>Type</th><th>Last sync</th><th>Status</th></tr></thead>
    <tbody>
      <tr><td><a href="#">Sales database</a></td><td>Postgres</td><td>5 min ago</td><td><span class="sketch-badge">Active</span></td></tr>
      <tr><td><a href="#">Team drive</a></td><td>Cloud storage</td><td>1 hour ago</td><td><span class="sketch-badge">Active</span></td></tr>
      <tr><td><a href="#">Support inbox</a></td><td>Email</td><td>2 days ago</td><td><span class="sketch-badge strong">Failed</span></td></tr>
    </tbody>
  </table></div>
  <p id="tab-failed">Support inbox failed to sync. <a href="#">Reconnect</a></p>
</main>
<script src="../../assets/sketch.js"></script>
