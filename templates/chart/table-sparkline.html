<!-- Best for: A table where each row needs its own trend next to its numbers, such as revenue by client or usage by plan. -->
<!-- Many periods: Each sparkline holds the last 12 months and one projected month in a fixed width of 120 px. It never gets an axis or a scroll bar. For a longer history, open the row's own chart. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart: Sparkline in a table row</title>
<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<header class="sketch-bar"><strong>[Product]</strong></header>
<main class="sketch-main">
  <h1>Revenue by client</h1>
  <section class="sketch-panel sketch-frame sketch-stack">
    <div class="sketch-table-box"><table class="sketch-table">
      <thead><tr><th>Client</th><th>Trend</th><th style="text-align:right">Nov to date</th><th class="sketch-from-tablet" style="text-align:right">Nov projected</th><th style="text-align:right">vs. Oct, same day</th></tr></thead>
      <tbody>
        <tr><td><a href="#">Northwind Studio</a></td><td><svg class="sketch-spark" style="width:120px" viewBox="0 0 100 24" preserveAspectRatio="none" role="img" aria-label="Northwind Studio, last 12 months: rising, from 8k to 14k. November projected 15k."><polyline points="0,12.3 8,11.1 16,11.1 24,9.9 32,8.7 40,9.9 48,7.5 56,7.5 64,8.7 72,6.2 80,5"/><polyline class="projected" points="80,5 100,3.8"/></svg></td><td style="text-align:right">€9k</td><td class="sketch-from-tablet" style="text-align:right">€15k</td><td style="text-align:right">+7%</td></tr>
        <tr><td><a href="#">Harbor Analytics</a></td><td><svg class="sketch-spark" style="width:120px" viewBox="0 0 100 24" preserveAspectRatio="none" role="img" aria-label="Harbor Analytics, last 12 months: falling, from 12k to 6k. November projected 6k."><polyline points="0,3.8 8,5.3 16,6.8 24,6.8 32,8.4 40,8.4 48,9.9 56,9.9 64,11.4 72,11.4 80,12.9"/><polyline class="projected" points="80,12.9 100,12.9"/></svg></td><td style="text-align:right">€4k</td><td class="sketch-from-tablet" style="text-align:right">€6k</td><td style="text-align:right">−14%</td></tr>
        <tr><td><a href="#">Lumen Health</a></td><td><svg class="sketch-spark" style="width:120px" viewBox="0 0 100 24" preserveAspectRatio="none" role="img" aria-label="Lumen Health, last 12 months: rising, from 5k to 8k. November projected 9k."><polyline points="0,11.9 8,11.9 16,9.9 24,9.9 32,9.9 40,7.9 48,7.9 56,7.9 64,5.8 72,5.8 80,5.8"/><polyline class="projected" points="80,5.8 100,3.8"/></svg></td><td style="text-align:right">€6k</td><td class="sketch-from-tablet" style="text-align:right">€9k</td><td style="text-align:right">+13%</td></tr>
        <tr><td><a href="#">Carta Logistics</a></td><td><svg class="sketch-spark" style="width:120px" viewBox="0 0 100 24" preserveAspectRatio="none" role="img" aria-label="Carta Logistics, last 12 months: rising, from 9k to 10k. November projected 10k."><polyline points="0,5.6 8,5.6 16,7.5 24,3.8 32,5.6 40,3.8 48,5.6 56,5.6 64,3.8 72,5.6 80,3.8"/><polyline class="projected" points="80,3.8 100,3.8"/></svg></td><td style="text-align:right">€7k</td><td class="sketch-from-tablet" style="text-align:right">€10k</td><td style="text-align:right">0%</td></tr>
        <tr><td><a href="#">Brightline Media</a></td><td><svg class="sketch-spark" style="width:120px" viewBox="0 0 100 24" preserveAspectRatio="none" role="img" aria-label="Brightline Media, last 12 months: rising, from 7k to 13k. November projected 12k."><polyline points="0,12.2 8,16.4 16,17.8 24,13.6 32,10.8 40,9.4 48,6.6 56,8 64,13.6 72,5.2 80,3.8"/><polyline class="projected" points="80,3.8 100,5.2"/></svg></td><td style="text-align:right">€8k</td><td class="sketch-from-tablet" style="text-align:right">€12k</td><td style="text-align:right">−8%</td></tr>
      </tbody>
    </table></div>
    <ul class="sketch-key" aria-hidden="true">
      <li><i class="line"></i>Actual, Dec to Oct</li><li><i class="line projected"></i>Projected, Nov</li>
    </ul>
  </section>
</main>
<script src="../../assets/sketch.js"></script>
