<!-- Best for: A product with 3 to 5 sections and wide pages, such as a store admin or an analytics tool. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App shell: Top bar</title>
<link rel="stylesheet" href="../../assets/sketch.css">
<body data-sketch>
<header class="sketch-bar"><strong>[Product]</strong><span class="sketch-spacer sketch-until-desktop"></span>
  <button class="sketch-button secondary sketch-menu-button" aria-expanded="false" aria-controls="menu">Menu</button>
  <nav class="sketch-collapse" id="menu" aria-label="Main" style="flex:1;column-gap:16px">
    <a href="#" aria-current="page"><b>Overview</b></a><a href="#">Orders</a><a href="#">Customers</a><a href="#">Reports</a>
    <span class="sketch-spacer sketch-from-desktop"></span>
    <input class="sketch-input" type="search" aria-label="Search" placeholder="Search" style="width:min(100%,240px)">
  </nav></header>
<main class="sketch-main">
  <h1>Overview</h1>
  <section class="sketch-panel sketch-frame sketch-stack"><h2>Page content</h2><p>Put the page here.</p></section>
</main>
<script src="../../assets/sketch.js"></script>
