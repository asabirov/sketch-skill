<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscribe popover with channels sketch</title>
<link rel="stylesheet" href="../../../assets/sketch.css">
<style>
  /* A box with the class pattern_part stands for a part that another pattern draws. It names the part and that pattern. */
  [data-sketch] .pattern_part { display: grid; gap: 2px; place-content: center; justify-items: center; min-width: 200px; padding: 16px; text-align: center; }
  [data-sketch] .pattern_part > * { padding: 0 8px; background: var(--sketch-page); }
  [data-sketch] .pattern_part b { color: var(--sketch-ink); }
/* A title with the class pattern_plain_title is the main heading of the page for a screen reader. It looks like the text around it. */
[data-sketch] .pattern_plain_title { margin: 0; font: inherit; letter-spacing: inherit; }
/* A title with the class pattern_hidden_title names a page whose drawn title is out of view. Only a screen reader reads it. */
[data-sketch] .pattern_hidden_title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* The button stands at the right of the bar. Its popover has one tab for each channel. A tab is an icon, and its name is its label.
     Under the tabs, the part of the chosen channel has one field and one button, or the links of the feeds. */
  [data-sketch] .sub_popover { width: min(340px, calc(100vw - 16px)); gap: 16px; }
  [data-sketch] .sub_top { display: grid; grid-template-columns: minmax(0, 1fr) 44px; margin: -8px -8px 0; }
  [data-sketch] .sub_tabs { display: grid; grid-template-columns: repeat(3, 1fr); }
  [data-sketch] .sub_tabs [role="tab"] { justify-content: center; min-height: 44px; }
  [data-sketch] .sub_part { display: grid; gap: 12px; }
  [data-sketch] .sub_part p { margin: 0; }
  [data-sketch] .sub_phone { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; }
  [data-sketch] .sub_done { display: flex; align-items: flex-start; gap: 8px; }
  [data-sketch] .sub_done .sketch-icon { flex: none; margin-top: 2px; }
  [data-sketch] .sketch-main a.sub_feed, [data-sketch] a.sub_feed { display: flex; align-items: center; gap: 10px; min-height: 44px; }
</style>
<body data-sketch>

<section data-state="page">
  <div data-screen="status_page"></div>
</section>
<section data-state="email">
  <div data-screen="status_page" data-show="open email"></div>
</section>
<section data-state="email-error">
  <div data-screen="status_page" data-show="open email error"></div>
</section>
<section data-state="email-sent">
  <div data-screen="status_page" data-show="open sent"></div>
</section>
<section data-state="sms">
  <div data-screen="status_page" data-show="open sms"></div>
</section>
<section data-state="feed">
  <div data-screen="status_page" data-show="open feed"></div>
</section>

<!-- A public page of a product. The subscribe button opens a popover with one tab for each channel. No account is needed. -->
<template id="status_page">
<header class="sketch-bar" role="banner"><strong>[Product]</strong><span class="sketch-spacer"></span><button class="sketch-button" type="button" data-sketch-popover="subscribe"><i data-icon="bell"></i>Subscribe</button></header>
<main class="sketch-main sketch-stack" style="max-width:760px">
  <h1 class="pattern_hidden_title">Updates of the product</h1>
  <div class="sketch-placeholder" style="min-height:480px">Public page of the product</div>
<div class="sketch-popover sub_popover" id="subscribe" data-part="open" role="group" aria-label="Subscribe to updates">
  <div class="sub_top"><div class="sketch-tabs sub_tabs" aria-label="Channel">
    <button role="tab" type="button" aria-controls="sub_email" aria-selected="true" aria-label="Email" title="Email" data-go="email"><i data-glyph="mail"></i></button>
    <button role="tab" type="button" aria-controls="sub_sms" aria-selected="false" aria-label="Text message" title="Text message" data-go="sms" data-select-in="sms"><i data-glyph="phone"></i></button>
    <button role="tab" type="button" aria-controls="sub_feed" aria-selected="false" aria-label="Feed" title="Feed" data-go="feed" data-select-in="feed"><i data-glyph="rss"></i></button>
  </div><button class="sketch-icon-button" type="button" aria-label="Close" data-sketch-close><i data-icon="close"></i></button></div>
  <div class="sub_part" id="sub_email" role="tabpanel" aria-label="Email">
    <div class="sub_part" data-part="!sent" data-send="email-sent email-error">
      <label class="sketch-field">Email<input class="sketch-input" type="email" autocomplete="email" placeholder="name@example.com" aria-describedby="sub_email_error"></label>
      <p class="sketch-error" id="sub_email_error" data-part="error">Error: enter an email address, such as name@example.com.</p>
      <button class="sketch-button" type="button">Subscribe</button>
    </div>
    <div class="sub_part" data-part="sent">
      <p class="sub_done" role="status"><i data-icon="check"></i><span>We sent a link to <b data-sent-to>ada@example.com</b>. Open it to confirm the address.</span></p>
      <button class="sketch-button secondary" type="button" data-go="email">Use another address</button>
    </div>
  </div>
  <div class="sub_part" id="sub_sms" role="tabpanel" aria-label="Text message">
    <div class="sub_phone">
      <label class="sketch-field">Country<select class="sketch-input"><option>+34</option><option>+44</option><option>+1</option></select></label>
      <label class="sketch-field">Phone number<input class="sketch-input" type="tel" autocomplete="tel-national" placeholder="600 000 000"></label>
    </div>
    <button class="sketch-button" type="button" data-sketch-toast="We sent a code to the phone (sample)">Subscribe</button>
  </div>
  <div class="sub_part" id="sub_feed" role="tabpanel" aria-label="Feed">
    <a class="sub_feed" href="#"><i data-glyph="rss"></i>Atom feed</a>
    <a class="sub_feed" href="#"><i data-glyph="rss"></i>RSS feed</a>
  </div>
</div>
</main>
</template>

<script>
/* Screens of a pattern sketch. This script runs before the kit script.
   A block with data-screen takes a copy of the <template> with that id. Its data-show names the parts that the state shows.
   In a template, data-part="name" shows an element only with that part, and "!name" only without it. On a menu, a popover or a
   dialog, the part opens it. data-select-in="name" selects a tab or an option, data-current-in="name" marks the open row, and
   data-off-in="name" clears a checkbox. A tab that is a link, and a button or an option with data-go, change the state.
   A block with data-toast shows that toast when its state opens. */
(() => {
  const has_part = (shown, names) => {
    const list = names.split(' '), wanted = list.filter(name => name[0] !== '!');
    return list.every(name => name[0] !== '!' || !shown.includes(name.slice(1))) && (!wanted.length || wanted.some(name => shown.includes(name)));
  };
  document.querySelectorAll('[data-screen]').forEach((block, index) => {
    const copy = document.getElementById(block.dataset.screen).content.cloneNode(true);
    const shown = (block.dataset.show || '').split(' ');
    ['id', 'name', 'aria-controls', 'aria-labelledby', 'data-sketch-popover', 'data-sketch-open'].forEach(name =>
      copy.querySelectorAll(`[${name}]`).forEach(node => node.setAttribute(name, `s${index}_${node.getAttribute(name)}`)));
    copy.querySelectorAll('[data-part]').forEach(part => {
      const on = has_part(shown, part.dataset.part);
      if (part.matches('.sketch-menu, .sketch-popover, dialog')) part.toggleAttribute('data-open', on);
      else part.hidden = !on;
    });
    copy.querySelectorAll('[data-select-in]').forEach(node => {
      if (!has_part(shown, node.dataset.selectIn)) return;
      if (node.matches('option')) { node.setAttribute('selected', ''); return; }
      node.parentElement.querySelectorAll('[aria-selected]').forEach(other => other.setAttribute('aria-selected', 'false'));
      node.setAttribute('aria-selected', 'true');
    });
    copy.querySelectorAll('[data-current-in]').forEach(node => { if (has_part(shown, node.dataset.currentIn)) node.setAttribute('aria-current', 'true'); });
    copy.querySelectorAll('[data-off-in]').forEach(box => { if (has_part(shown, box.dataset.offIn)) box.checked = false; });
    block.append(copy);
  });
  /* The kit selects a clicked tab in the state that the reader leaves. Each state gets its own tab and option back. */
  const link_tabs = [...document.querySelectorAll('a[role="tab"]')].map(tab => [tab, tab.getAttribute('aria-selected') === 'true']);
  addEventListener('hashchange', () => {
    link_tabs.forEach(([tab, chosen]) => tab.setAttribute('aria-selected', String(chosen)));
    const block = document.querySelector(`[data-state="${location.hash.slice(1)}"] [data-screen][data-toast]`);
    const toast = document.querySelector('.sketch-toast');
    if (block) sketchToast(block.dataset.toast); else if (toast) toast.hidden = true;
  });
  /* The capture phase keeps the kit from pressing a chip in the state that the reader leaves.
     A sample link with the address "#" leads nowhere, so it keeps the state. Without this, it opens the first state. */
  document.addEventListener('click', event => {
    if (event.target.closest('a[href="#"]')) event.preventDefault();
    const button = event.target.closest('button[data-go]');
    if (!button) return;
    event.stopPropagation();
    location.hash = button.dataset.go;
  }, true);
  document.addEventListener('change', event => {
    const to = event.target.selectedOptions?.[0].dataset.go;
    if (!to) return;
    event.target.selectedIndex = Math.max(0, [...event.target.options].findIndex(option => option.defaultSelected));
    location.hash = to;
  });
})();
/* Line icons that the kit does not have. The kit draws <i data-glyph="name"></i> with the paths in window.sketchGlyphs. */
window.sketchGlyphs = {
    pin: 'M9 4h6l-1 6 3 3H7l3-3zM12 13v7', heart: 'M12 20c-4-3-7-6-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 4-3 7-7 10z',
    repost: 'M7 7h9a2 2 0 0 1 2 2v6M15 12l3 3 3-3M17 17H8a2 2 0 0 1-2-2V9M9 12L6 9l-3 3', views: 'M6 20v-6M12 20V4M18 20v-9',
    'bell-off': 'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4M4 4l16 16', 'bell-ring': 'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4M3 8c0-2 1-3.5 2.5-4.5M21 8c0-2-1-3.5-2.5-4.5',
    mail: 'M4 6h16v12H4zM4 7l8 6 8-6', phone: 'M8 3h8v18H8zM11 18h2', rss: 'M5 19v.5M5 12a7 7 0 0 1 7 7M5 5a14 14 0 0 1 14 14',
    'arrow-up': 'M12 19V5M6 11l6-6 6 6', 'arrow-down': 'M12 5v14M6 13l6 6 6-6', reply: 'M10 8l-5 4 5 4M5 12h9a5 5 0 0 1 5 5v1',
    code: 'M9 7l-5 5 5 5M15 7l5 5-5 5', tag: 'M4 4h8l8 8-8 8-8-8zM8.5 8.5v.5', play: 'M8 5l11 7-11 7z', paperclip: 'M19 11l-7 7a4 4 0 0 1-6-6l8-8a3 3 0 0 1 4 4l-8 8a1.5 1.5 0 0 1-2-2l7-7',
  };
/* The state "email-error" marks the field as wrong. Subscribe opens the sent state when the field has an address, and the error
   state when it does not. The sent state names the address. */
document.querySelectorAll('[data-state="email-error"] input[type="email"]').forEach(field => {
  field.setAttribute('aria-invalid', 'true');
  field.value = 'ada@';
});
document.addEventListener('click', event => {
  const box = event.target.closest('.sketch-button')?.closest('[data-send]');
  if (!box) return;
  const field = box.querySelector('input'), [sent, error] = box.dataset.send.split(' ');
  const good = /^\S+@\S+\.\S+$/.test(field.value.trim());
  if (good) document.querySelectorAll('[data-sent-to]').forEach(name => { name.textContent = field.value.trim(); });
  location.hash = good ? sent : error;
});
</script>
<script src="../../../assets/sketch.js"></script>
