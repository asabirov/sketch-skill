<!doctype html>
<!--
  Best for: a signed-in reader sees each outside app that uses their account, with its access, the connect date and the last use, and disconnects one app after a confirmation. The list fits a phone and a desktop.
  For a short list of the clients of a workspace inside a settings window, use account/oauth-consent.
  Row opens: a page of its own. The app name opens a page with the full access of the app.
  Related: account/oauth-consent is the consent page and a short list of clients in a settings window. settings/settings-window is the window form of settings.
  Each row has the app picture, the app name with a verified mark, the kind of app and its maker, a short access line, and a line with the connect date and the last use. A More button at the end of the row opens a menu with Disconnect.
  The page of an app has a Connected badge with a More button, the facts of its access, a list of what it can do with Show all, and a box of the connected account with Disconnect.
  Transition values, from transitions.json:
  - tools-open: the tool list opens to its full height in 200 ms, cubic-bezier(0.165, 0.84, 0.44, 1). The arrow of Show all turns in 60 ms, cubic-bezier(0.4, 0, 0.2, 1). Measured.
  - The menu, the confirmation, the row that goes and the toast show at once. 0 ms, measured for the menu, estimated for the others.
  No value in this file is a design-system token.
-->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connected apps</title>
<link rel="stylesheet" href="../../../assets/sketch.css">
<style>
  /* Each row: the picture, the facts, and the More button. The facts wrap, and the More button stays at the top right. */
  [data-sketch] .apps_list > li { display: grid; grid-template-columns: 36px minmax(0, 1fr) 44px; align-items: start; gap: 4px 12px; padding-block: 12px; border-bottom: 1px solid var(--sketch-muted); border-radius: 0; }
  [data-sketch] .apps_list > li > div { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
  [data-sketch] .apps_list > li > div > a { justify-self: start; justify-content: start; min-height: 0; font-weight: 600; }
  [data-sketch] .sketch-menu a.sketch-menu-item { justify-content: start; }
  [data-sketch] .apps_name { display: inline-flex; align-items: center; gap: 6px; }
  /* The head of the page of an app: the picture and the name on the left, the badge and the More button on the right. */
  [data-sketch] .apps_head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  [data-sketch] .apps_head > div { flex: 1 1 200px; display: grid; gap: 2px; min-width: 0; }
  [data-sketch] .apps_head h1 { overflow-wrap: anywhere; }
  [data-sketch] .apps_badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border: 1px solid var(--sketch-ink); border-radius: var(--sketch-wobble); }
  /* The facts in 2 columns on a desktop, and in one column on a phone. */
  [data-sketch] .apps_facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 24px; margin: 0; }
  [data-sketch] .apps_facts dd { margin: 0; overflow-wrap: anywhere; }
  /* The tool list shows 3 tools. Show all opens the rest, with the values of transitions.json. */
  [data-sketch] .apps_tools { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; overflow: hidden; transition: height 200ms cubic-bezier(0.165, 0.84, 0.44, 1); }
  [data-sketch] .apps_more_arrow { display: inline-flex; transition: rotate 60ms cubic-bezier(0.4, 0, 0.2, 1); }
  [data-sketch] [aria-expanded="true"] > .apps_more_arrow { rotate: 180deg; }
  @media (prefers-reduced-motion: reduce) { [data-sketch] :is(.apps_tools, .apps_more_arrow) { transition: none; } }
  [data-sketch] .apps_account { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; border: var(--sketch-stroke) solid var(--sketch-ink); border-radius: var(--sketch-wobble); }
  [data-sketch] .apps_account > span { flex: 1 1 180px; }
  [data-sketch] .apps_empty { display: grid; gap: 8px; justify-items: center; padding: 48px 16px; text-align: center; }
  @media (max-width: 479px) {
    [data-sketch] .apps_facts { grid-template-columns: minmax(0, 1fr); gap: 2px; }
    [data-sketch] .apps_facts dd { margin-bottom: 8px; }
  }
</style>
<body data-sketch>
<!-- The page script copies a template into each state. data-hide names the rows that the state leaves out. -->
<section class="sketch-shell" data-state="list" data-page="apps"></section>
<section class="sketch-shell" data-state="menu" data-page="apps" data-open-part="menu_notes"></section>
<section class="sketch-shell" data-state="confirm" data-page="apps" data-open-part="confirm_notes"></section>
<section class="sketch-shell" data-state="disconnected" data-page="apps" data-hide="notes" data-toast="Notes Sync is disconnected. It can no longer use your account."></section>
<section class="sketch-shell" data-state="empty" data-page="apps" data-hide="notes calendar deploy"></section>
<section class="sketch-shell" data-state="app" data-page="app"></section>

<template id="frame">
  <header class="sketch-bar" role="banner"><strong>[Product]</strong><span class="sketch-spacer"></span>
    <button type="button" class="sketch-icon-button" aria-label="Account menu" data-sketch-toast="Account menu. Pattern: navigation/user-menu"><i data-icon="user"></i></button>
  </header>
  <nav class="sketch-nav" aria-label="Main">
    <a href="#"><i data-icon="home"></i>Home</a><a href="#"><i data-icon="search"></i>Search</a><a href="#"><i data-icon="box"></i>Catalog</a><a href="#list" aria-current="page"><i data-icon="link"></i>Connected apps</a>
  </nav>
  <main class="sketch-main sketch-stack" style="max-width:760px"></main>
</template>

<template id="apps">
  <a href="#" data-sketch-toast="Opens the catalog of apps. Not a part of this pattern."><i data-icon="arrow-left"></i>Catalog</a>
  <h1>Connected apps</h1>
  <h2 data-count>Active</h2>
  <ul class="sketch-list apps_list">
    <li data-row="notes">
      <span class="sketch-avatar square">NS</span>
      <div>
        <a href="#app"><span class="apps_name">Notes Sync<i data-icon="check" aria-label="Verified"></i></span></a>
        <span class="sketch-muted">Connector. By Studio North</span>
        <span>Can read your profile and your email address.</span>
        <span class="sketch-muted">Connected 3 March 2025. Last used today.</span>
      </div>
      <button class="sketch-icon-button" type="button" aria-label="More actions for Notes Sync" data-sketch-popover="menu_notes___state__"><i data-icon="more"></i></button>
    </li>
    <li data-row="calendar">
      <span class="sketch-avatar square">CB</span>
      <div>
        <a href="#app"><span class="apps_name">Calendar Bridge<i data-icon="check" aria-label="Verified"></i></span></a>
        <span class="sketch-muted">Connector. By Bridge Tools</span>
        <span>Can read and change your events.</span>
        <span class="sketch-muted">Connected 18 January 2024. Last used 10 months ago.</span>
      </div>
      <button class="sketch-icon-button" type="button" aria-label="More actions for Calendar Bridge" data-sketch-popover="menu_calendar___state__"><i data-icon="more"></i></button>
    </li>
    <li data-row="deploy">
      <span class="sketch-avatar square">DH</span>
      <div>
        <a href="#app">Deploy Helper with a very long name for a narrow screen</a>
        <span class="sketch-muted">Built-in integration. By sample-user-1</span>
        <span>Can read your profile.</span>
        <span class="sketch-muted">Connected 2 November 2026. Never used.</span>
      </div>
      <button class="sketch-icon-button" type="button" aria-label="More actions for Deploy Helper" data-sketch-popover="menu_deploy___state__"><i data-icon="more"></i></button>
    </li>
  </ul>
  <div class="apps_empty" data-empty hidden>
    <i data-icon="link"></i>
    <p><b>No app uses your account.</b></p>
    <p class="sketch-muted">An app shows here after you connect it from the catalog.</p>
  </div>
  <div class="sketch-menu" id="menu_notes___state__">
    <button class="sketch-menu-item" type="button" data-sketch-open="confirm_notes___state__">Disconnect</button>
  </div>
  <div class="sketch-menu" id="menu_calendar___state__">
    <button class="sketch-menu-item" type="button" data-sketch-toast="Calendar Bridge works the same as Notes Sync in this sketch.">Disconnect</button>
  </div>
  <div class="sketch-menu" id="menu_deploy___state__">
    <button class="sketch-menu-item" type="button" data-sketch-toast="Deploy Helper works the same as Notes Sync in this sketch.">Disconnect</button>
  </div>
  <dialog class="sketch-dialog" id="confirm_notes___state__" aria-labelledby="confirm_notes_title___state__">
    <h2 id="confirm_notes_title___state__">Disconnect Notes Sync?</h2>
    <p>Notes Sync can no longer read your profile or your email address. To use it again, connect it again from the catalog.</p>
    <div class="sketch-row">
      <a class="sketch-button" href="#disconnected">Disconnect</a>
      <button class="sketch-button secondary" type="button" data-sketch-close autofocus>Cancel</button>
    </div>
  </dialog>
</template>

<template id="app">
  <a href="#list"><i data-icon="arrow-left"></i>Connected apps</a>
  <div class="apps_head">
    <span class="sketch-avatar square">NS</span>
    <div><h1>Notes Sync</h1><span class="sketch-muted">By Studio North</span></div>
    <span class="apps_badge"><i data-icon="check"></i>Connected</span>
    <button class="sketch-icon-button" type="button" aria-label="More options for Notes Sync" data-sketch-popover="app_menu"><i data-icon="more"></i></button>
  </div>
  <div class="sketch-menu" id="app_menu">
    <a class="sketch-menu-item" href="#confirm">Disconnect</a>
  </div>
  <p>Notes Sync keeps your notes in step with your account. It reads your profile to show your name, and it reads your email address to send you a copy.</p>
  <h2>Access</h2>
  <dl class="apps_facts">
    <dt class="sketch-muted">Can send data to</dt><dd>api.notes-sync.example</dd>
    <dt class="sketch-muted">Sign-in</dt><dd>Required</dd>
    <dt class="sketch-muted">Connected</dt><dd>3 March 2025</dd>
    <dt class="sketch-muted">Last used</dt><dd>Today</dd>
  </dl>
  <h2>What Notes Sync can do</h2>
  <ul class="apps_tools" id="tools">
    <li>Read your profile</li>
    <li>Read your email address</li>
    <li>Read your notes</li>
    <li data-extra hidden>Change your notes</li>
    <li data-extra hidden>Make a new note</li>
    <li data-extra hidden>Delete a note</li>
  </ul>
  <button class="sketch-button secondary" type="button" aria-expanded="false" aria-controls="tools" data-tools><span>Show all 6</span><span class="apps_more_arrow"><i data-icon="chevron-down"></i></span></button>
  <div class="apps_account">
    <i data-icon="check"></i><span>Your account is connected to Notes Sync.</span>
    <a class="sketch-button secondary" href="#confirm">Disconnect</a>
  </div>
</template>

<script src="../../../assets/sketch.js"></script>
<script>
  // The values of transitions.json. The CSS above uses the same values for the tool list and its arrow.
  const transition_records = [
    {label: 'tools-open', element: 'tool list', property: 'height', duration: 200, delay: 0, easing: 'cubic-bezier(0.165, 0.84, 0.44, 1)'},
    {label: 'tools-open', element: 'arrow of Show all', property: 'rotate', duration: 60, delay: 0, easing: 'cubic-bezier(0.4, 0, 0.2, 1)'}
  ];
  window.__sketchTransitions = transition_records;

  document.querySelectorAll('[data-state]').forEach(section => {
    const state = section.dataset.state;
    section.innerHTML = document.getElementById('frame').innerHTML;
    section.querySelector('main').innerHTML = document.getElementById(section.dataset.page).innerHTML.replaceAll('__state__', state);
    (section.dataset.hide || '').split(' ').filter(Boolean).forEach(row => section.querySelector(`[data-row="${row}"]`)?.remove());
    if (section.dataset.page === 'apps' && !section.querySelector('[data-row]')) {
      section.querySelector('.apps_list').remove();
      section.querySelector('[data-count]').remove();
      section.querySelector('[data-empty]').hidden = false;
    }
    if (section.dataset.openPart) section.querySelector(`#${section.dataset.openPart}_${state}`)?.setAttribute('data-open', '');
  });

  // Show all opens the rest of the tool list. The list grows from its short height to its full height.
  document.addEventListener('click', event => {
    const button = event.target.closest('[data-tools]');
    if (!button) return;
    const list = document.getElementById(button.getAttribute('aria-controls'));
    const open = button.getAttribute('aria-expanded') !== 'true';
    const from = list.offsetHeight;
    list.querySelectorAll('[data-extra]').forEach(item => { item.hidden = !open; });
    const to = list.offsetHeight;
    list.style.height = from + 'px';
    list.offsetHeight;
    list.style.height = to + 'px';
    list.addEventListener('transitionend', () => { list.style.height = ''; }, {once: true});
    button.setAttribute('aria-expanded', String(open));
    button.firstElementChild.textContent = open ? 'Show fewer' : 'Show all 6';
  });

  initSketch();

  // A confirmation that opens with its state has no visible opener, because its menu is closed. On close, it gives the focus to the More button of its row.
  document.querySelectorAll('dialog[id^="confirm"]').forEach(dialog => {
    dialog.addEventListener('close', () => {
      if (dialog.sketchOpener?.checkVisibility()) return;
      dialog.closest('[data-state]').querySelector('[data-sketch-popover^="menu_notes"]')?.focus();
    });
  });

  // A state with a toast shows it when the state opens. A state without a toast closes the toast of the state before.
  const show_toast = () => {
    const section = [...document.querySelectorAll('[data-state]')].find(item => !item.hidden);
    if (section?.dataset.toast) sketchToast(section.dataset.toast, section.querySelector('h1'));
    else document.querySelectorAll('.sketch-toast').forEach(toast => { toast.hidden = true; });
  };
  addEventListener('hashchange', show_toast);
  show_toast();
</script>
