<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice message and recording sketch</title>
<link rel="stylesheet" href="../../../assets/sketch.css">
<style>
  /* A phone screen. The frame keeps the width of a phone in a wide window, so each part acts as it does on a phone. */
  html { height: 100%; }
  body[data-sketch] { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  [data-sketch] > [data-state] { flex: 1; min-height: 0; }
  [data-sketch] [data-screen] { height: 100%; }
  [data-sketch] .phone { position: relative; isolation: isolate; width: min(100%, 430px); height: 100%; margin: 0 auto; overflow: hidden; }
  [data-sketch] .phone_screen { position: absolute; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--sketch-page); }
  [data-sketch] .phone_body { grid-row: 2; min-height: 0; padding: 4px 16px 16px; overflow-y: auto; }
  [data-sketch] .phone_body > p { margin: 0 0 12px; }
  [data-sketch] .phone_foot { grid-row: 3; display: flex; align-items: center; gap: 8px; padding: 8px 16px 16px; }
  [data-sketch] .phone_search { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 44px; padding: 0 14px; border: var(--sketch-stroke) solid var(--sketch-ink); border-radius: 22px 20px 23px 19px / 20px 23px 19px 22px; text-decoration: none; }
  [data-sketch] .phone_search input { flex: 1; min-width: 0; min-height: 40px; padding: 0; background: none; border: 0; outline: 0; }
  [data-sketch] .phone_search:has(input:focus-visible) { outline: var(--sketch-stroke) solid var(--sketch-ink); outline-offset: 2px; }
  [data-sketch] .phone_round { border: var(--sketch-stroke) solid var(--sketch-ink); border-radius: 50% 46% 52% 48% / 48% 52% 46% 50%; }
  @media (min-width: 600px) { [data-sketch] .phone { border-inline: var(--sketch-stroke) solid var(--sketch-muted); } }
  /* A plain box stands for a part that this pattern does not draw. It names the part, and the pattern that draws it. */
  [data-sketch] .part_box { display: grid; place-content: center; justify-items: center; gap: 2px; min-height: 88px; padding: 12px; border: var(--sketch-stroke) solid var(--sketch-muted); border-radius: var(--sketch-wobble); text-align: center; text-decoration: none; }
  /* Each motion value below comes from transitions.json. */
  [data-sketch] { --phone_out: cubic-bezier(0.23, 1, 0.32, 1); }
  /* A pressed row or button shrinks and takes a soft fill while the finger is down. */
  [data-sketch] .phone_press:active { background-color: var(--sketch-wash); transform: scale(0.96); }
  @media (prefers-reduced-motion: no-preference) { [data-sketch] .phone_press { transition: transform 120ms var(--phone_out), background-color 120ms var(--phone_out); } }
  /* The messages of the chat are a plain box. The voice messages are below it. */
  [data-sketch] .voice_thread { display: grid; grid-template-rows: minmax(88px, 1fr); grid-auto-rows: auto; gap: 8px; }
  /* The player: a play button, the waveform and the duration. The bars that played are in full ink. */
  [data-sketch] .voice_player { justify-self: start; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 8px; width: min(100%, 300px); padding: 4px 12px 4px 4px; border: var(--sketch-stroke) solid var(--sketch-ink); border-radius: var(--sketch-wobble); }
  [data-sketch] .voice_player.own { justify-self: end; background: var(--sketch-ink); color: var(--sketch-page); }
  [data-sketch] .voice_player.own .sketch-icon-button:hover { background: color-mix(in srgb, var(--sketch-page) 20%, transparent); }
  [data-sketch] .voice_player.playing { background: var(--sketch-wash); }
  [data-sketch] .voice_wave { display: flex; align-items: center; gap: 2px; min-width: 0; height: 32px; overflow: hidden; }
  [data-sketch] .voice_wave i { flex: 1 1 3px; max-width: 3px; min-width: 2px; border-radius: 2px; background: currentColor; opacity: .4; }
  [data-sketch] .voice_wave i.played, [data-sketch] .voice_recording .voice_wave i { opacity: 1; }
  [data-sketch] .voice_time { font-variant-numeric: tabular-nums; }
  /* The recording bar replaces the message field. */
  [data-sketch] .voice_recording { gap: 8px; }
  [data-sketch] .voice_recording .voice_wave { flex: 1; justify-content: space-between; }
  [data-sketch] .voice_notice { display: grid; justify-items: start; gap: 8px; margin-top: 8px; padding: 12px; border: calc(var(--sketch-stroke) * 2) solid var(--sketch-ink); border-radius: var(--sketch-wobble); }
  [data-sketch] .voice_notice p { margin: 0; }
</style>
<body data-sketch>

<section data-state="idle">
  <div data-screen="voice_chat"></div>
</section>
<section data-state="playing">
  <div data-screen="voice_chat" data-show="playing"></div>
</section>
<section data-state="recording">
  <div data-screen="voice_chat" data-show="recording"></div>
</section>
<section data-state="sent">
  <div data-screen="voice_chat" data-show="sent"></div>
</section>
<section data-state="no-microphone">
  <div data-screen="voice_chat" data-show="blocked"></div>
</section>

<!-- The voice messages and the message field of one chat page. The parts "playing", "recording", "sent" and "blocked" draw the states. -->
<template id="voice_chat">
<div class="phone">
  <main class="phone_screen">
    <div class="phone_body voice_thread">
      <div class="part_box"><strong>Chat page</strong><span>The messages before the voice message.</span></div>
      <div class="voice_player" role="group" aria-label="Voice message from Mara Lind, 12 seconds" data-part="!playing">
        <button class="sketch-icon-button phone_press" type="button" aria-label="Play" data-go="playing" data-focus-on="pause" data-name="play"><svg class="sketch-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg></button>
        <span class="voice_wave" aria-hidden="true"><i style="height:8px"></i><i style="height:14px"></i><i style="height:22px"></i><i style="height:12px"></i><i style="height:26px"></i><i style="height:18px"></i><i style="height:10px"></i><i style="height:24px"></i><i style="height:30px"></i><i style="height:16px"></i><i style="height:8px"></i><i style="height:20px"></i><i style="height:28px"></i><i style="height:14px"></i><i style="height:22px"></i><i style="height:10px"></i><i style="height:18px"></i><i style="height:26px"></i><i style="height:12px"></i><i style="height:8px"></i><i style="height:16px"></i><i style="height:24px"></i><i style="height:20px"></i><i style="height:12px"></i><i style="height:28px"></i><i style="height:18px"></i><i style="height:10px"></i><i style="height:22px"></i><i style="height:14px"></i><i style="height:8px"></i></span>
        <span class="voice_time">0:12</span>
      </div>
      <div class="voice_player playing" role="group" aria-label="Voice message from Mara Lind, 12 seconds" data-part="playing">
        <button class="sketch-icon-button phone_press" type="button" aria-label="Pause" data-go="idle" data-focus-on="play" data-name="pause"><svg class="sketch-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
        <span class="voice_wave" aria-hidden="true"><i class="played" style="height:8px"></i><i class="played" style="height:14px"></i><i class="played" style="height:22px"></i><i class="played" style="height:12px"></i><i class="played" style="height:26px"></i><i class="played" style="height:18px"></i><i class="played" style="height:10px"></i><i class="played" style="height:24px"></i><i class="played" style="height:30px"></i><i class="played" style="height:16px"></i><i style="height:8px"></i><i style="height:20px"></i><i style="height:28px"></i><i style="height:14px"></i><i style="height:22px"></i><i style="height:10px"></i><i style="height:18px"></i><i style="height:26px"></i><i style="height:12px"></i><i style="height:8px"></i><i style="height:16px"></i><i style="height:24px"></i><i style="height:20px"></i><i style="height:12px"></i><i style="height:28px"></i><i style="height:18px"></i><i style="height:10px"></i><i style="height:22px"></i><i style="height:14px"></i><i style="height:8px"></i></span>
        <span class="voice_time" data-play-time>0:04</span>
      </div>
      <div class="voice_player own" role="group" aria-label="Your voice message, 3 seconds" data-part="sent">
        <button class="sketch-icon-button" type="button" aria-label="Play your message" data-sketch-toast="Your message plays (sample)"><svg class="sketch-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg></button>
        <span class="voice_wave" aria-hidden="true"><i style="height:8px"></i><i style="height:14px"></i><i style="height:22px"></i><i style="height:12px"></i><i style="height:26px"></i><i style="height:18px"></i><i style="height:10px"></i><i style="height:24px"></i><i style="height:30px"></i><i style="height:16px"></i><i style="height:8px"></i><i style="height:20px"></i></span>
        <span class="voice_time">0:03</span>
      </div>
      <div class="voice_notice" role="alert" data-part="blocked">
        <p>The app cannot use the microphone.</p>
        <button class="sketch-button secondary" type="button" data-sketch-toast="The settings of the phone open (sample)">Open settings</button>
      </div>
    </div>
    <footer class="phone_foot" data-part="!recording">
      <label class="phone_search"><input type="text" aria-label="Message" placeholder="Message"></label>
      <button class="sketch-icon-button phone_round phone_press" type="button" aria-label="Record a voice message" data-go="recording" data-focus-on="send" data-name="record"><svg class="sketch-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM6 11a6 6 0 0 0 12 0M12 17v4"/></svg></button>
    </footer>
    <footer class="phone_foot voice_recording" role="group" aria-label="Recording" data-part="recording">
      <button class="sketch-icon-button phone_press" type="button" aria-label="Cancel the recording" data-go="idle" data-focus-on="record" data-escape><i data-icon="close"></i></button>
      <span class="voice_time" role="timer" aria-label="Recording time" data-record-time>0:03</span>
      <span class="voice_wave" aria-hidden="true"><i style="height:8px"></i><i style="height:14px"></i><i style="height:22px"></i><i style="height:12px"></i><i style="height:26px"></i><i style="height:18px"></i><i style="height:10px"></i><i style="height:24px"></i><i style="height:30px"></i><i style="height:16px"></i><i style="height:8px"></i><i style="height:20px"></i><i style="height:28px"></i><i style="height:14px"></i><i style="height:22px"></i><i style="height:10px"></i><i style="height:18px"></i><i style="height:26px"></i><i style="height:12px"></i><i style="height:8px"></i><i style="height:16px"></i><i style="height:24px"></i><i style="height:20px"></i><i style="height:12px"></i><i style="height:28px"></i><i style="height:18px"></i><i style="height:10px"></i><i style="height:22px"></i><i style="height:14px"></i><i style="height:8px"></i></span>
      <button class="sketch-icon-button phone_round phone_press" type="button" aria-label="Send the recording" data-go="sent" data-focus-on="record" data-name="send"><i data-icon="send"></i></button>
    </footer>
  </main>
</div>
</template>

<script>
/* The screens of a pattern sketch. This script runs before the kit script.
   A block with data-screen takes a copy of the <template> with that id. Its data-show names the parts that the state shows.
   In a template, data-part="name" shows an element only with that part, and "!name" only without it.
   A link to "#state" and a button with data-go change the state. data-move names the transition that the change plays.
   After the change, the element whose data-focus names a shown part takes the focus.
   A control with data-focus-on="name" gives the focus to the shown element with data-name="name".
   Escape presses the shown data-escape button. */
(() => {
  const has_part = (shown, names) => {
    const list = names.split(' ').filter(Boolean), wanted = list.filter(name => name[0] !== '!');
    return list.every(name => name[0] !== '!' || !shown.includes(name.slice(1))) && (!wanted.length || wanted.some(name => shown.includes(name)));
  };
  const parts_of = block => (block.dataset.show || '').split(' ');
  document.querySelectorAll('[data-screen]').forEach((block, index) => {
    const copy = document.getElementById(block.dataset.screen).content.cloneNode(true);
    const shown = parts_of(block);
    ['id', 'for', 'name', 'aria-controls', 'aria-labelledby', 'aria-describedby'].forEach(name =>
      copy.querySelectorAll(`[${name}]`).forEach(node => node.setAttribute(name, `s${index}_${node.getAttribute(name)}`)));
    copy.querySelectorAll('[data-part]').forEach(part => { part.hidden = !has_part(shown, part.dataset.part); });
    block.append(copy);
  });
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const shown_block = () => document.querySelector('[data-state]:not([hidden]) [data-screen]');
  /* A move plays one transition of transitions.json. play adds the class that holds the animation, and takes it away at the end. */
  window.pattern_moves = {};
  window.pattern_play = (node, name, after) => {
    if (reduced.matches) { if (after) after(); return; }
    const done = event => {
      if (event.target !== node) return;
      node.removeEventListener('animationend', done);
      node.classList.remove(name);
      if (after) after();
    };
    node.addEventListener('animationend', done);
    node.classList.add(name);
  };
  let focus_next = false, focus_name = '';
  window.pattern_go = (state, move, from) => {
    const to = document.querySelector(`[data-state="${state}"] [data-screen]`);
    if (to && to !== from && move && !reduced.matches) pattern_moves[move](from, to);
    focus_next = true;
    location.hash = state;
  };
  /* The capture phase keeps the kit from pressing a chip in the state that the reader leaves. */
  document.addEventListener('click', event => {
    const control = event.target.closest('[data-go], a[href^="#"]');
    const block = control && control.closest('[data-screen]');
    if (!block || control.matches(':disabled')) return;
    event.preventDefault();
    event.stopPropagation();
    focus_name = control.dataset.focusOn || '';
    pattern_go(control.dataset.go || control.getAttribute('href').slice(1), control.dataset.move, block);
  }, true);
  addEventListener('hashchange', () => requestAnimationFrame(() => {
    const block = shown_block();
    const wanted = focus_name ? `[data-name="${focus_name}"]` : '[data-focus]';
    const target = focus_next && block && [...block.querySelectorAll(wanted)].find(node => !node.closest('[hidden]') && (focus_name || has_part(parts_of(block), node.dataset.focus)));
    focus_next = false;
    focus_name = '';
    if (target) target.focus({preventScroll: true});
  }));
  document.addEventListener('keydown', event => {
    const block = event.key === 'Escape' && shown_block();
    const close = block && [...block.querySelectorAll('[data-escape]')].find(button => button.checkVisibility());
    if (close) close.click();
  });
})();
/* The player shows the time and the bars that played. The recording bar counts the time, as the source does, each 250ms. */
(() => {
  const shown = name => document.querySelector(`[data-state="${name}"]:not([hidden]) [data-screen]`);
  const clock = seconds => `0:${String(Math.floor(seconds)).padStart(2, '0')}`;
  let played = 4, recorded = 3;
  const draw = block => {
    const bars = [...block.querySelectorAll('.voice_player.playing .voice_wave i')];
    bars.forEach((line, index) => line.classList.toggle('played', index < bars.length * played / 12));
    block.querySelector('[data-play-time]').textContent = clock(played);
    block.querySelector('[data-record-time]').textContent = clock(recorded);
  };
  setInterval(() => {
    const player = shown('playing'), bar = shown('recording');
    if (player) played += .25;
    if (bar) recorded += .25;
    if (player && played >= 12) pattern_go('idle', null, player);
    else if (player || bar) draw(player || bar);
  }, 250);
  /* Play starts at the first bar, and the microphone button starts the time at zero. */
  document.addEventListener('click', event => {
    const control = event.target.closest('[data-go="playing"], [data-go="recording"]');
    if (!control || !control.closest('[data-screen]')) return;
    if (control.dataset.go === 'playing') played = 0;
    else recorded = 0;
    draw(document.querySelector(`[data-state="${control.dataset.go}"] [data-screen]`));
  }, true);
})();
</script>
<script src="../../../assets/sketch.js"></script>
