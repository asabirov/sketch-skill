<!doctype html>
<!--
captured 2026-11-11 from frames. Frame time 00:00.00 is 0:20 of the video.
The Source line of pattern.md names the app and the video.
Best for: a mobile character or avatar builder where the user picks parts and sees the result at
once, then saves to a profile. Use it for a profile avatar maker or a game character maker.
Row opens: no rows.
The sketch draws a round cat named Mochi; the source app draws a person.
Transitions, with the values of transitions.json:
- Each part pick re-renders the preview at once, no motion (0 ms, estimated).
- The DONE tap shows a loading screen for about 10300 ms (estimated, video 2:06.5 to 2:16.9), then the profile opens.
Reduced motion: the loading screen shortens, and the spinner stops; the state changes stay.
-->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar maker</title>
<link rel="stylesheet" href="../../../assets/sketch.css">
<style>
  [data-sketch] h1, [data-sketch] h2, [data-sketch] p { margin: 0; }

  /* Builder: one centred phone column. */
  [data-sketch] .builder {
    width: min(420px, 100%); margin: 0 auto; min-height: 100vh;
    display: grid; grid-template-rows: auto auto auto 1fr; align-content: start;
  }
  [data-sketch] .bar {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: var(--sketch-stroke) solid var(--sketch-ink);
  }
  [data-sketch] .done {
    min-height: 44px; padding: 0 8px; background: none; border: 0; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 15px; letter-spacing: .4px; text-transform: uppercase;
  }
  [data-sketch] .done:hover { background: var(--sketch-wash); }
  [data-sketch] .done:focus-visible { outline: 2px solid var(--sketch-ink); outline-offset: 3px; }

  /* Preview: the avatar stands on a grey band, its body on the bottom edge. */
  [data-sketch] .preview {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px;
    padding: 12px 16px 0;
    background: var(--sketch-wash); border-bottom: var(--sketch-stroke) solid var(--sketch-ink);
  }
  [data-sketch] [data-preview] { align-self: stretch; display: flex; justify-content: center; }
  [data-sketch] .pv-svg {
    width: 300px; max-width: 100%; height: auto; display: block;
    fill: none; stroke: var(--sketch-ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }
  [data-sketch] .pv-caption { overflow-wrap: anywhere; text-align: center; }

  /* Icon tabs: the chosen one is underlined and lightly filled. */
  [data-sketch] .tabs {
    display: flex; gap: 2px; overflow-x: auto; padding: 4px 8px;
    border-bottom: var(--sketch-stroke) solid var(--sketch-ink);
  }
  [data-sketch] .tab {
    min-width: 44px; min-height: 44px; display: inline-grid; place-items: center; padding: 6px 10px;
    background: none; border: 0; border-bottom: 3px solid transparent; cursor: pointer;
  }
  [data-sketch] .tab .tab-icon { width: 22px; height: 22px; }
  [data-sketch] .tab:hover { background: var(--sketch-wash); }
  [data-sketch] .tab[aria-selected="true"] { border-bottom-color: var(--sketch-ink); background: var(--sketch-wash); }
  [data-sketch] .tab:focus-visible { outline: 2px solid var(--sketch-ink); outline-offset: 3px; }

  /* The chosen tab's lists: a small heading, then swatches or a two-column grid. */
  [data-sketch] .panels { padding: 16px; overflow-y: auto; }
  [data-sketch] .panel { display: grid; gap: 8px; align-content: start; }
  [data-sketch] .list-heading {
    font-size: 12px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase;
    color: var(--sketch-muted); margin-top: 10px;
  }
  [data-sketch] .panel .list-heading:first-child { margin-top: 0; }
  [data-sketch] .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  [data-sketch] .thumbs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

  /* A colour swatch: a square with a tone fill. The chosen one has a bold outline and a light fill. */
  [data-sketch] .swatch { position: relative; width: 48px; height: 48px; padding: 6px; background: none; border: 0; border-radius: var(--sketch-wobble); cursor: pointer; }
  [data-sketch] .swatch-sq { display: block; width: 100%; height: 100%; border: var(--sketch-stroke) solid var(--sketch-ink); border-radius: 6px 4px 5px 4px / 4px 6px 4px 5px; }
  [data-sketch] .swatch[data-tone="0"] .swatch-sq { background: none; }
  [data-sketch] .swatch[data-tone="1"] .swatch-sq { background: var(--sketch-wash); }
  [data-sketch] .swatch[data-tone="2"] .swatch-sq { background: color-mix(in srgb, var(--sketch-ink) 45%, transparent); }
  [data-sketch] .swatch[data-tone="3"] .swatch-sq { background: var(--sketch-ink); }
  [data-sketch] .swatch:hover { background: var(--sketch-wash); }
  [data-sketch] .swatch[aria-pressed="true"] { background: var(--sketch-wash); }
  [data-sketch] .swatch[aria-pressed="true"] .swatch-sq { border-width: 3px; }
  [data-sketch] .swatch:focus-visible { outline: 2px solid var(--sketch-ink); outline-offset: 3px; }

  /* A thumbnail: a small avatar in a two-column grid. The chosen one has a bold outline and a light fill. */
  [data-sketch] .thumb {
    position: relative; display: grid; place-items: center; aspect-ratio: 4/3; padding: 8px;
    background: none; border: var(--sketch-stroke) solid var(--sketch-ink); border-radius: var(--sketch-wobble); cursor: pointer;
  }
  [data-sketch] .thumb:hover { background: var(--sketch-wash); }
  [data-sketch] .thumb[aria-pressed="true"] { background: var(--sketch-wash); border-width: 3px; }
  [data-sketch] .thumb:focus-visible { outline: 2px solid var(--sketch-ink); outline-offset: 3px; }
  [data-sketch] .thumb-svg { width: 100%; height: 100%; max-height: 64px; display: block; fill: none; stroke: var(--sketch-ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* Avatar parts. Defaults show; other variants hide until their data attribute is set. */
  [data-sketch] .pv-skin :is(.pv-head, .pv-body-slim, .pv-body-average, .pv-body-large) { fill: none; }
  [data-sketch] .pv-body-average, [data-sketch] .pv-body-large,
  [data-sketch] .pv-face-laughing, [data-sketch] .pv-face-surprised,
  [data-sketch] .pv-ears-long, [data-sketch] .pv-ears-tufted,
  [data-sketch] .pv-glasses-round, [data-sketch] .pv-glasses-square,
  [data-sketch] .pv-freckles-freckles, [data-sketch] .pv-freckles-blush,
  [data-sketch] .pv-earrings-hoops, [data-sketch] .pv-earrings-studs,
  [data-sketch] .pv-whiskers-short, [data-sketch] .pv-whiskers-long,
  [data-sketch] .pv-headwear-beanie, [data-sketch] .pv-headwear-cap { display: none; }
  [data-sketch] .pv-body-slim, [data-sketch] .pv-face-smile, [data-sketch] .pv-ears-pointed { display: block; }

  [data-sketch] .pv-ears :is(path, circle), [data-sketch] .pv-headwear path { fill: var(--sketch-ink); stroke: none; }
  [data-sketch] .pv-freckles :is(path, circle) { fill: var(--sketch-ink); stroke: none; }
  [data-sketch] .pv-earrings circle { fill: none; stroke: var(--sketch-ink); }

  [data-sketch][data-body="average"] .pv-body-slim, [data-sketch][data-body="large"] .pv-body-slim { display: none; }
  [data-sketch][data-body="average"] .pv-body-average { display: block; }
  [data-sketch][data-body="large"] .pv-body-large { display: block; }
  [data-sketch][data-expression="laughing"] .pv-face-smile, [data-sketch][data-expression="surprised"] .pv-face-smile { display: none; }
  [data-sketch][data-expression="laughing"] .pv-face-laughing { display: block; }
  [data-sketch][data-expression="surprised"] .pv-face-surprised { display: block; }
  [data-sketch][data-hair="long"] .pv-ears-pointed, [data-sketch][data-hair="bun"] .pv-ears-pointed { display: none; }
  [data-sketch][data-hair="long"] .pv-ears-long { display: block; }
  [data-sketch][data-hair="bun"] .pv-ears-tufted { display: block; }
  [data-sketch][data-glasses="round"] .pv-glasses-round { display: block; }
  [data-sketch][data-glasses="square"] .pv-glasses-square { display: block; }
  [data-sketch][data-freckles="freckles"] .pv-freckles-freckles { display: block; }
  [data-sketch][data-freckles="blush"] .pv-freckles-blush { display: block; }
  [data-sketch][data-earrings="hoops"] .pv-earrings-hoops { display: block; }
  [data-sketch][data-earrings="studs"] .pv-earrings-studs { display: block; }
  [data-sketch][data-beard="moustache"] .pv-whiskers-short { display: block; }
  [data-sketch][data-beard="beard"] .pv-whiskers-long { display: block; }
  [data-sketch][data-headwear="beanie"] .pv-headwear-beanie { display: block; }
  [data-sketch][data-headwear="cap"] .pv-headwear-cap { display: block; }

  /* Fur colour fills the head and body; dark fur reverses the face parts so they stay visible. */
  [data-sketch][data-skin="tan"] :is(.pv-head, .pv-body-slim, .pv-body-average, .pv-body-large) { fill: var(--sketch-wash); }
  [data-sketch][data-skin="brown"] :is(.pv-head, .pv-body-slim, .pv-body-average, .pv-body-large) { fill: color-mix(in srgb, var(--sketch-ink) 45%, transparent); }
  [data-sketch][data-skin="dark"] :is(.pv-head, .pv-body-slim, .pv-body-average, .pv-body-large) { fill: var(--sketch-ink); }
  [data-sketch][data-skin="dark"] .pv-face :is(.pv-eye, .pv-mouth), [data-sketch][data-skin="dark"] .pv-nose, [data-sketch][data-skin="dark"] .pv-whiskers path { stroke: var(--sketch-page); }
  [data-sketch][data-skin="dark"] :is(.pv-ears path, .pv-ears circle, .pv-headwear path) { fill: var(--sketch-page); stroke: none; }
  [data-sketch][data-skin="dark"] .pv-glasses :is(circle, path, rect) { stroke: var(--sketch-page); }
  [data-sketch][data-skin="dark"] .pv-freckles :is(path, circle) { fill: var(--sketch-page); stroke: none; }
  [data-sketch][data-skin="dark"] .pv-earrings circle { stroke: var(--sketch-page); }

  /* The Background pick fills the grey preview band; a dark background reverses the whole avatar. */
  [data-sketch][data-bg="medium"] .preview { background: color-mix(in srgb, var(--sketch-ink) 45%, transparent); }
  [data-sketch][data-bg="dark"] .preview { background: var(--sketch-ink); }
  [data-sketch][data-bg="dark"] .preview .pv-svg { stroke: var(--sketch-page); }
  [data-sketch][data-bg="dark"] .preview :is(.pv-ears path, .pv-ears circle, .pv-headwear path, .pv-freckles path, .pv-freckles circle) { fill: var(--sketch-page); stroke: none; }
  [data-sketch][data-bg="dark"][data-skin="dark"] .preview :is(.pv-head, .pv-body-slim, .pv-body-average, .pv-body-large) { fill: var(--sketch-wash); }

  /* Loading screen. */
  [data-sketch] .loading {
    position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; align-content: center; gap: 16px;
    background: var(--sketch-page);
  }
  [data-sketch] .spinner { width: 40px; height: 40px; border: 3px solid var(--sketch-wash); border-top-color: var(--sketch-ink); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { [data-sketch] .spinner { animation: none; } }

  /* Profile: a grey banner with the avatar and a gear, then the name, links, actions, stats and a bottom bar. */
  [data-sketch] .profile {
    width: min(420px, 100%); margin: 0 auto; min-height: 100vh;
    display: flex; flex-direction: column; align-items: stretch;
  }
  [data-sketch] .pf-banner {
    position: relative; display: grid; place-items: center; align-content: end;
    padding: 12px 16px 0; background: var(--sketch-wash); border-bottom: var(--sketch-stroke) solid var(--sketch-ink);
  }
  [data-sketch] .pf-gear { position: absolute; top: 8px; right: 8px; }
  [data-sketch] .profile-avatar { width: 200px; }
  [data-sketch] .pf-body { display: grid; gap: 12px; align-content: start; padding: 16px; }
  [data-sketch] .pf-name-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  [data-sketch] .pf-flag { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  [data-sketch] .pf-follows { display: flex; gap: 16px; }
  [data-sketch] .pf-actions { display: flex; align-items: center; gap: 8px; }
  [data-sketch] .stat-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  [data-sketch] .stat-tile { display: grid; gap: 4px; padding: 16px; border: var(--sketch-stroke) solid var(--sketch-ink); border-radius: var(--sketch-wobble); text-align: left; }
  [data-sketch] .stat-tile strong { font-size: 20px; line-height: 1.2; }
  [data-sketch] .stat-tile span { color: var(--sketch-muted); }
  [data-sketch] .pf-bottom-bar {
    margin-top: auto; display: flex; gap: 4px; padding: 8px 16px;
    border-top: var(--sketch-stroke) solid var(--sketch-ink); background: var(--sketch-page);
  }
  [data-sketch] .pf-bottom-bar a {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: 1;
    min-width: 44px; min-height: 44px; text-decoration: none; border-radius: var(--sketch-wobble);
  }
  [data-sketch] .pf-bottom-bar a:hover { background: var(--sketch-wash); }
  [data-sketch] .pf-bottom-bar a[aria-current] { font-weight: 600; background: var(--sketch-wash); }
</style>
<body data-sketch>

<main class="builder" aria-label="Avatar builder">
  <header class="bar">
    <button class="sketch-icon-button" type="button" data-close aria-label="Close"><i data-icon="close"></i></button>
    <span class="sketch-spacer"></span>
    <button class="done" type="button" data-done>Done</button>
  </header>

  <div class="preview" aria-label="Live preview of the avatar">
    <p class="pv-caption sketch-muted" data-caption></p>
    <div data-preview></div>
  </div>

  <nav class="tabs" role="tablist" aria-label="Part types" data-tabs></nav>

  <div class="panels" data-panels></div>
</main>

<div class="loading" hidden aria-live="polite">
  <span class="spinner" aria-hidden="true"></span>

</div>

<section data-state="picker"></section>
<section data-state="skin-tone"></section>
<section data-state="body"></section>
<section data-state="expression"></section>
<section data-state="hairstyle"></section>
<section data-state="glasses-none"></section>

<section data-state="facial-hair"></section>
<section data-state="headwear"></section>
<section data-state="background"></section>

<section data-state="save" class="profile" aria-label="Profile with the saved avatar" hidden>
  <header class="pf-banner">
    <button class="sketch-icon-button pf-gear" type="button" data-sketch-toast="Settings (sample)" aria-label="Settings"><i data-icon="settings"></i></button>
    <div class="profile-avatar" data-profile-avatar></div>
  </header>
  <div class="pf-body">
    <div class="pf-name-row">
      <h1>Mochi</h1>
      <svg class="pf-flag" viewBox="0 0 24 24" aria-label="Learning French"><path d="M5 3v18"/><path d="M5 4h11l-3.5 4L16 12H5z"/></svg>
    </div>
    <p class="sketch-muted">@mochi.cat</p>
    <p class="sketch-muted">Joined August 2023</p>
    <div class="pf-follows">
      <a href="#save">12 Following</a>
      <a href="#save">34 Followers</a>
    </div>
    <div class="pf-actions">
      <button class="sketch-button" type="button" data-sketch-toast="Friend request sent (sample)">Add friends</button>
      <button class="sketch-icon-button" type="button" data-sketch-toast="Profile shared (sample)" aria-label="Share"><i data-icon="external"></i></button>
    </div>
    <h2>Statistics</h2>
    <div class="stat-tiles">
      <div class="stat-tile"><strong>7 days</strong><span>Day streak</span></div>
      <div class="stat-tile"><strong>2,400</strong><span>Total XP</span></div>
      <div class="stat-tile"><strong>Emerald</strong><span>League</span></div>
      <div class="stat-tile"><strong>5</strong><span>Top 3 finishes</span></div>

  <nav class="pf-bottom-bar" aria-label="Sections">

    <a href="#save" aria-label="Quests"><i data-icon="calendar"></i></a>
    <a href="#save" aria-label="Leaderboard"><i data-icon="bell"></i></a>
    <a href="#save" aria-label="Shop"><i data-icon="search"></i></a>
    <a href="#save" aria-current="page" aria-label="Profile"><i data-icon="user"></i></a>
  </nav>
</section>

<script src="../../../assets/sketch.js"></script>
<script>
(() => {
  const body = document.body;
  const $ = s => document.querySelector(s);

  const ICONS = {
    skin: '<circle cx="12" cy="8" r="4"/><path d="M8.5 5.5 L7 1.5 L13 3.5 Z"/><path d="M15.5 5.5 L17 1.5 L11 3.5 Z"/><path d="M4 21 C5 16.5 8 14.5 12 14.5 C16 14.5 19 16.5 20 21"/>',
    expression: '<circle cx="12" cy="12" r="8"/><path d="M8.5 9.5v.01M15.5 9.5v.01M8.5 14c1.3 1.6 5.7 1.6 7 0"/>',
    hairstyle: '<circle cx="12" cy="14" r="5.5"/><path d="M6.5 11 L4.5 3 L13 8 Z"/><path d="M17.5 11 L19.5 3 L11 8 Z"/>',
    glasses: '<circle cx="8" cy="12" r="3.2"/><circle cx="16" cy="12" r="3.2"/><path d="M11.2 12h1.6"/>',
    'face-details': '<circle cx="12" cy="12" r="8"/><path d="M8.5 9.5v.01M15.5 9.5v.01M8.5 15.5v.01M15.5 15.5v.01"/>',
    earrings: '<circle cx="12" cy="10" r="3"/><path d="M12 13v3.5"/>',
    'facial-hair': '<circle cx="12" cy="12" r="6"/><path d="M6 11 L1 9.5 M6 13.5 L1.5 15 M18 11 L23 9.5 M18 13.5 L22.5 15"/>',
    headwear: '<path d="M4 14c1-6 6-8 8-8s7 2 8 8z"/><path d="M4 14h16"/>',
    background: '<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="12" cy="12" r="4"/>',
  };

  const TABS = [
    { id: 'skin', label: 'Fur and body', lists: [
      { heading: 'Fur color', kind: 'swatches', key: 'skin', options: [
        { value: 'light', label: 'Cream', tone: 0 },
        { value: 'tan', label: 'Ginger', tone: 1 },
        { value: 'brown', label: 'Grey', tone: 2 },
        { value: 'dark', label: 'Black', tone: 3 },
      ]},
      { heading: 'Body shape', kind: 'thumbs', key: 'body', options: [
        { value: 'slim', label: 'Slim' },
        { value: 'average', label: 'Round' },
        { value: 'large', label: 'Large' },
      ]},
    ]},
    { id: 'expression', label: 'Expression', lists: [
      { heading: 'Expression', kind: 'thumbs', key: 'expression', options: [
        { value: 'smile', label: 'Smile' },
        { value: 'laughing', label: 'Laughing' },
        { value: 'surprised', label: 'Surprised' },
      ]},
    ]},
    { id: 'hairstyle', label: 'Ears', lists: [
      { heading: 'Ears', kind: 'thumbs', key: 'hair', options: [
        { value: 'short', label: 'Pointed' },
        { value: 'long', label: 'Long' },
        { value: 'bun', label: 'Tufted' },
      ]},
    ]},
    { id: 'glasses', label: 'Glasses', lists: [
      { heading: 'Glasses color', kind: 'swatches', key: 'glassesColor', options: [
        { value: 'black', label: 'Black', tone: 3 },
        { value: 'brown', label: 'Brown', tone: 2 },
        { value: 'blue', label: 'Blue', tone: 1 },
        { value: 'clear', label: 'Clear', tone: 0 },
      ]},
      { heading: 'Glasses', kind: 'thumbs', key: 'glasses', options: [
        { value: 'none', label: 'None' },
        { value: 'round', label: 'Round' },
        { value: 'square', label: 'Square' },
      ]},
    ]},
    { id: 'face-details', label: 'Face details', lists: [
      { heading: 'Face details', kind: 'thumbs', key: 'freckles', options: [
        { value: 'none', label: 'None' },
        { value: 'freckles', label: 'Freckles' },
        { value: 'blush', label: 'Blush' },
      ]},
    ]},
    { id: 'earrings', label: 'Earrings', lists: [
      { heading: 'Earrings', kind: 'thumbs', key: 'earrings', options: [
        { value: 'none', label: 'None' },
        { value: 'hoops', label: 'Hoops' },
        { value: 'studs', label: 'Studs' },
      ]},
    ]},
    { id: 'facial-hair', label: 'Whiskers', lists: [
      { heading: 'Whisker color', kind: 'swatches', key: 'facialHairColor', options: [
        { value: 'black', label: 'Black', tone: 3 },
        { value: 'brown', label: 'Brown', tone: 2 },
        { value: 'blond', label: 'Grey', tone: 1 },
        { value: 'grey', label: 'White', tone: 0 },
      ]},
      { heading: 'Whiskers', kind: 'thumbs', key: 'beard', options: [
        { value: 'none', label: 'None' },
        { value: 'moustache', label: 'Short' },
        { value: 'beard', label: 'Long' },
      ]},
    ]},
    { id: 'headwear', label: 'Headwear', lists: [
      { heading: 'Headwear color', kind: 'swatches', key: 'headwearColor', options: [
        { value: 'black', label: 'Black', tone: 3 },
        { value: 'brown', label: 'Brown', tone: 2 },
        { value: 'blue', label: 'Blue', tone: 1 },
        { value: 'red', label: 'Red', tone: 0 },
      ]},
      { heading: 'Headwear', kind: 'thumbs', key: 'headwear', options: [
        { value: 'none', label: 'None' },
        { value: 'beanie', label: 'Beanie' },
        { value: 'cap', label: 'Cap' },
      ]},
    ]},
    { id: 'background', label: 'Background', lists: [
      { heading: 'Background', kind: 'swatches', key: 'bg', options: [
        { value: 'plain', label: 'Plain', tone: 0 },
        { value: 'light', label: 'Light', tone: 1 },
        { value: 'medium', label: 'Medium', tone: 2 },
        { value: 'dark', label: 'Dark', tone: 3 },
      ]},
    ]},
  ];

  const DEFAULT_PARTS = {
    skin: 'light', body: 'slim', expression: 'smile', hair: 'short',
    glasses: 'none', freckles: 'none', earrings: 'none', beard: 'none',
    headwear: 'none', bg: 'plain',
    glassesColor: 'black', facialHairColor: 'black', headwearColor: 'black',
  };

  const STATES = {
    picker:         { tab: 'skin', parts: {}, caption: 'A round cat' },
    'skin-tone':    { tab: 'skin', parts: { skin: 'dark' }, caption: 'Black fur' },
    body:           { tab: 'skin', parts: { body: 'large' }, caption: 'Large body' },
    expression:     { tab: 'expression', parts: { expression: 'laughing' }, caption: 'Laughing expression' },
    hairstyle:      { tab: 'hairstyle', parts: { hair: 'long' }, caption: 'Long ears' },
    'glasses-none': { tab: 'glasses', parts: { glasses: 'none' }, caption: 'No glasses' },
    'face-details': { tab: 'face-details', parts: { freckles: 'freckles' }, caption: 'Freckles' },
    earrings:       { tab: 'earrings', parts: { earrings: 'hoops' }, caption: 'Hoop earrings' },
    glasses:        { tab: 'glasses', parts: { glasses: 'round', glassesColor: 'blue' }, caption: 'Round glasses with a colour' },
    'facial-hair':  { tab: 'facial-hair', parts: { beard: 'beard' }, caption: 'Whiskers' },
    headwear:       { tab: 'headwear', parts: { headwear: 'beanie', headwearColor: 'blue' }, caption: 'Beanie with a colour' },
    background:     { tab: 'background', parts: { bg: 'dark' }, caption: 'Solid background' },
    save:           { tab: 'skin', parts: {}, caption: 'Saved' },
  };

  const ORDER = ['picker', 'skin-tone', 'body', 'expression', 'hairstyle', 'glasses-none', 'face-details', 'earrings', 'glasses', 'facial-hair', 'headwear', 'background', 'save'];
  const CUMULATIVE = {};
  { let acc = {}; ORDER.forEach(id => { acc = { ...acc, ...STATES[id].parts }; CUMULATIVE[id] = { ...acc }; }); }

  const P = {
    body_slim: 'M52 178 C52 150 66 136 80 136 C94 136 108 150 108 178 Z',
    body_average: 'M48 178 C48 148 64 133 80 133 C96 133 112 148 112 178 Z',
    body_large: 'M44 178 C44 146 62 130 80 130 C98 130 116 146 116 178 Z',
    ears_pointed: 'M60 50 L64 22 L84 44 Z M100 50 L96 22 L76 44 Z',
    ears_long: 'M60 50 L62 12 L84 44 Z M100 50 L98 12 L76 44 Z',
    whiskers_short: 'M58 72 L46 68 M58 78 L46 78 M102 72 L114 68 M102 78 L114 78',
    whiskers_long: 'M58 72 L40 66 M58 78 L38 78 M58 84 L42 90 M102 72 L120 66 M102 78 L122 78 M102 84 L118 90',
    beanie: 'M52 62 C52 44 108 44 108 62 L104 62 C104 52 96 48 80 48 C64 48 56 52 56 62 Z',
    cap: 'M54 62 C54 44 106 44 106 62 C106 56 98 50 80 50 C62 50 54 56 54 62 Z',
  };

  function avatar_svg(label, extra_class) {
    return `<svg class="pv-svg${extra_class ? ' ' + extra_class : ''}" viewBox="0 0 160 178" role="img" aria-label="${label}">
      <g class="pv-skin">
        <path class="pv-body-slim" d="${P.body_slim}"/>
        <path class="pv-body-average" d="${P.body_average}"/>
        <path class="pv-body-large" d="${P.body_large}"/>
        <circle class="pv-head" cx="80" cy="70" r="26"/>
      </g>
      <g class="pv-ears pv-ears-pointed"><path d="${P.ears_pointed}"/></g>
      <g class="pv-ears pv-ears-long"><path d="${P.ears_long}"/></g>
      <g class="pv-ears pv-ears-tufted"><path d="${P.ears_pointed}"/><circle cx="64" cy="17" r="4.5"/><circle cx="96" cy="17" r="4.5"/></g>
      <path class="pv-nose" d="M80 75 L77 71 L83 71 Z"/>
      <g class="pv-face pv-face-smile"><circle class="pv-eye" cx="69" cy="70" r="2.6"/><circle class="pv-eye" cx="91" cy="70" r="2.6"/><path class="pv-mouth" d="M71 82 Q80 88 89 82"/></g>
      <g class="pv-face pv-face-laughing"><path class="pv-eye" d="M64 69 Q69 65 74 69"/><path class="pv-eye" d="M86 69 Q91 65 96 69"/><path class="pv-mouth" d="M71 82 Q80 92 89 82 Z"/></g>
      <g class="pv-face pv-face-surprised"><circle class="pv-eye" cx="69" cy="69" r="3"/><circle class="pv-eye" cx="91" cy="69" r="3"/><circle class="pv-mouth" cx="80" cy="84" r="4"/></g>
      <g class="pv-glasses pv-glasses-round"><circle cx="69" cy="70" r="9"/><circle cx="91" cy="70" r="9"/><path d="M78 70 H82"/></g>
      <g class="pv-glasses pv-glasses-square"><rect x="59" y="61" width="20" height="18" rx="3"/><rect x="81" y="61" width="20" height="18" rx="3"/><path d="M79 70 H81"/></g>
      <g class="pv-freckles pv-freckles-freckles"><circle cx="63" cy="80" r="1.6"/><circle cx="68" cy="84" r="1.6"/><circle cx="92" cy="84" r="1.6"/><circle cx="97" cy="80" r="1.6"/></g>
      <g class="pv-freckles pv-freckles-blush"><circle cx="60" cy="82" r="3.2"/><circle cx="100" cy="82" r="3.2"/></g>
      <g class="pv-earrings pv-earrings-hoops"><circle cx="53" cy="86" r="4"/><circle cx="107" cy="86" r="4"/></g>
      <g class="pv-earrings pv-earrings-studs"><circle cx="54" cy="88" r="2.4"/><circle cx="106" cy="88" r="2.4"/></g>
      <g class="pv-whiskers pv-whiskers-short"><path d="${P.whiskers_short}"/></g>
      <g class="pv-whiskers pv-whiskers-long"><path d="${P.whiskers_long}"/></g>
      <g class="pv-headwear pv-headwear-beanie"><path d="${P.beanie}"/></g>
      <g class="pv-headwear pv-headwear-cap"><path d="${P.cap}"/><path d="M106 62 C112 61 115 60 117 57"/></g>
    </svg>`;
  }

  const CAT_HEAD = '<circle cx="32" cy="28" r="13"/><path d="M21 22 L23 6 L35 15 Z"/><path d="M43 22 L41 6 L29 15 Z"/>';
  const CAT_BODY_HEAD = '<circle cx="32" cy="20" r="11"/><path d="M23 15 L25 2 L34 10 Z"/><path d="M41 15 L39 2 L30 10 Z"/>';
  const NONE = '<path d="M22 18 L42 38"/>';
  function thumb_svg(part, value) {
    let inner = '';
    if (part === 'body') {
      inner = CAT_BODY_HEAD + {
        slim: '<path d="M21 62c0-11 5-16 11-16s11 5 11 16z"/>',
        average: '<path d="M19 62c0-11 6-16 13-16s13 5 13 16z"/>',
        large: '<path d="M16 62c0-11 7-16 16-16s16 5 16 16z"/>',
      }[value];
    } else if (part === 'expression') {
      inner = CAT_HEAD + {
        smile: '<circle cx="27" cy="27" r="1.5"/><circle cx="37" cy="27" r="1.5"/><path d="M28 33.5c1.6 1.6 6.4 1.6 8 0"/>',
        laughing: '<path d="M25.5 25.5c1.4-1 3-1 4.4 0M34.1 25.5c1.4-1 3-1 4.4 0"/><path d="M28 33c1.6 2.4 6.4 2.4 8 0z"/>',
        surprised: '<circle cx="27" cy="27" r="1.8"/><circle cx="37" cy="27" r="1.8"/><circle cx="32" cy="33.5" r="2.6"/>',
      }[value];
    } else if (part === 'hair') {
      inner = '<circle cx="32" cy="28" r="13"/>' + {
        short: '<path d="M21 22 L23 6 L35 15 Z"/><path d="M43 22 L41 6 L29 15 Z"/>',
        long: '<path d="M20 22 L21 2 L36 15 Z"/><path d="M44 22 L43 2 L28 15 Z"/>',
        bun: '<path d="M21 22 L23 6 L35 15 Z"/><path d="M43 22 L41 6 L29 15 Z"/><circle cx="24" cy="4" r="2.6"/><circle cx="40" cy="4" r="2.6"/>',
      }[value];
    } else if (part === 'glasses') {
      inner = CAT_HEAD + (value === 'none' ? NONE : {
        round: '<circle cx="26" cy="28" r="4.5"/><circle cx="38" cy="28" r="4.5"/><path d="M30.5 28h3"/>',
        square: '<rect x="21" y="24" width="10" height="9" rx="2"/><rect x="33" y="24" width="10" height="9" rx="2"/><path d="M31 28.5h2"/>',
      }[value]);
    } else if (part === 'freckles') {
      inner = CAT_HEAD + (value === 'none' ? NONE : {
        freckles: '<circle cx="22" cy="33" r="1"/><circle cx="25" cy="36" r="1"/><circle cx="39" cy="36" r="1"/><circle cx="42" cy="33" r="1"/>',
        blush: '<circle cx="22" cy="33" r="2"/><circle cx="42" cy="33" r="2"/>',
      }[value]);
    } else if (part === 'earrings') {
      inner = CAT_HEAD + (value === 'none' ? NONE : {
        hoops: '<circle cx="19" cy="36" r="3"/><circle cx="45" cy="36" r="3"/>',
        studs: '<circle cx="19" cy="36" r="1.6"/><circle cx="45" cy="36" r="1.6"/>',
      }[value]);
    } else if (part === 'beard') {
      inner = CAT_HEAD + (value === 'none' ? NONE : {
        moustache: '<path d="M22 32 L10 29 M22 36 L10 37 M42 32 L54 29 M42 36 L54 37"/>',
        beard: '<path d="M22 32 L6 28 M22 36 L4 36 M22 40 L8 44 M42 32 L58 28 M42 36 L60 36 M42 40 L56 44"/>',
      }[value]);
    } else if (part === 'headwear') {
      inner = CAT_HEAD + (value === 'none' ? NONE : {
        beanie: '<path d="M18 26c1-8 27-8 28 0l-1 3c0 1-26 1-27 0z"/>',
        cap: '<path d="M18 26c1-8 27-8 28 0z"/><path d="M46 26c3 0 5-1 6-2"/>',
      }[value]);
    }
    return `<svg class="thumb-svg" viewBox="0 0 64 64" aria-hidden="true">${inner}</svg>`;
  }

  const builder = $('.builder');
  const tabs_box = $('[data-tabs]');
  const panels_box = $('[data-panels]');
  const caption = $('[data-caption]');
  const loading_el = $('.loading');
  const done_btn = $('[data-done]');
  const close_btn = $('[data-close]');

  let current_parts = { ...DEFAULT_PARTS };
  let active_tab = 'skin';
  let loading = false;
  let opened = false;

  function apply_parts(parts) {
    current_parts = { ...DEFAULT_PARTS, ...parts };
    Object.entries(current_parts).forEach(([k, v]) => { body.dataset[k] = v; });
  }

  function highlight() {
    tabs_box.querySelectorAll('.tab').forEach(t => {
      const sel = t.dataset.tab === active_tab;
      t.setAttribute('aria-selected', String(sel));
      t.tabIndex = sel ? 0 : -1;
      const panel = document.getElementById('panel-' + t.dataset.tab);
      if (panel) panel.hidden = !sel;
    });
    panels_box.querySelectorAll('.swatch, .thumb').forEach(el => {
      el.setAttribute('aria-pressed', String(current_parts[el.dataset.key] === el.dataset.value));
    });
  }

  function render_panels() {
    panels_box.textContent = '';
    TABS.forEach(tab => {
      const section = document.createElement('section');
      section.className = 'panel';
      section.id = 'panel-' + tab.id;
      section.setAttribute('role', 'tabpanel');
      section.setAttribute('aria-label', tab.label);
      section.hidden = true;
      tab.lists.forEach(list => {
        const h = document.createElement('h2');
        h.className = 'list-heading';
        h.textContent = list.heading;
        section.appendChild(h);
        const box = document.createElement('div');
        box.className = list.kind === 'swatches' ? 'swatches' : 'thumbs';
        box.setAttribute('role', 'group');
        box.setAttribute('aria-label', list.heading);
        list.options.forEach(opt => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = list.kind === 'swatches' ? 'swatch' : 'thumb';
          b.dataset.key = list.key;
          b.dataset.value = opt.value;
          b.setAttribute('aria-pressed', 'false');
          b.setAttribute('aria-label', opt.label);
          if (list.kind === 'swatches') {
            b.dataset.tone = opt.tone;
            const sq = document.createElement('span');
            sq.className = 'swatch-sq';
            b.appendChild(sq);
          } else {
            b.innerHTML = thumb_svg(list.key, opt.value);
          }
          box.appendChild(b);
        });
        section.appendChild(box);
      });
      panels_box.appendChild(section);
    });
  }

  function state_id() {
    const hash = location.hash.slice(1);
    return STATES[hash] ? hash : 'picker';
  }

  function sync() {
    const id = state_id();
    const is_save = id === 'save';
    builder.hidden = is_save || loading;
    loading_el.hidden = !loading;
    if (is_save) {
      if (!opened) apply_parts(CUMULATIVE.save);
      return;
    }
    if (loading) return;
    const st = STATES[id];
    active_tab = st.tab;
    apply_parts(CUMULATIVE[id]);
    caption.textContent = st.caption;
    highlight();
  }

  tabs_box.addEventListener('click', event => {
    const t = event.target.closest('.tab');
    if (t && !builder.hidden) { active_tab = t.dataset.tab; highlight(); }
  });

  tabs_box.addEventListener('keydown', event => {
    const t = event.target.closest('.tab');
    if (!t) return;
    const tabs = [...tabs_box.querySelectorAll('.tab')];
    const at = tabs.indexOf(t);
    const next = { ArrowRight: at + 1, ArrowLeft: at - 1, Home: 0, End: tabs.length - 1 }[event.key];
    if (next === undefined) return;
    event.preventDefault();
    const tab = tabs[(next + tabs.length) % tabs.length];
    active_tab = tab.dataset.tab;
    highlight();
    tab.focus();
  });

  panels_box.addEventListener('click', event => {
    const el = event.target.closest('.swatch, .thumb');
    if (el && !builder.hidden && el.dataset.value) {
      current_parts[el.dataset.key] = el.dataset.value;
      apply_parts(current_parts);
      highlight();
      const opt = (TABS.flatMap(t => t.lists).find(l => l.key === el.dataset.key) || {}).options || [];
      const chosen = opt.find(o => o.value === el.dataset.value);
      caption.textContent = chosen ? chosen.label : caption.textContent;
    }
  });

  done_btn.addEventListener('click', () => {
    if (loading || builder.hidden) return;
    loading = true;
    sync();
    const ms = matchMedia('(prefers-reduced-motion: reduce)').matches ? 120 : 10300;
    setTimeout(() => {
      loading = false;
      location.hash = 'save';
    }, ms);
  });

  close_btn.addEventListener('click', () => {
    if (window.sketchToast) window.sketchToast('Avatar builder closed (sample)', close_btn);
  });

  addEventListener('hashchange', sync);

  // Build the dynamic content, then re-run the kit so it can see any frames it owns.
  tabs_box.textContent = '';
  TABS.forEach(tab => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab';
    b.setAttribute('role', 'tab');
    b.dataset.tab = tab.id;
    b.setAttribute('aria-controls', 'panel-' + tab.id);
    b.setAttribute('aria-label', tab.label);
    b.innerHTML = `<svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[tab.id]}</svg>`;
    tabs_box.appendChild(b);
  });
  render_panels();
  $('[data-preview]').innerHTML = avatar_svg('Avatar preview');
  $('[data-profile-avatar]').innerHTML = avatar_svg('Saved avatar', 'profile-avatar');
  if (window.initSketch) window.initSketch();
  sync();
  opened = true;
})();
</script>
</body>
</html>
