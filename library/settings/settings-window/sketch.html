<!doctype html>
<!--
  Best for: a product with at most 4 groups of settings, where one person changes a setting and goes back to their work.
  For more than 4 groups, or for settings of a shared workspace, use settings/settings-modal.
  Row opens: no rows. The window holds settings, and it holds no records.
  Related: settings/settings-modal is the second pattern of the same part, for a product with more than 4 groups of settings.
  navigation/user-menu and navigation/foot-menu are the menus whose settings row opens this window.
  settings/notification-settings-by-event and settings/notification-settings-by-channel are the notification settings that the notifications tab holds.
  Limit: the window has at most 4 tabs, and General is the first tab. The head row has no overflow control.
  Transition values, from transitions.json. Each value is estimated: the capture is still pictures, and the sketch plays the values of the menu of navigation/user-menu.
  - general and account: the window goes from clear to solid, opacity 35 ms, ease-out, estimated.
    The window grows from 98% of its size to its full size, transform 160 ms, cubic-bezier(0, 0, 0.2, 1), estimated.
  - closed: the window goes to 98% of its size, transform 20 ms, linear, estimated.
    After a delay of 20 ms, the window goes from solid to clear, opacity 110 ms, cubic-bezier(0, 0, 0.2, 1), estimated.
  - A change of tab and signed-out: 0 ms, estimated.
  The window is in the middle of the screen from 600 px, and it fills the screen below 600 px.
  The notification settings and the signed-out page are parts of other patterns. This sketch draws each as a plain box with the name of its pattern.
  No value in this file is a design-system token.
-->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings window</title>
<link rel="stylesheet" href="../../../assets/sketch.css">
<style>
  /* The title is in the middle, and each tab is an icon above a word. The chosen tab has a box. */
  /* The title and the tabs keep their place. The panel below them takes the height that is left, and it scrolls when the screen is short. */
  [data-sketch] .settings_window { width: min(560px, calc(100vw - 32px)); min-height: min(460px, calc(100dvh - 32px)); max-height: calc(100dvh - 32px); grid-template: auto auto minmax(0, 1fr) / minmax(0, 1fr); }
  /* The panel cuts what hangs outside it. Its padding keeps the thick border and the focus ring of a card inside it. */
  [data-sketch] .settings_window > [role="tabpanel"] { margin: -8px; padding: 8px; overflow-y: auto; }
  [data-sketch] .settings_title { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; }
  [data-sketch] .settings_title > h2 { margin: 0; text-align: center; }
  /* The window has at most 4 tabs. So each tab is always in the row, and the row has no overflow control. */
  [data-sketch] .settings_toolbar { justify-content: center; padding-bottom: 12px; overflow: visible; border-bottom: 1px solid var(--sketch-ink); }
  [data-sketch] .settings_toolbar [role="tab"] { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 72px; padding: 6px 10px; font-size: 12px; border: var(--sketch-stroke) solid transparent; border-radius: var(--sketch-wobble); }
  [data-sketch] .settings_toolbar [role="tab"][aria-selected="true"] { border-color: var(--sketch-ink); background: var(--sketch-wash); }
  /* A settings row has its label at the left, with its end at one line, and its control at the right. */
  [data-sketch] .settings_form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 12px 16px; align-items: start; align-content: start; }
  [data-sketch] .settings_label { display: flex; align-items: center; justify-content: flex-end; min-height: 44px; }
  [data-sketch] .settings_theme { position: relative; display: grid; gap: 4px; align-content: start; padding: 12px; border: var(--sketch-stroke) solid var(--sketch-ink); border-radius: var(--sketch-wobble); cursor: pointer; }
  /* The input covers its card. So the focus scrolls the whole card and its focus ring into the panel. */
  [data-sketch] .settings_theme > input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; pointer-events: none; scroll-margin: 10px; }
  [data-sketch] .settings_theme:has(input:checked) { box-shadow: 0 0 0 3px var(--sketch-ink); }
  [data-sketch] .settings_theme:has(input:focus-visible) { outline: var(--sketch-stroke) solid var(--sketch-ink); outline-offset: 6px; }
  [data-sketch] .settings_fact { display: grid; min-width: 0; margin: 0; overflow-wrap: anywhere; }
  /* A part of a different pattern is a plain box with the name of that pattern. */
  [data-sketch] .settings_part { display: grid; place-items: center; min-height: 160px; margin: 0; padding: 16px; text-align: center; overflow-wrap: anywhere; border: var(--sketch-stroke) solid var(--sketch-ink); border-radius: var(--sketch-wobble); }
  /* The box of the signed-out page is the heading of that page. It keeps the look of a plain box. */
  [data-sketch] h1.settings_part { font: inherit; letter-spacing: normal; }
  [data-sketch] .settings_fill { display: grid; }
  @media (max-width: 599px) {
    /* On a phone, the settings window fills the screen, and the tabs share its width. */
    [data-sketch] .settings_window { width: 100%; max-width: none; height: 100dvh; max-height: none; padding: 16px; }
    [data-sketch] .settings_toolbar [role="tab"] { flex: 1 1 auto; min-width: 44px; padding: 6px 4px; }
    /* Each label is above its control. A field is close to its own label, and it is apart from the label of the next field. */
    [data-sketch] .settings_form { grid-template-columns: minmax(0, 1fr); gap: 4px 0; }
    [data-sketch] .settings_label { justify-content: flex-start; min-height: 0; }
    [data-sketch] .settings_form > .settings_label:not(:first-child) { padding-top: 8px; }
  }
  @media (min-width: 1000px) {
    /* The bar is the head of the side list, so the page takes the full height beside it. */
    /* The head keeps 4 px below its controls, so the side list does not cover the focus ring of a control. */
    [data-sketch] .settings_shell > .settings_head { grid-column: 1; grid-row: 1; padding: 16px 8px 4px; border-bottom: 0; border-right: var(--sketch-stroke) solid var(--sketch-ink); }
    [data-sketch] .settings_shell > .sketch-nav { grid-column: 1; grid-row: 2; padding-top: 8px; }
    [data-sketch] .settings_shell > .sketch-main { grid-column: 2; grid-row: 1 / 3; }
  }
  /* The page script writes the values of transitions.json into --settings-enter and --settings-leave. */
  @media (prefers-reduced-motion: no-preference) {
    [data-sketch] .settings_layer { transition: var(--settings-enter); }
    [data-sketch] .settings_layer:not([open]) { opacity: 0; transform: scale(0.98); transition: var(--settings-leave); }
    /* The window enters only from the closed state. A change between two tabs shows at once. */
    @starting-style { [data-from="closed"] [data-sketch] .settings_layer { opacity: 0; transform: scale(0.98); } }
  }
</style>
<body data-sketch>
<!-- The page script copies the template into each of the first 5 states. -->
<section class="sketch-shell settings_shell" data-state="closed"></section>
<section class="sketch-shell settings_shell" data-state="general"></section>
<section class="sketch-shell settings_shell" data-state="themes"></section>
<section class="sketch-shell settings_shell" data-state="notifications"></section>
<section class="sketch-shell settings_shell" data-state="account"></section>
<section data-state="signed-out">
  <main class="sketch-narrow">
    <h1 class="settings_part">Signed-out page. Pattern: navigation/user-menu</h1>
  </main>
</section>

<!-- 2 icon buttons at the head open the settings window, each on its own tab. The window has at most 4 tabs, and each tab is a state. -->
<template id="shell">
  <header class="sketch-bar settings_head" role="banner"><strong>[Product]</strong><span class="sketch-spacer"></span>
    <button type="button" class="sketch-icon-button" aria-label="Account" data-opens="account"><i data-icon="user"></i></button>
    <button type="button" class="sketch-icon-button" aria-label="Settings" data-opens="general"><i data-icon="sliders"></i></button>
  </header>
  <nav class="sketch-nav" aria-label="Main">
    <a href="#" aria-current="page"><i data-icon="home"></i>Home</a><a href="#"><i data-icon="comment"></i>Feed</a><a href="#"><i data-icon="box"></i>Catalog</a><a href="#"><i data-icon="user"></i>Members</a>
  </nav>
  <dialog class="sketch-dialog settings_window settings_layer" id="window___state__" aria-labelledby="window_title___state__">
    <div class="settings_title"><button type="button" class="sketch-icon-button" aria-label="Close" data-sketch-close><i data-icon="close"></i></button><h2 id="window_title___state__">Settings</h2></div>
    <div class="sketch-tabs settings_toolbar" aria-label="Settings">
      <button type="button" role="tab" aria-controls="general___state__" data-shows="general"><i data-icon="sliders"></i>General</button>
      <button type="button" role="tab" aria-controls="themes___state__" data-shows="themes"><i data-icon="eye"></i>Themes</button>
      <button type="button" role="tab" aria-controls="notifications___state__" data-shows="notifications"><i data-icon="bell"></i>Notifications</button>
      <button type="button" role="tab" aria-controls="account___state__" data-shows="account"><i data-icon="user"></i>Account</button>
    </div>
    <div class="settings_form" id="general___state__" role="tabpanel" aria-label="General">
      <label class="settings_label" for="language___state__">Language:</label>
      <select class="sketch-input" id="language___state__"><option>English</option><option>Deutsch</option><option>Español</option></select>
      <label class="settings_label" for="start___state__">Start page:</label>
      <select class="sketch-input" id="start___state__"><option>Home</option><option>Feed</option><option>Catalog</option><option>Members</option></select>
    </div>
    <div id="themes___state__" role="tabpanel" aria-label="Themes">
      <div class="sketch-grid" role="radiogroup" aria-label="Theme" style="--tablet:2;--wide:2;gap:16px">
        <label class="settings_theme"><input type="radio" name="theme___state__" data-theme-choice="Light"><b>Light</b><span>Dark text on a light page.</span></label>
        <label class="settings_theme"><input type="radio" name="theme___state__" data-theme-choice="Dark"><b>Dark</b><span>Light text on a dark page.</span></label>
        <label class="settings_theme"><input type="radio" name="theme___state__" data-theme-choice="High contrast"><b>High contrast</b><span>Strong text and strong lines.</span></label>
        <label class="settings_theme"><input type="radio" name="theme___state__" data-theme-choice="System"><b>System</b><span>The same as the device.</span></label>
      </div>
    </div>
    <div class="settings_fill" id="notifications___state__" role="tabpanel" aria-label="Notifications">
      <p class="settings_part">Notification settings. Pattern: settings/notification-settings-by-event or settings/notification-settings-by-channel</p>
    </div>
    <div class="sketch-stack" id="account___state__" role="tabpanel" aria-label="Account">
      <div class="sketch-row" style="flex-wrap:nowrap"><span class="sketch-avatar" aria-hidden="true">ML</span><p class="settings_fact"><b>Mara Lindqvist</b><span>mara@portal.example</span></p></div>
      <div class="sketch-row"><button type="button" class="sketch-button secondary" data-sketch-toast="Profile page (sample)">Profile</button><span class="sketch-spacer"></span><a class="sketch-button secondary" href="#signed-out">Sign out</a></div>
    </div>
  </dialog>
  <main class="sketch-main"><h1>Home</h1><div class="sketch-placeholder" style="min-height:240px">Portal page</div></main>
</template>

<script src="../../../assets/sketch.js"></script>
<script>
  // The values of transitions.json. The sketch plays each with the same duration, delay and easing.
  const transition_records = [
    { label: 'general', trigger: 'click the settings button', element: 'window', property: 'opacity', animation: null, duration: 35, delay: 0, easing: 'ease-out', measurement: 'estimated' },
    { label: 'general', trigger: 'click the settings button', element: 'window', property: 'transform', animation: null, duration: 160, delay: 0, easing: 'cubic-bezier(0, 0, 0.2, 1)', measurement: 'estimated' },
    { label: 'account', trigger: 'click the account button', element: 'window', property: 'opacity', animation: null, duration: 35, delay: 0, easing: 'ease-out', measurement: 'estimated' },
    { label: 'account', trigger: 'click the account button', element: 'window', property: 'transform', animation: null, duration: 160, delay: 0, easing: 'cubic-bezier(0, 0, 0.2, 1)', measurement: 'estimated' },
    { label: 'closed', trigger: 'press Escape, click the close button or press outside the window', element: 'window', property: 'transform', animation: null, duration: 20, delay: 0, easing: 'linear', measurement: 'estimated' },
    { label: 'closed', trigger: 'press Escape, click the close button or press outside the window', element: 'window', property: 'opacity', animation: null, duration: 110, delay: 20, easing: 'cubic-bezier(0, 0, 0.2, 1)', measurement: 'estimated' }
  ];
  window.__sketchTransitions = transition_records;

  const root = document.documentElement;
  const state_sections = [...document.querySelectorAll('[data-state]')];
  const open_states = ['general', 'themes', 'notifications', 'account'];
  const reduced_motion = matchMedia('(prefers-reduced-motion: reduce)');
  const shown_section = () => state_sections.find(section => !section.hidden);
  const transition_css = label => transition_records
    .filter(record => record.label === label)
    .map(record => `${record.property} ${record.duration}ms ${record.easing} ${record.delay}ms`).join(', ');
  // The window stays on the screen until the last step of the close ends.
  const leave_ms = Math.max(...transition_records.filter(record => record.label === 'closed').map(record => record.delay + record.duration));
  root.style.setProperty('--settings-leave', `${transition_css('closed')}, display ${leave_ms}ms allow-discrete, overlay ${leave_ms}ms allow-discrete`);

  // The theme choice is a sample. It moves the mark, and it does not change the theme of the sketch.
  let chosen_theme = 'System';
  function mark_theme() {
    document.querySelectorAll('[data-theme-choice]').forEach(choice => { choice.checked = choice.dataset.themeChoice === chosen_theme; });
  }

  // Show one tab of a section, with its panel.
  function choose_tab(section, chosen_tab) {
    section.querySelectorAll('[role="tab"]').forEach(tab => {
      const chosen = tab === chosen_tab;
      tab.setAttribute('aria-selected', String(chosen));
      tab.tabIndex = chosen ? 0 : -1;
      document.getElementById(tab.getAttribute('aria-controls')).hidden = !chosen;
    });
  }
  // A state that the person left goes back to its own tab. The closed state keeps the first tab.
  const reset_tabs = section => choose_tab(section, section.querySelector(`[role="tab"][data-shows="${section.dataset.state}"]`) || section.querySelector('[role="tab"]'));

  // Copy the template into one state. The window of an open state opens with the state.
  function render_state(section) {
    const state = section.dataset.state;
    if (!section.matches('.settings_shell')) return;
    section.innerHTML = document.getElementById('shell').innerHTML.replaceAll('__state__', state);
    const layer = section.querySelector('.settings_layer');
    if (open_states.includes(state)) {
      // The window enters with the values of its state. A tab with no values of its own enters as general does.
      layer.style.setProperty('--settings-enter', transition_css(state) || transition_css('general'));
      layer.setAttribute('data-open', '');
    }
    layer.addEventListener('close', sync_address);
    reset_tabs(section);
  }

  // Each state has its own copy of the screen. So a change of state puts the focus on the same control of the new copy.
  let focus_target = null;
  // 2 buttons open the window. The focus goes back to the button that opened it.
  let last_opener = 'general';
  const focus_trigger = section => section.querySelector(`[data-opens="${last_opener}"]`);
  const focus_tab = section => section.querySelector('[role="tab"][aria-selected="true"]');

  // The window plays its entry only when the state before was closed. The kit shows a state before this script names it.
  // So the entry starts while data-from still names the state before. Read the window first, then name the state.
  function name_state() {
    const section = shown_section();
    section.querySelector('.settings_layer')?.getBoundingClientRect();
    root.dataset.from = section.dataset.state;
  }

  function go(state, target) {
    focus_target = target || null;
    location.hash = state;
  }

  // The state that the window of a section shows. The kit closes the window and changes a tab in place.
  function wanted_state(section) {
    const layer = open_states.includes(section.dataset.state) && section.querySelector('.settings_layer');
    if (!layer) return section.dataset.state;
    return layer.open ? focus_tab(layer).dataset.shows : 'closed';
  }

  // Keep the address the same as the screen. A closed window plays its close before the state changes.
  let leave_timer = 0;
  function sync_address() {
    const section = shown_section();
    const state = wanted_state(section);
    if (state === section.dataset.state || leave_timer) return;
    if (state !== 'closed') { go(state, focus_tab); return; }
    leave_timer = setTimeout(() => {
      leave_timer = 0;
      if (shown_section() === section) go('closed', focus_trigger);
    }, reduced_motion.matches ? 0 : leave_ms);
  }

  // This listener runs before the listeners of the kit. Each button opens the state of its tab.
  document.addEventListener('click', event => {
    const opener = event.target.closest('[data-opens]');
    if (!opener) return;
    last_opener = opener.dataset.opens;
    go(last_opener);
    event.preventDefault();
    event.stopPropagation();
  }, true);

  // These listeners are on the document, so they run after the listeners of the kit on the body.
  document.addEventListener('click', event => {
    const choice = event.target.closest('[data-theme-choice]');
    if (choice) {
      chosen_theme = choice.dataset.themeChoice;
      mark_theme();
      sketchToast(`${chosen_theme} theme (sample)`);
    }
    sync_address();
  });
  document.addEventListener('keydown', sync_address);
  document.addEventListener('pointerdown', sync_address);
  addEventListener('hashchange', () => {
    clearTimeout(leave_timer);
    leave_timer = 0;
    const section = shown_section();
    state_sections.filter(other => other !== section).forEach(reset_tabs);
    focus_target?.(section)?.focus();
    focus_target = null;
    name_state();
  });

  state_sections.forEach(render_state);
  initSketch();
  mark_theme();
  name_state();
</script>
