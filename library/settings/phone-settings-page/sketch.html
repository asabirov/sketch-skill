<!doctype html>
<!-- Phone settings page.
     Best for: a phone app with about 15 settings, where a signed-in person opens Settings from the account button in the home bar and goes back with Back. Settings replaces the screen.
     Row opens: on the record's own page. A row with a chevron opens its section as the next page, with Back.
     Transitions (all estimated, from transitions.json): scrim-in 300ms and scrim-out 250ms, linear.
     push-enter, push-exit, back-enter and back-exit 350ms, cubic-bezier(0.32, 0.72, 0, 1).
     card-in 200ms, ease-out. card-out 150ms, ease-in. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone settings page sketch</title>
<link rel="stylesheet" href="../../../assets/sketch.css">
<style>
  /* A phone screen. The frame keeps the width of a phone in a wide window, so each part acts as it does on a phone. */
  html { height: 100%; }
  body[data-sketch] { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  [data-sketch] > [data-state] { flex: 1; min-height: 0; }
  [data-sketch] [data-screen] { height: 100%; }
  [data-sketch] .phone { position: relative; isolation: isolate; width: min(100%, 430px); height: 100%; margin: 0 auto; overflow: hidden; }
  [data-sketch] .phone_screen { position: absolute; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--sketch-page); }
  [data-sketch] .phone_bar { display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 6px 8px; }
  [data-sketch] .phone_bar :is(h1, h2) { flex: 1; min-width: 0; margin: 0 8px; font-size: 18px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  [data-sketch] .phone_bar .bar_end { width: 44px; }
  [data-sketch] .phone_body { min-height: 0; padding: 4px 16px 16px; overflow-y: auto; }
  @media (min-width: 600px) { [data-sketch] .phone { border-inline: var(--sketch-stroke) solid var(--sketch-muted); } }
  /* A plain box stands for a part that this pattern does not draw. */
  [data-sketch] .part_box { display: grid; place-content: center; justify-items: center; gap: 2px; min-height: 88px; padding: 12px; border: var(--sketch-stroke) solid var(--sketch-muted); border-radius: var(--sketch-wobble); text-align: center; }
  [data-sketch] .part_box.fill { height: 100%; box-sizing: border-box; }
  /* The dim layer under the card and the alert. A tap on it closes them. */
  [data-sketch] .scrim { position: absolute; inset: 0; display: block; background: color-mix(in srgb, var(--sketch-ink) 22%, transparent); }
  /* The account button at the right of the home bar opens Settings. */
  [data-sketch] .account_button { text-decoration: none; }
  /* Settings fills the screen. Its pages change inside it. */
  [data-sketch] .stack { position: absolute; inset: 0; overflow: hidden; background: var(--sketch-page); }
  [data-sketch] .stack_page { position: absolute; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--sketch-page); }
  [data-sketch] .who { display: flex; align-items: center; gap: 8px; min-height: 44px; margin: 4px 0 0; }
  [data-sketch] .who span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  [data-sketch] .pill { padding: 2px 10px; border: var(--sketch-stroke) solid var(--sketch-ink); border-radius: 999px; font-size: 13px; }
  /* A group of rows. Space separates two groups. Form settings-labelled adds a short label over each group. */
  [data-sketch] .group { position: relative; display: grid; margin-top: 28px; }
  [data-sketch] .group_label { margin: 28px 0 0; font-size: 13px; color: var(--sketch-muted); }
  [data-sketch] .group_label + .group { margin-top: 4px; }
  [data-sketch] .group > :is(a, button, label, div) { display: flex; align-items: center; gap: 14px; min-height: 48px; margin: 0 -8px; padding: 0 8px; border: 0; border-radius: var(--sketch-wobble); background: none; color: inherit; font: inherit; text-align: start; text-decoration: none; }
  [data-sketch] .group > :is(a, button):hover { background: var(--sketch-wash); }
  [data-sketch] .group .row_text { display: grid; }
  [data-sketch] .group .note { font-size: 13px; color: var(--sketch-muted); }
  [data-sketch] .group .value { display: inline-flex; align-items: center; gap: 2px; margin-left: auto; color: var(--sketch-muted); }
  [data-sketch] .group .sketch-switch { margin-left: auto; }
  [data-sketch] .danger { font-weight: 700; text-decoration: underline wavy; text-underline-offset: 4px; }
  [data-sketch] .choice[aria-checked="false"] .tick { visibility: hidden; }
  /* The card asks for the appearance in the center of the screen. A choice applies at once and closes the card. */
  [data-sketch] .card { position: absolute; z-index: 3; top: 50%; left: 50%; width: min(280px, 80%); margin: -100px 0 0 calc(min(280px, 80%) / -2); display: grid; padding: 14px 8px 8px; background: var(--sketch-page); border: var(--sketch-stroke) solid var(--sketch-ink); border-radius: var(--sketch-wobble); }
  [data-sketch] .card h2 { margin: 0 8px 6px; font-size: 16px; }
  [data-sketch] .card button { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 8px; border: 0; border-radius: var(--sketch-wobble); background: none; color: inherit; font: inherit; text-align: start; }
  [data-sketch] .card button:hover { background: var(--sketch-wash); }
  [data-sketch] .card .tick { margin-left: auto; }
  /* The alert asks once more in the center of the screen, with Cancel and Log out. Cancel or a tap on the dim layer keeps the person signed in. */
  [data-sketch] .alert { margin-top: -60px; padding: 18px 16px 10px; }
  [data-sketch] .alert h2 { margin: 0 0 14px; font-size: 18px; }
  [data-sketch] .alert_actions { display: flex; justify-content: flex-end; gap: 4px; }
  [data-sketch] .alert_actions a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: var(--sketch-wobble); color: inherit; text-decoration: none; }
  [data-sketch] .alert_actions a:hover { background: var(--sketch-wash); }
  [data-sketch] .signed_out { position: absolute; inset: 0; display: grid; padding: 24px 16px; background: var(--sketch-page); }
  /* From 700 px wide, the screens fill the window. The list of Settings keeps a width that reads well. The pictures show only phones,
     so this layout is the designer's choice. */
  @media (min-width: 700px) {
    [data-sketch] .phone { width: 100%; border-inline: 0 !important; }
    [data-sketch] .stack .phone_body { width: min(100%, 640px); margin: 0 auto; box-sizing: border-box; }
  }
  /* Each motion value below comes from transitions.json. */
  [data-sketch] { --ease_push: cubic-bezier(0.32, 0.72, 0, 1); }
  [data-sketch] .move_ghost { pointer-events: none; }
  @media (prefers-reduced-motion: no-preference) {
    [data-sketch] .scrim-in { animation: scrim-in 300ms linear; }
    [data-sketch] .scrim-out { animation: scrim-out 250ms linear forwards; }
    [data-sketch] .push-enter { animation: push-enter 350ms var(--ease_push); }
    [data-sketch] .push-exit { animation: push-exit 350ms var(--ease_push) forwards; }
    [data-sketch] .back-enter { animation: back-enter 350ms var(--ease_push); }
    [data-sketch] .back-exit { animation: back-exit 350ms var(--ease_push) forwards; }
    [data-sketch] .card-in { animation: card-in 200ms ease-out; }
    [data-sketch] .card-out { animation: card-out 150ms ease-in forwards; }
  }
  @keyframes scrim-in { from { opacity: 0; } }
  @keyframes scrim-out { to { opacity: 0; } }
  @keyframes push-enter { from { transform: translateX(100%); } }
  @keyframes push-exit { to { transform: translateX(-30%); } }
  @keyframes back-enter { from { transform: translateX(-30%); } }
  @keyframes back-exit { to { transform: translateX(100%); } }
  @keyframes card-in { from { opacity: 0; transform: scale(.9); } }
  @keyframes card-out { to { opacity: 0; } }
</style>
<body data-sketch>

<section data-state="home">
  <div data-screen="settings_stack"></div>
</section>
<section data-state="settings">
  <div data-screen="settings_stack" data-show="page"></div>
</section>
<section data-state="settings-labelled">
  <div data-screen="settings_stack" data-show="page labelled"></div>
</section>
<section data-state="section">
  <div data-screen="settings_stack" data-show="page section"></div>
</section>
<section data-state="appearance-card">
  <div data-screen="settings_stack" data-show="page card"></div>
</section>
<section data-state="sign-out-confirm">
  <div data-screen="settings_stack" data-show="page alert"></div>
</section>
<section data-state="signed-out">
  <div data-screen="settings_stack" data-show="out"></div>
</section>

<template id="settings_stack">
<div class="phone">
  <main class="phone_screen">
    <header class="phone_bar">
      <span class="bar_end"></span>
      <h1>Home</h1>
      <a class="sketch-icon-button account_button" href="#settings" data-move="open-settings" aria-label="Account and settings" data-focus="!page !out"><span class="sketch-avatar">ML</span></a>
    </header>
    <div class="phone_body"><div class="part_box fill"><strong>Home screen</strong><span class="sketch-muted">The app's own content</span></div></div>
  </main>

  <div class="stack" data-part="page">
    <div class="stack_page" data-part="!section">
      <header class="phone_bar">
        <a class="sketch-icon-button" href="#home" data-move="close-settings" aria-label="Back" data-focus="page !section !card !alert"><i data-icon="chevron-left"></i></a>
        <h2>Settings</h2>
        <span class="bar_end"></span>
      </header>
      <div class="phone_body" data-keep-scroll>
        <p class="who"><span>mara@example.com</span><span class="pill">Free</span></p>

        <p class="group_label" data-part="labelled">Account</p>
        <div class="group">
          <a href="#section" data-move="push" data-section="Profile"><i data-icon="user"></i>Profile<span class="value"><i data-icon="chevron-right"></i></span></a>
          <a href="#section" data-move="push" data-section="Billing"><i data-icon="copy"></i>Billing<span class="value"><i data-icon="chevron-right"></i></span></a>
        </div>

        <p class="group_label" data-part="labelled">Access</p>
        <div class="group">
          <a href="#section" data-move="push" data-section="Security"><i data-icon="sliders"></i><span class="row_text">Security<span class="note">Password and sign-in</span></span><span class="value"><i data-icon="chevron-right"></i></span></a>
          <a href="#section" data-move="push" data-section="Connected apps"><i data-icon="link"></i><span class="row_text">Connected apps<span class="note">2 connected</span></span><span class="value"><i data-icon="chevron-right"></i></span></a>
          <a href="#section" data-move="push" data-section="Permissions"><i data-icon="eye"></i>Permissions<span class="value"><i data-icon="chevron-right"></i></span></a>
        </div>

        <p class="group_label" data-part="labelled">Preferences</p>
        <div class="group">
          <button type="button" data-go="appearance-card" data-move="open-card" aria-haspopup="dialog" data-focus="page !section !card !alert"><i data-icon="smile"></i>Appearance<span class="value"><span data-appearance></span><i data-icon="chevron-down"></i></span></button>
          <button type="button"><i data-icon="comment"></i>Language<span class="value">English<i data-icon="chevron-down"></i></span></button>
          <a href="#section" data-move="push" data-section="Notifications"><i data-icon="bell"></i>Notifications<span class="value"><i data-icon="chevron-right"></i></span></a>
        </div>

        <p class="group_label" data-part="labelled">More</p>
        <div class="group">
          <label><i data-icon="filter"></i>Vibration<span class="sketch-switch"><input type="checkbox" checked aria-label="Vibration"></span></label>
          <a href="#section" data-move="push" data-section="Privacy"><i data-icon="info"></i>Privacy<span class="value"><i data-icon="chevron-right"></i></span></a>
          <a href="#section" data-move="push" data-section="Help"><i data-icon="external"></i>Help<span class="value"><i data-icon="chevron-right"></i></span></a>
        </div>

        <div class="group">
          <button type="button" data-go="sign-out-confirm" data-move="open-alert" aria-haspopup="dialog" data-focus="page !section !card !alert"><i data-icon="arrow-right"></i><span class="danger">Log out</span></button>
        </div>
      </div>
    </div>

    <div class="stack_page" data-part="section">
      <header class="phone_bar">
        <a class="sketch-icon-button" href="#settings" data-move="back" aria-label="Back" data-focus="section"><i data-icon="chevron-left"></i></a>
        <h2 data-section-title>Privacy</h2>
        <span class="bar_end"></span>
      </header>
      <div class="phone_body">
        <div class="part_box fill" data-section-body="other"><strong data-section-title>Privacy</strong><span>This sketch draws only the Privacy page.</span></div>
        <div data-section-body="Privacy">
        <div class="group">
          <label><span class="row_text">Share usage data<span class="note">Helps to make the app better.</span></span><span class="sketch-switch"><input type="checkbox" aria-label="Share usage data"></span></label>
        </div>
        <div class="group" role="radiogroup" aria-label="Location">
          <div class="note">Location</div>
          <button type="button" class="choice" role="radio" aria-checked="true">Ask each time<span class="value tick">✓</span></button>
          <button type="button" class="choice" role="radio" aria-checked="false">Always allow<span class="value tick">✓</span></button>
        </div>
        <div class="group">
          <button type="button"><span class="danger">Delete my data</span></button>
        </div>
        </div>
      </div>
    </div>
  </div>

  <a class="scrim" href="#settings" data-part="card" data-move="close-card" aria-label="Close"></a>
  <div class="card" data-part="card" role="dialog" aria-modal="true" aria-labelledby="card_title">
    <h2 id="card_title">Appearance</h2>
    <button type="button" data-pick="System" data-go="settings" data-move="close-card" data-focus="card"><i data-icon="settings"></i>System<span class="tick">✓</span></button>
    <button type="button" data-pick="Light" data-go="settings" data-move="close-card"><i data-icon="smile"></i>Light<span class="tick">✓</span></button>
    <button type="button" data-pick="Dark" data-go="settings" data-move="close-card"><i data-icon="eye"></i>Dark<span class="tick">✓</span></button>
  </div>

  <a class="scrim" href="#settings" data-part="alert" data-move="close-alert" aria-label="Keep me signed in"></a>
  <div class="card alert" data-part="alert" role="alertdialog" aria-modal="true" aria-labelledby="alert_title">
    <h2 id="alert_title">Log out?</h2>
    <div class="alert_actions">
      <a href="#settings" data-move="close-alert" data-focus="alert">Cancel</a>
      <a href="#signed-out" data-move="close-alert"><span class="danger">Log out</span></a>
    </div>
  </div>

  <div class="signed_out" data-part="out"><a class="part_box fill" href="#home"><strong>Sign-in page</strong><span class="sketch-muted">account/email-code-signup</span></a></div>
</div>
</template>

<script>
/* The screens of a pattern sketch. This script runs before the kit script.
   A block with data-screen takes a copy of the <template> with that id. Its data-show names the parts that the state shows.
   In a template, data-part="name" shows an element only with that part, and "!name" only without it.
   A link to "#state" and a button with data-go change the state. data-move names the transition that the change plays.
   After the change, the element whose data-focus names a shown part takes the focus. */
(() => {
  const has_part = (shown, names) => {
    const list = names.split(' ').filter(Boolean), wanted = list.filter(name => name[0] !== '!');
    return list.every(name => name[0] !== '!' || !shown.includes(name.slice(1))) && (!wanted.length || wanted.some(name => shown.includes(name)));
  };
  const parts_of = block => (block.dataset.show || '').split(' ');
  document.querySelectorAll('[data-screen]').forEach((block, index) => {
    const copy = document.getElementById(block.dataset.screen).content.cloneNode(true);
    const shown = parts_of(block);
    ['id', 'for', 'name', 'aria-controls', 'aria-labelledby', 'aria-describedby'].forEach(name =>
      copy.querySelectorAll(`[${name}]`).forEach(node => node.setAttribute(name, `s${index}_${node.getAttribute(name)}`)));
    copy.querySelectorAll('[data-part]').forEach(part => { part.hidden = !has_part(shown, part.dataset.part); });
    /* While the card or the alert is open, the screens under it take no focus and no tap. */
    if (shown.includes('card') || shown.includes('alert')) copy.querySelectorAll('.phone_screen, .stack').forEach(node => { node.inert = true; });
    block.append(copy);
  });
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const shown_block = () => document.querySelector('[data-state]:not([hidden]) [data-screen]');
  /* The appearance that the reader chose shows on the row and as the tick in the card. */
  let appearance = 'System';
  const show_appearance = () => {
    document.querySelectorAll('[data-appearance]').forEach(node => { node.textContent = appearance; });
    document.querySelectorAll('[data-pick] .tick').forEach(node => { node.style.visibility = node.parentElement.dataset.pick === appearance ? '' : 'hidden'; });
  };
  show_appearance();
  /* A row with a chevron opens its own section. The sketch draws only Privacy, and a plain box with the name for each other section. */
  let section = 'Privacy';
  const show_section = () => {
    document.querySelectorAll('[data-section-title]').forEach(node => { node.textContent = section; });
    document.querySelectorAll('[data-section-body]').forEach(node => { node.hidden = (node.dataset.sectionBody === 'Privacy') !== (section === 'Privacy'); });
  };
  show_section();
  /* Light and Dark change the look of the whole sketch at once. System gives back the look of the page that shows the sketch. */
  const root = document.documentElement;
  let host_theme = root.getAttribute('data-theme'), own_change = false;
  new MutationObserver(() => { if (!own_change) host_theme = root.getAttribute('data-theme'); }).observe(root, {attributeFilter: ['data-theme']});
  const apply_look = () => {
    own_change = true;
    const theme = appearance === 'System' ? host_theme : appearance.toLowerCase();
    if (theme) root.setAttribute('data-theme', theme); else root.removeAttribute('data-theme');
    queueMicrotask(() => { own_change = false; });
  };
  /* A tap on a choice of a group moves the tick to it. */
  document.addEventListener('click', event => {
    const choice = event.target.closest('.choice[role="radio"]');
    if (!choice) return;
    choice.closest('[role="radiogroup"]').querySelectorAll('[role="radio"]').forEach(node => node.setAttribute('aria-checked', String(node === choice)));
  });
  /* play adds the class that holds one animation of transitions.json, and takes it away at the end. */
  const play = (node, name, after) => {
    if (reduced.matches) { if (after) after(); return; }
    const done = event => {
      if (event.target !== node) return;
      node.removeEventListener('animationend', done);
      node.classList.remove(name);
      if (after) after();
    };
    node.addEventListener('animationend', done);
    node.classList.add(name);
  };
  /* Each move lists the parts that come in, and the parts that leave. A part that leaves is a copy of the part of the state
     before, put into the same place of the new state. */
  const moves = {
    'open-settings': {enter: [['.stack', 'push-enter']]},
    'close-settings': {exit: [['.stack', 'back-exit', '.phone']]},
    'push': {enter: [['.stack_page', 'push-enter']], exit: [['.stack_page', 'push-exit', '.stack']]},
    'back': {enter: [['.stack_page', 'back-enter']], exit: [['.stack_page', 'back-exit', '.stack']]},
    'open-card': {enter: [['.card', 'card-in'], ['a.scrim[data-part="card"]', 'scrim-in']]},
    'close-card': {exit: [['.card', 'card-out', '.phone'], ['a.scrim[data-part="card"]', 'scrim-out', '.phone']]},
    'open-alert': {enter: [['.alert', 'card-in'], ['a.scrim[data-part="alert"]', 'scrim-in']]},
    'close-alert': {exit: [['.alert', 'card-out', '.phone'], ['a.scrim[data-part="alert"]', 'scrim-out', '.phone']]}
  };
  const visible = (block, selector) => [...block.querySelectorAll(selector)].find(node => !node.closest('[hidden]'));
  const run_move = (name, from, to) => {
    const move = moves[name];
    (move.exit || []).forEach(([selector, animation, parent]) => {
      const part = visible(from, selector), place = visible(to, parent);
      if (!part || !place) return;
      const ghost = part.cloneNode(true);
      ghost.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
      ghost.classList.add('move_ghost');
      ghost.inert = true;
      ghost.setAttribute('aria-hidden', 'true');
      place.append(ghost);
      const body = part.querySelector('[data-keep-scroll]');
      if (body) ghost.querySelector('[data-keep-scroll]').scrollTop = body.scrollTop;
      play(ghost, animation, () => ghost.remove());
    });
    (move.enter || []).forEach(([selector, animation]) => {
      const part = visible(to, selector);
      if (part) play(part, animation);
    });
  };
  let focus_next = false, focus_back = null;
  /* After the card or the alert closes, the row that opened it takes the focus again. */
  const openers = {'close-card': '[data-go="appearance-card"]', 'close-alert': '[data-go="sign-out-confirm"]'};
  const go = (state, move, from) => {
    const to = document.querySelector(`[data-state="${state}"] [data-screen]`);
    if (!to || to === from) return;
    /* The list keeps its scroll from one state to the next, so the card or the alert opens over the same rows. */
    const kept = visible(from, '[data-keep-scroll]'), keep = visible(to, '[data-keep-scroll]');
    if (kept && keep) keep.scrollTop = kept.scrollTop;
    if (move && !reduced.matches) run_move(move, from, to);
    focus_next = true;
    focus_back = openers[move] || null;
    location.hash = state;
  };
  /* The capture phase keeps the kit from pressing a chip in the state that the reader leaves. */
  document.addEventListener('click', event => {
    const control = event.target.closest('[data-go], a[href^="#"]');
    const block = control && control.closest('[data-screen]');
    if (!block || control.matches(':disabled')) return;
    event.preventDefault();
    event.stopPropagation();
    if (control.dataset.pick) { appearance = control.dataset.pick; show_appearance(); apply_look(); }
    if (control.dataset.section) { section = control.dataset.section; show_section(); }
    go(control.dataset.go || control.getAttribute('href').slice(1), control.dataset.move, block);
  }, true);
  /* Escape closes the card, the alert, the section or Settings, in this order. */
  const escapes = {'appearance-card': ['settings', 'close-card'], 'sign-out-confirm': ['settings', 'close-alert'], 'section': ['settings', 'back'], 'settings': ['home', 'close-settings']};
  document.addEventListener('keydown', event => {
    const block = shown_block(), state = block && block.parentElement.dataset.state;
    if (event.key === 'Escape' && escapes[state]) go(...escapes[state], block);
  });
  const after_change = () => requestAnimationFrame(() => {
    const block = shown_block();
    if (!block) return;
    const target = focus_next && ((focus_back && visible(block, focus_back)) ||
      [...block.querySelectorAll('[data-focus]')].find(node => !node.closest('[hidden]') && has_part(parts_of(block), node.dataset.focus)));
    focus_next = false;
    focus_back = null;
    if (target) target.focus({preventScroll: true});
  });
  addEventListener('hashchange', after_change);
  after_change();
})();
</script>
<script src="../../../assets/sketch.js"></script>
