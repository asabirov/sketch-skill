<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notification settings by event sketch</title>
<link rel="stylesheet" href="../../../assets/sketch.css">
<style>
  /* A box with the class pattern_part stands for a part that another pattern draws. It names the part and that pattern. */
  [data-sketch] .pattern_part { display: grid; gap: 2px; place-content: center; justify-items: center; min-width: 200px; padding: 16px; text-align: center; }
  [data-sketch] .pattern_part > * { padding: 0 8px; background: var(--sketch-page); }
  [data-sketch] .pattern_part b { color: var(--sketch-ink); }
/* A title with the class pattern_plain_title is the main heading of the page for a screen reader. It looks like the text around it. */
[data-sketch] .pattern_plain_title { margin: 0; font: inherit; letter-spacing: inherit; }
/* A title with the class pattern_hidden_title names a page whose drawn title is out of view. Only a screen reader reads it. */
[data-sketch] .pattern_hidden_title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* The record lists no motion, so a switch changes at once. */
  [data-sketch] .sketch-switch input[type="checkbox"]::before { transition: none; }
  [data-sketch] .sketch-list > .settings_row { flex-wrap: nowrap; gap: 16px; padding: 12px 8px; }
  [data-sketch] .settings_row > div { flex: 1; min-width: 0; }
  [data-sketch] .settings_row p { margin: 0; }
  [data-sketch] .sketch-main :is(a, button).settings_channel { display: flex; flex: 1; align-items: center; gap: 16px; min-height: 44px; padding: 0; background: none; border: 0; text-align: left; text-decoration: none; cursor: pointer; }
  [data-sketch] .settings_channel > span { display: grid; flex: 1; min-width: 0; }
  [data-sketch] .sketch-main a.settings_back { justify-self: start; margin-left: 4px; }
  /* One column with no app shell. */
  [data-sketch] .sketch-main.settings_column { max-width: 640px; padding-block: 24px 64px; }
  [data-sketch] .settings_groups { display: grid; gap: 12px; }
  [data-sketch] .settings_groups h1 { margin: 0 16px 4px; font-size: 26px; }
  [data-sketch] .settings_lead { margin: 0 16px 8px; }
  [data-sketch] .settings_group_head { display: grid; gap: 4px; padding: 20px 16px 0; }
  [data-sketch] .settings_group_head :is(h2, p) { margin: 0; }
  [data-sketch] .settings_group_head h2 { font-size: 17px; }
  [data-sketch] .settings_card .settings_row p, [data-sketch] .settings_about { font-size: 14px; color: var(--sketch-muted); }
  [data-sketch] .settings_status, [data-sketch] .settings_saved { font-size: 14px; }
  [data-sketch] .settings_saved { flex: none; }
  [data-sketch] .settings_card { padding: 4px 16px; }
  [data-sketch] .settings_card .sketch-list > .settings_row { margin: 0; padding: 8px 0; border-radius: 0; }
  [data-sketch] .settings_card .sketch-list > .settings_row:not([hidden]) ~ .settings_row { border-top: var(--sketch-stroke) solid var(--sketch-wash); }
  [data-sketch] .settings_head { display: grid; gap: 4px; }
  @media (max-width: 599px) {
    [data-sketch] .sketch-list > .settings_row:has(> .sketch-button) { flex-wrap: wrap; gap: 8px; }
    [data-sketch] .settings_row:has(> .sketch-button) > div { flex-basis: 100%; }
    [data-sketch] .settings_row > .sketch-button { flex: 1; justify-content: space-between; }
  }
  /* The overview has one row for each kind of event, in groups. The page of an event has a card for its channels and a card for the choice of senders. */
  [data-sketch] .settings_from legend { padding: 20px 16px 12px; }
  [data-sketch] .settings_from h2 { margin: 0; font-size: 17px; }
  [data-sketch] .settings_from .sketch-choice { margin: 0 -12px; }
  [data-sketch] .settings_from .settings_saved { margin-left: auto; }
</style>
<body data-sketch>

<section data-state="overview">
  <div data-screen="by_event_settings"></div>
</section>
<section data-state="event">
  <div data-screen="by_event_settings" data-show="page"></div>
</section>
<section data-state="channel-off">
  <div data-screen="by_event_settings" data-show="page eventoff"></div>
</section>
<section data-state="all-off">
  <div data-screen="by_event_settings" data-show="page eventoff off"></div>
</section>
<section data-state="from-choice">
  <div data-screen="by_event_settings" data-show="page follows"></div>
</section>
<section data-state="channel-unavailable">
  <div data-screen="by_event_settings" data-show="page blocked"></div>
</section>
<section data-state="save-error">
  <div data-screen="by_event_settings" data-show="page error"></div>
</section>

<!-- One row for each kind of event, in groups. Each row says what the event is and where it notifies, and opens the page
     of that event. The page has one switch for each channel and the choice of senders. -->
<template id="by_event_settings">
<main class="sketch-main settings_column">
  <div class="settings_groups" data-part="!page">
    <h1>Notifications</h1>
    <div class="settings_group_head"><h2>Conversations</h2></div>
    <div class="sketch-frame settings_card"><ul class="sketch-list">
      <li class="settings_row"><a class="settings_channel" href="#event" data-summary-row><span><b>Mentions</b><span class="settings_about">A member names you in a post or a comment.</span><span class="settings_status" data-summary>Push, in the app, email, from everyone</span></span><i data-icon="chevron-right"></i></a></li>
      <li class="settings_row"><button class="settings_channel" type="button" data-sketch-toast="This sample opens the page of Mentions only"><span><b>Replies</b><span class="settings_about">A member answers your post or your comment.</span><span class="settings_status">Push, in the app, email, from everyone</span></span><i data-icon="chevron-right"></i></button></li>
      <li class="settings_row"><button class="settings_channel" type="button" data-sketch-toast="This sample opens the page of Mentions only"><span><b>Direct messages</b><span class="settings_about">A member writes to you.</span><span class="settings_status">Push, in the app, from members that you follow</span></span><i data-icon="chevron-right"></i></button></li>
      <li class="settings_row"><button class="settings_channel" type="button" data-sketch-toast="This sample opens the page of Mentions only"><span><b>Reactions</b><span class="settings_about">A member reacts to your post or your comment.</span><span class="settings_status">In the app, from everyone</span></span><i data-icon="chevron-right"></i></button></li>
    </ul></div>
    <div class="settings_group_head"><h2>Groups and events</h2></div>
    <div class="sketch-frame settings_card"><ul class="sketch-list">
      <li class="settings_row"><button class="settings_channel" type="button" data-sketch-toast="This sample opens the page of Mentions only"><span><b>New posts in your groups</b><span class="settings_about">A group that you joined gets a post.</span><span class="settings_status">Off</span></span><i data-icon="chevron-right"></i></button></li>
      <li class="settings_row"><button class="settings_channel" type="button" data-sketch-toast="This sample opens the page of Mentions only"><span><b>Invitations</b><span class="settings_about">A member invites you to a group or an event.</span><span class="settings_status">Push, in the app, email</span></span><i data-icon="chevron-right"></i></button></li>
      <li class="settings_row"><button class="settings_channel" type="button" data-sketch-toast="This sample opens the page of Mentions only"><span><b>Event reminders</b><span class="settings_about">An event that you joined starts soon.</span><span class="settings_status">Push, in the app</span></span><i data-icon="chevron-right"></i></button></li>
      <li class="settings_row"><button class="settings_channel" type="button" data-sketch-toast="This sample opens the page of Mentions only"><span><b>New followers</b><span class="settings_about">A member starts to follow you.</span><span class="settings_status">In the app</span></span><i data-icon="chevron-right"></i></button></li>
    </ul></div>
    <div class="settings_group_head"><h2>Account</h2></div>
    <div class="sketch-frame settings_card"><ul class="sketch-list">
      <li class="settings_row"><button class="settings_channel" type="button" data-sketch-toast="This sample opens the page of Mentions only"><span><b>Sign-in alerts</b><span class="settings_about">A new device signs in to your account.</span><span class="settings_status">Push, in the app, email</span></span><i data-icon="chevron-right"></i></button></li>
      <li class="settings_row"><button class="settings_channel" type="button" data-sketch-toast="This sample opens the page of Mentions only"><span><b>Billing</b><span class="settings_about">A payment succeeds or fails.</span><span class="settings_status">In the app, email</span></span><i data-icon="chevron-right"></i></button></li>
    </ul></div>
  </div>
  <div class="settings_groups" data-part="page" data-channel>
    <div class="settings_head">
      <a class="settings_back" href="#overview"><i data-icon="chevron-left"></i>Notifications</a>
      <h1>Mentions</h1>
      <p class="settings_lead">A member names you in a post or a comment.</p>
    </div>
    <p class="sketch-error" role="alert" data-part="error" style="margin:0 16px">The change to "Push" was not saved. The switch shows the saved value. <button class="sketch-button secondary" type="button" data-go="event">Try again</button></p>
    <div class="settings_group_head"><h2>Channels</h2></div>
    <div class="sketch-frame settings_card"><ul class="sketch-list">
      <li class="settings_row" data-part="!blocked"><div><b>Push</b><p>On your phone and your desktop.</p></div><span class="settings_saved" role="status" data-part="eventoff !off">Saved</span><label class="sketch-switch"><input type="checkbox" role="switch" aria-label="Push" checked data-locks data-off-in="eventoff"></label></li>
      <li class="settings_row" data-part="blocked"><div><b>Push</b><p>Push needs the phone app. <a href="#">Get the app</a></p></div><label class="sketch-switch"><input type="checkbox" role="switch" aria-label="Push" disabled></label></li>
      <li class="settings_row"><div><b>In the app</b><p>In the notification list of the app.</p></div><label class="sketch-switch"><input type="checkbox" role="switch" aria-label="In the app" checked data-locks data-off-in="off"></label></li>
      <li class="settings_row"><div><b>Email</b><p>To [your address]</p></div><span class="settings_saved" role="status" data-part="off">Saved</span><label class="sketch-switch"><input type="checkbox" role="switch" aria-label="Email" checked data-locks data-off-in="off"></label></li>
    </ul></div>
    <fieldset class="settings_from" data-locked-in="">
      <legend><h2>From</h2></legend>
      <div class="sketch-frame settings_card">
        <label class="sketch-choice"><input type="radio" name="from" checked>Everyone</label>
        <label class="sketch-choice"><input type="radio" name="from" data-on-in="follows">Members that you follow<span class="settings_saved" role="status" data-part="follows">Saved</span></label>
      </div>
    </fieldset>
  </div>
</main>
</template>

<script>
/* Screens of a pattern sketch. This script runs before the kit script.
   A block with data-screen takes a copy of the <template> with that id. Its data-show names the parts that the state shows.
   In a template, data-part="name" shows an element only with that part, and "!name" only without it. On a menu, a popover or a
   dialog, the part opens it. data-select-in="name" selects a tab or an option, data-current-in="name" marks the open row, and
   data-off-in="name" clears a checkbox. A tab that is a link, and a button or an option with data-go, change the state.
   A block with data-toast shows that toast when its state opens. */
(() => {
  const has_part = (shown, names) => {
    const list = names.split(' '), wanted = list.filter(name => name[0] !== '!');
    return list.every(name => name[0] !== '!' || !shown.includes(name.slice(1))) && (!wanted.length || wanted.some(name => shown.includes(name)));
  };
  document.querySelectorAll('[data-screen]').forEach((block, index) => {
    const copy = document.getElementById(block.dataset.screen).content.cloneNode(true);
    const shown = (block.dataset.show || '').split(' ');
    ['id', 'name', 'aria-controls', 'aria-labelledby', 'data-sketch-popover', 'data-sketch-open'].forEach(name =>
      copy.querySelectorAll(`[${name}]`).forEach(node => node.setAttribute(name, `s${index}_${node.getAttribute(name)}`)));
    copy.querySelectorAll('[data-part]').forEach(part => {
      const on = has_part(shown, part.dataset.part);
      if (part.matches('.sketch-menu, .sketch-popover, dialog')) part.toggleAttribute('data-open', on);
      else part.hidden = !on;
    });
    copy.querySelectorAll('[data-select-in]').forEach(node => {
      if (!has_part(shown, node.dataset.selectIn)) return;
      if (node.matches('option')) { node.setAttribute('selected', ''); return; }
      node.parentElement.querySelectorAll('[aria-selected]').forEach(other => other.setAttribute('aria-selected', 'false'));
      node.setAttribute('aria-selected', 'true');
    });
    copy.querySelectorAll('[data-current-in]').forEach(node => { if (has_part(shown, node.dataset.currentIn)) node.setAttribute('aria-current', 'true'); });
    copy.querySelectorAll('[data-off-in]').forEach(box => { if (has_part(shown, box.dataset.offIn)) box.checked = false; });
    block.append(copy);
  });
  /* The kit selects a clicked tab in the state that the reader leaves. Each state gets its own tab and option back. */
  const link_tabs = [...document.querySelectorAll('a[role="tab"]')].map(tab => [tab, tab.getAttribute('aria-selected') === 'true']);
  addEventListener('hashchange', () => {
    link_tabs.forEach(([tab, chosen]) => tab.setAttribute('aria-selected', String(chosen)));
    const block = document.querySelector(`[data-state="${location.hash.slice(1)}"] [data-screen][data-toast]`);
    const toast = document.querySelector('.sketch-toast');
    if (block) sketchToast(block.dataset.toast); else if (toast) toast.hidden = true;
  });
  /* The capture phase keeps the kit from pressing a chip in the state that the reader leaves.
     A sample link with the address "#" leads nowhere, so it keeps the state. Without this, it opens the first state. */
  document.addEventListener('click', event => {
    if (event.target.closest('a[href="#"]')) event.preventDefault();
    const button = event.target.closest('button[data-go]');
    if (!button) return;
    event.stopPropagation();
    location.hash = button.dataset.go;
  }, true);
  document.addEventListener('change', event => {
    const to = event.target.selectedOptions?.[0].dataset.go;
    if (!to) return;
    event.target.selectedIndex = Math.max(0, [...event.target.options].findIndex(option => option.defaultSelected));
    location.hash = to;
  });
})();
/* A channel that is off locks its controls, and each control keeps its value. The switches with data-locks lock the group with
   data-locked-in when each of them is off, and one that is on frees it. The parts that data-locked-in names lock the group too.
   data-on-in names the parts that
   set a choice. */
(() => {
  const shown_locks = page => [...page.querySelectorAll('[data-locks]')].filter(box => !box.closest('[data-part][hidden]'));
  const parts = block => (block.dataset.show || '').split(' ').filter(Boolean);
  const refresh = page => {
    const group = page.querySelector('[data-locked-in]'), locks = shown_locks(page);
    const off = group.dataset.lockedIn.split(' ').some(name => parts(page.closest('[data-screen]')).includes(name)) || (locks.length > 0 && !locks.some(box => box.checked));
    group.classList.toggle('settings_locked', off);
    group.querySelectorAll('input').forEach(control => { control.disabled = off; });
  };
  document.querySelectorAll('[data-screen]').forEach(block => {
    block.querySelectorAll('[data-on-in]').forEach(box => { if (parts(block).includes(box.dataset.onIn)) box.checked = true; });
    block.querySelectorAll('[data-channel]').forEach(refresh);
  });
  /* Each change saves at once. The word "Saved" shows on the row of the last change of a page. */
  document.addEventListener('change', event => {
    const page = event.target.closest('[data-channel]'), row = event.target.closest('.settings_row, .sketch-choice');
    if (!page || !row) return;
    refresh(page);
    page.querySelectorAll('.settings_saved').forEach(mark => { mark.hidden = true; });
    let mark = row.querySelector('.settings_saved');
    if (!mark) {
      mark = Object.assign(document.createElement('span'), { className: 'settings_saved', textContent: 'Saved' });
      mark.setAttribute('role', 'status');
      if (row.matches('.sketch-choice')) row.append(mark); else row.lastElementChild.before(mark);
    }
    mark.hidden = false;
  });
  /* The status line of the row with data-summary-row says what the page of that row sends. It follows the page that the reader saw
     last, and the row opens that page again. */
  const summary = page => {
    const on = shown_locks(page).filter(box => box.checked).map(box => box.getAttribute('aria-label'));
    if (!on.length) return 'Off';
    const from = page.querySelector('input[type="radio"]:checked');
    return [on[0], ...[...on.slice(1), `from ${from.parentElement.firstChild.nextSibling.textContent}`].map(text => text.toLowerCase())].join(', ');
  };
  const write_summary = () => {
    const state = location.hash.slice(1), page = document.querySelector(`[data-state="${state}"] [data-channel]`);
    if (!page || page.hidden || !shown_locks(page).length) return;
    document.querySelectorAll('[data-summary-row]').forEach(row => {
      row.setAttribute('href', `#${state}`);
      row.querySelector('[data-summary]').textContent = summary(page);
    });
  };
  document.addEventListener('change', write_summary);
  addEventListener('hashchange', write_summary);
  write_summary();
})();
</script>
<script src="../../../assets/sketch.js"></script>
