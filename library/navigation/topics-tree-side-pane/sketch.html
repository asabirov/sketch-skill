<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topics tree with a side pane sketch</title>
<link rel="stylesheet" href="../../../assets/sketch.css">
<style>
  /* A phone screen. The frame keeps the width of a phone in a wide window, so each part acts as it does on a phone. */
  html { height: 100%; }
  body[data-sketch] { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  [data-sketch] > [data-state] { flex: 1; min-height: 0; }
  [data-sketch] [data-screen] { height: 100%; }
  [data-sketch] .phone { position: relative; isolation: isolate; width: min(100%, 430px); height: 100%; margin: 0 auto; overflow: hidden; }
  [data-sketch] .phone_screen { position: absolute; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--sketch-page); }
  [data-sketch] .phone_bar { grid-row: 1; display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 6px 8px; }
  [data-sketch] .phone_bar :is(h1, h2) { flex: 1; min-width: 0; margin: 0 8px; font-size: 20px; letter-spacing: -.3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  [data-sketch] .phone_body { grid-row: 2; min-height: 0; padding: 4px 16px 16px; overflow-y: auto; }
  [data-sketch] .phone_body > p { margin: 0 0 12px; }
  @media (min-width: 600px) { [data-sketch] .phone { border-inline: var(--sketch-stroke) solid var(--sketch-muted); } }
  /* A plain box stands for a part that this pattern does not draw. It names the part, and the pattern that draws it. */
  [data-sketch] .part_box { display: grid; place-content: center; justify-items: center; gap: 2px; min-height: 88px; padding: 12px; border: var(--sketch-stroke) solid var(--sketch-muted); border-radius: var(--sketch-wobble); text-align: center; text-decoration: none; }
  [data-sketch] .part_box.fill { height: 100%; }
  /* Each motion value below comes from transitions.json. */
  [data-sketch] { --phone_out: cubic-bezier(0.23, 1, 0.32, 1); }
  /* A pressed row or button shrinks and takes a soft fill while the finger is down. */
  [data-sketch] .phone_press:active { background-color: var(--sketch-wash); transform: scale(0.96); }
  @media (prefers-reduced-motion: no-preference) { [data-sketch] .phone_press { transition: transform 120ms var(--phone_out), background-color 120ms var(--phone_out); } }
  /* The tree: each topic hangs from a line that starts under the mark of its channel. */
  [data-sketch] :is(.tree_channels, .tree_topics) { margin: 0; padding: 0; list-style: none; }
  [data-sketch] .tree_channels > li { margin-bottom: 12px; }
  [data-sketch] .tree_row { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 44px; padding: 4px 8px; border-radius: var(--sketch-wobble); text-decoration: none; }
  [data-sketch] .tree_row:hover { background: var(--sketch-wash); }
  [data-sketch] .tree_row[aria-current] { background: var(--sketch-wash); font-weight: 600; }
  [data-sketch] .tree_mark { flex: none; width: 20px; text-align: center; font-size: 18px; font-weight: 600; }
  [data-sketch] .tree_name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  [data-sketch] .tree_topics { position: relative; margin-left: 17px; padding-left: 16px; border-left: var(--sketch-stroke) solid var(--sketch-muted); }
  [data-sketch] .tree_topics > li { position: relative; }
  [data-sketch] .tree_topics > li::before { content: ""; position: absolute; left: -16px; top: 50%; width: 12px; border-top: var(--sketch-stroke) solid var(--sketch-muted); }
  /* The line stops at the last topic. */
  [data-sketch] .tree_topics > li:last-child::after { content: ""; position: absolute; left: -19px; top: calc(50% + var(--sketch-stroke)); bottom: 0; width: 5px; background: var(--sketch-page); }
  [data-sketch] .tree_count { flex: none; min-width: 24px; padding: 1px 7px; border-radius: 12px; text-align: center; }
  /* The tree stays beside the page of the topic. */
  [data-sketch] .phone.tree_panes { display: grid; grid-template: minmax(0, 1fr) / minmax(150px, 44%) minmax(0, 1fr); width: min(100%, 860px); }
  [data-sketch] .tree_panes > .phone_screen { position: static; min-width: 0; }
  [data-sketch] .tree_panes > .phone_screen + .phone_screen { border-left: var(--sketch-stroke) solid var(--sketch-muted); }
  [data-sketch] .tree_panes .phone_body { padding-inline: 8px; }
  @media (min-width: 600px) {
    [data-sketch] .phone.tree_panes { grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); }
    [data-sketch] .tree_panes .phone_body { padding-inline: 16px; }
  }
</style>
<body data-sketch>

<section data-state="tree">
  <div data-screen="topic_panes"></div>
</section>
<section data-state="topic">
  <div data-screen="topic_panes" data-show="topic"></div>
</section>
<section data-state="empty">
  <div data-screen="topic_panes" data-show="empty"></div>
</section>

<!-- The tree and the page of the topic are side by side. -->
<template id="topic_panes">
<div class="phone tree_panes">
  <nav class="phone_screen" aria-label="Channels">
    <header class="phone_bar"><h1>Channels</h1></header>
    <div class="phone_body" data-part="empty"><p>You are in no channel. A channel that you join shows here.</p></div>
    <div class="phone_body" data-part="!empty">
      <ul class="tree_channels">
        <li>
          <a class="tree_row phone_press" href="#topic"><span class="tree_mark" aria-hidden="true">#</span><span class="tree_name">weekend-market</span><span class="sketch-badge strong tree_count" aria-label="4 new messages">4</span></a>
          <ul class="tree_topics">
            <li><a class="tree_row phone_press" href="#topic" data-current-in="topic"><span class="tree_name">Stall plan</span><span class="sketch-badge strong tree_count" aria-label="1 new message">1</span></a></li>
            <li><a class="tree_row phone_press" href="#topic"><span class="tree_name">Price list</span></a></li>
          </ul>
        </li>
        <li>
          <a class="tree_row phone_press" href="#topic"><span class="tree_mark" aria-hidden="true">#</span><span class="tree_name">neighbourhood-association-2026</span></a>
          <ul class="tree_topics">
            <li><a class="tree_row phone_press" href="#topic"><span class="tree_name">Street repairs</span></a></li>
          </ul>
        </li>
        <li>
          <a class="tree_row phone_press" href="#topic"><span class="tree_mark" aria-hidden="true">#</span><span class="tree_name">summer-trip</span></a>
          <ul class="tree_topics">
            <li><a class="tree_row phone_press" href="#topic"><span class="tree_name">Train tickets</span></a></li>
          </ul>
        </li>
        <li><a class="tree_row phone_press" href="#topic"><span class="tree_mark" aria-hidden="true">#</span><span class="tree_name">car-share</span></a></li>
      </ul>
    </div>
  </nav>
  <main class="phone_screen">
    <header class="phone_bar" data-part="topic"><h2 data-page-title>Stall plan</h2></header>
    <div class="phone_body" data-part="topic"><div class="part_box fill"><strong>Chat page</strong></div></div>
    <header class="phone_bar" data-part="!topic"></header>
    <div class="phone_body" data-part="!topic"><p>No topic is open.</p></div>
  </main>
</div>
</template>

<script>
/* The screens of a pattern sketch. This script runs before the kit script.
   A block with data-screen takes a copy of the <template> with that id. Its data-show names the parts that the state shows.
   In a template, data-part="name" shows an element only with that part, and "!name" only without it.
   data-current-in marks the open row.
   A link to "#state" and a button with data-go change the state. data-move names the transition that the change plays.
   After the change, the element whose data-focus names a shown part takes the focus. */
(() => {
  const has_part = (shown, names) => {
    const list = names.split(' ').filter(Boolean), wanted = list.filter(name => name[0] !== '!');
    return list.every(name => name[0] !== '!' || !shown.includes(name.slice(1))) && (!wanted.length || wanted.some(name => shown.includes(name)));
  };
  const parts_of = block => (block.dataset.show || '').split(' ');
  document.querySelectorAll('[data-screen]').forEach((block, index) => {
    const copy = document.getElementById(block.dataset.screen).content.cloneNode(true);
    const shown = parts_of(block);
    ['id', 'for', 'name', 'aria-controls', 'aria-labelledby', 'aria-describedby'].forEach(name =>
      copy.querySelectorAll(`[${name}]`).forEach(node => node.setAttribute(name, `s${index}_${node.getAttribute(name)}`)));
    copy.querySelectorAll('[data-part]').forEach(part => { part.hidden = !has_part(shown, part.dataset.part); });
    copy.querySelectorAll('[data-current-in]').forEach(node => { if (has_part(shown, node.dataset.currentIn)) node.setAttribute('aria-current', 'true'); });
    block.append(copy);
  });
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const shown_block = () => document.querySelector('[data-state]:not([hidden]) [data-screen]');
  /* A move plays one transition of transitions.json. play adds the class that holds the animation, and takes it away at the end. */
  window.pattern_moves = {};
  window.pattern_play = (node, name, after) => {
    if (reduced.matches) { if (after) after(); return; }
    const done = event => {
      if (event.target !== node) return;
      node.removeEventListener('animationend', done);
      node.classList.remove(name);
      if (after) after();
    };
    node.addEventListener('animationend', done);
    node.classList.add(name);
  };
  let focus_next = false;
  window.pattern_go = (state, move, from) => {
    const to = document.querySelector(`[data-state="${state}"] [data-screen]`);
    if (to && to !== from && move && !reduced.matches) pattern_moves[move](from, to);
    focus_next = true;
    location.hash = state;
  };
  /* The capture phase keeps the kit from pressing a chip in the state that the reader leaves. */
  document.addEventListener('click', event => {
    const control = event.target.closest('[data-go], a[href^="#"]');
    const block = control && control.closest('[data-screen]');
    if (!block || control.matches(':disabled')) return;
    event.preventDefault();
    event.stopPropagation();
    pattern_go(control.dataset.go || control.getAttribute('href').slice(1), control.dataset.move, block);
  }, true);
  addEventListener('hashchange', () => requestAnimationFrame(() => {
    const block = shown_block();
    const target = focus_next && block && [...block.querySelectorAll('[data-focus]')].find(node => !node.closest('[hidden]') && has_part(parts_of(block), node.dataset.focus));
    focus_next = false;
    if (target) target.focus({preventScroll: true});
  }));
})();
/* The page takes the name of the row that opens it, and the tree marks that row. */
(() => {
  const marked = [...document.querySelectorAll('[data-screen]')].filter(block => block.querySelector('.tree_row[aria-current]'));
  document.addEventListener('click', event => {
    const row = event.target.closest('.tree_row');
    if (!row) return;
    const name = row.querySelector('.tree_name').textContent;
    document.querySelectorAll('[data-page-title]').forEach(title => { title.textContent = name; });
    marked.forEach(block => block.querySelectorAll('.tree_row').forEach(other => {
      if (other.querySelector('.tree_name').textContent === name) other.setAttribute('aria-current', 'true');
      else other.removeAttribute('aria-current');
    }));
  }, true);
})();
</script>
<script src="../../../assets/sketch.js"></script>
