<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forum of posts sketch</title>
<link rel="stylesheet" href="../../../assets/sketch.css">
<style>
  /* A box with the class pattern_part stands for a part that another pattern draws. It names the part and that pattern. */
  [data-sketch] .pattern_part { display: grid; gap: 2px; place-content: center; justify-items: center; min-width: 200px; padding: 16px; text-align: center; }
  [data-sketch] .pattern_part > * { padding: 0 8px; background: var(--sketch-page); }
  [data-sketch] .pattern_part b { color: var(--sketch-ink); }
/* A title with the class pattern_plain_title is the main heading of the page for a screen reader. It looks like the text around it. */
[data-sketch] .pattern_plain_title { margin: 0; font: inherit; letter-spacing: inherit; }
/* A title with the class pattern_hidden_title names a page whose drawn title is out of view. Only a screen reader reads it. */
[data-sketch] .pattern_hidden_title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* A reaction is an emoji with no word. The sketch has one ink, so each emoji is drawn in grey, with more contrast. Its name is the label of its button. */
  [data-sketch] .emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-style: normal; line-height: 1; filter: grayscale(1) contrast(1.8) brightness(0.72); }
  /* A plain box stands for a picture. A plain box with a play button stands for a video. */
  [data-sketch] .feed_media { position: relative; min-height: 180px; }
  [data-sketch] .feed_media > span { padding: 0 8px; background: var(--sketch-page); }
  [data-sketch] .feed_media .feed_play { position: absolute; inset: 50% auto auto 50%; translate: -50% -50%; width: 56px; height: 56px; border: var(--sketch-stroke) solid var(--sketch-ink); border-radius: 50%; background: var(--sketch-page); color: var(--sketch-ink); }
  [data-sketch] .feed_media .feed_play:hover { background: var(--sketch-wash); }
  [data-sketch] .feed_media .feed_play .sketch-icon { fill: currentColor; margin-left: 3px; }
  [data-sketch] .feed_media .feed_length { position: absolute; right: 8px; bottom: 8px; font-size: 14px; color: var(--sketch-ink); }
  /* A long text shows its first lines. The Show more button opens the rest in place. */
  [data-sketch] .feed_cut { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  [data-sketch] .feed_more { justify-self: start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-left: -12px; padding: 0 12px; border: 0; border-radius: var(--sketch-wobble); background: none; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
  [data-sketch] .feed_more:hover { background: var(--sketch-wash); }
  [data-sketch] .feed_more:active { background: color-mix(in srgb, var(--sketch-ink) 18%, transparent); }
  /* A card has its tags at the top, with a pin before the tags of a pinned post. Then the title, one line of the author with the
     start of the text, and one line of counts: the most used reaction, the comments and the age. Each count has an icon and no word. */
  [data-sketch] .sketch-list > .feed_card { display: grid; margin: 0; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 8px 16px 12px; }
  [data-sketch] .feed_card h2 { font-size: 19px; }
  [data-sketch] .sketch-main .feed_card h2 a { display: inline; min-height: 0; text-decoration: none; }
  [data-sketch] .feed_card h2 a::after { content: ""; position: absolute; inset: 0; } /* The whole card opens the post. */
  [data-sketch] .feed_card { position: relative; }
  [data-sketch] .feed_card .sketch-icon-button { position: relative; z-index: 1; margin: 0 -10px 0 0; }
  [data-sketch] .feed_tags { display: flex; align-items: center; gap: 6px; min-width: 0; }
  [data-sketch] .feed_tags .sketch-badge { display: inline-flex; align-items: center; gap: 4px; }
  [data-sketch] .feed_tags .sketch-badge .sketch-icon { width: 14px; height: 14px; }
  [data-sketch] .feed_stats { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin-top: 4px; font-size: 14px; }
  [data-sketch] .feed_stat { display: inline-flex; align-items: center; gap: 6px; }
  [data-sketch] .feed_stat .sketch-icon { width: 16px; height: 16px; }
  [data-sketch] .feed_reaction .emoji { font-size: 16px; }
  /* The form of a new post opens in the place of the search field. The title and the message have no frame of their own. */
  [data-sketch] .feed_new { display: grid; gap: 4px; padding: 8px 4px 12px; }
  [data-sketch] .feed_new > .sketch-row { padding-inline: 12px; }
  [data-sketch] .feed_new :is(input, textarea) { border-color: transparent; background: none; }
  [data-sketch] .feed_new input { font-size: 19px; font-weight: 600; }
  [data-sketch] .feed_new textarea { min-height: 88px; resize: vertical; }
  [data-sketch] .feed_card :is(h2, p) { margin: 0; }
  [data-sketch] .feed_card p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  [data-sketch] .feed_card > :not(.sketch-outline) { grid-column: 1; }
  /* A card with a picture or a video has a small plain box at its right. The box of a video has a play mark, and it is no control. */
  [data-sketch] .feed_card > .sketch-placeholder { grid-column: 2; grid-row: 1 / span 4; width: 96px; min-height: 72px; align-self: center; }
  [data-sketch] .feed_card > .sketch-placeholder .sketch-icon { fill: currentColor; color: var(--sketch-ink); }
  [data-sketch] .feed_card:has([aria-current]), [data-sketch] .feed_card:has(h2 a:hover) { background: var(--sketch-wash); }
  [data-sketch] .feed_card h2 a:focus-visible { outline: 0; }
  [data-sketch] .feed_card h2 a:focus-visible::after { outline: var(--sketch-stroke) solid var(--sketch-ink); outline-offset: 3px; border-radius: var(--sketch-wobble); }
  @media (min-width: 1000px) {
    [data-sketch] .feed_forum:has(> .feed_pane:not([hidden])) { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); max-width: none; gap: 48px; }
  }
  @media (max-width: 999px) {
    [data-sketch] .feed_forum:has(> .feed_pane:not([hidden])) > .feed_list { display: none; }
  }
  [data-sketch] .sketch-main a.sketch-chip { min-width: 0; min-height: 32px; text-decoration: none; }
</style>
<body data-sketch>

<section data-state="feed">
  <div data-screen="forum_feed"></div>
</section>
<section data-state="sorted">
  <div data-screen="forum_feed" data-show="sorted"></div>
</section>
<section data-state="tag-filter">
  <div data-screen="forum_feed" data-show="tags"></div>
</section>
<section data-state="post">
  <div data-screen="forum_feed" data-show="pane"></div>
</section>
<section data-state="reaction-added">
  <div data-screen="forum_feed" data-show="pane reacted"></div>
</section>
<section data-state="compose">
  <div data-screen="forum_feed" data-show="compose"></div>
</section>
<section data-state="empty">
  <div data-screen="forum_feed" data-show="empty"></div>
</section>

<!-- Each post is a card with a title. A card opens the post in a pane, and the list stays. -->
<template id="forum_feed">
<header class="sketch-bar" role="banner"><strong>[Product]</strong></header>
<main class="sketch-main feed_forum">
  <section class="sketch-stack feed_list" aria-label="Posts">
    <h1>Help and ideas</h1>
    <div class="sketch-row" data-part="!compose"><input class="sketch-input" type="search" aria-label="Search or write a post" placeholder="Search or write a post" style="flex:1;min-width:160px"><button class="sketch-button" type="button" data-go="compose">New post</button></div>
    <div class="sketch-panel sketch-frame feed_new" data-part="compose" data-new-post>
      <input class="sketch-input" aria-label="Title" placeholder="Title">
      <textarea class="sketch-input" aria-label="Message" placeholder="Write a message"></textarea>
      <div class="sketch-row" role="group" aria-label="Tag of the post"><button class="sketch-chip" type="button" aria-pressed="true">Question</button><button class="sketch-chip" type="button" aria-pressed="false">Problem</button><button class="sketch-chip" type="button" aria-pressed="false">Idea</button></div>
      <div class="sketch-row"><button class="sketch-icon-button" type="button" aria-label="Attach a file"><i data-glyph="paperclip"></i></button><span class="sketch-spacer"></span><button class="sketch-button secondary" type="button" data-go="feed">Cancel</button><button class="sketch-button" type="button" disabled data-go="feed" data-sketch-toast="Post sent (sample)">Post</button></div>
    </div>
    <div class="sketch-row" data-part="!empty">
      <label class="sketch-row">Sort<select class="sketch-input" style="width:auto"><option data-go="feed">Recent activity</option><option data-go="sorted" data-select-in="sorted">Date posted</option></select></label>
      <div class="sketch-row" role="group" aria-label="Tags"><button class="sketch-chip" type="button" aria-pressed="false" data-go="tag-filter" data-part="!tags">Question</button><button class="sketch-chip" type="button" aria-pressed="true" data-go="feed" data-part="tags">Question</button><button class="sketch-chip" type="button" aria-pressed="false">Problem</button><button class="sketch-chip" type="button" aria-pressed="false">Idea</button></div>
    </div>

    <div class="sketch-stack" style="justify-items:center;text-align:center;padding:48px 0" data-part="empty">
      <h2>No posts yet</h2>
      <p style="margin:0;max-width:44ch">Ask a question or share an idea. Each post gets its own thread.</p>
    </div>

    <ul class="sketch-list sketch-stack" data-part="!empty">
      <li class="feed_card sketch-panel sketch-frame">
        <div class="feed_tags"><span class="sketch-badge" role="img" aria-label="Pinned"><i data-glyph="pin"></i></span><span class="sketch-badge">News</span><span class="sketch-spacer"></span><button class="sketch-icon-button" type="button" aria-label="Post actions"><i data-icon="more"></i></button></div>
        <h2><a href="#post">Read this first: how to ask for help</a></h2>
        <p><b>Mara Lind:</b> Say which line and which stop. Add a picture of the sign if you can.</p>
        <div class="feed_stats"><span class="feed_stat" role="img" aria-label="17 reactions, most of them thumbs up"><span class="emoji" aria-hidden="true">👍</span>17</span><span class="feed_stat" role="img" aria-label="89 comments"><i data-icon="comment"></i>89</span><span class="sketch-muted">3 weeks</span></div>
      </li>
      <li class="feed_card sketch-panel sketch-frame" data-part="sorted">
        <div class="feed_tags"><span class="sketch-badge">Question</span><span class="sketch-spacer"></span><button class="sketch-icon-button" type="button" aria-label="Post actions"><i data-icon="more"></i></button></div>
        <h2><a href="#post">Can a rider get alerts for one stop only?</a></h2>
        <p><b>Sam Kim:</b> A rider asked at the depot. The form has lines, not stops.</p>
        <div class="feed_stats"><span class="feed_stat" role="img" aria-label="1 comments"><i data-icon="comment"></i>1</span><span class="sketch-muted">10 min</span></div>
      </li>
      <li class="feed_card sketch-panel sketch-frame">
        <div class="feed_tags"><span class="sketch-badge">Question</span><span class="sketch-spacer"></span><button class="sketch-icon-button" type="button" aria-label="Post actions" data-sketch-popover="row_menu"><i data-icon="more"></i></button></div>
        <div class="sketch-placeholder" role="img" aria-label="Picture">Picture</div>
        <h2><a href="#post" data-current-in="pane">Which stops get the paper notice first?</a></h2>
        <p><b>Ada Park:</b> The new signs come two weeks late. We have 31 stops on the east line and one person to put the notices up, so we need an order.</p>
        <div class="feed_stats"><span class="feed_stat" role="img" aria-label="5 reactions, most of them thumbs up"><span class="emoji" aria-hidden="true">👍</span>5</span><span class="feed_stat" role="img" aria-label="12 comments"><i data-icon="comment"></i>12</span><span class="sketch-badge">3 new</span><span class="sketch-muted">2 min</span></div>
      </li>
      <li class="feed_card sketch-panel sketch-frame" data-part="!tags">
        <div class="feed_tags"><span class="sketch-badge">Problem</span><span class="sketch-spacer"></span><button class="sketch-icon-button" type="button" aria-label="Post actions"><i data-icon="more"></i></button></div>
        <div class="sketch-placeholder" role="img" aria-label="Video"><i data-glyph="play"></i></div>
        <h2><a href="#post">Text alerts arrive late on two networks</a></h2>
        <p><b>Lee Ortiz:</b> The test message took ten minutes on my phone. The video shows the clock of the depot and the phone side by side.</p>
        <div class="feed_stats"><span class="feed_stat" role="img" aria-label="2 reactions, most of them eyes"><span class="emoji" aria-hidden="true">👀</span>2</span><span class="feed_stat" role="img" aria-label="7 comments"><i data-icon="comment"></i>7</span><span class="sketch-muted">Sam is writing</span></div>
      </li>
      <li class="feed_card sketch-panel sketch-frame" data-part="!sorted">
        <div class="feed_tags"><span class="sketch-badge">Question</span><span class="sketch-spacer"></span><button class="sketch-icon-button" type="button" aria-label="Post actions"><i data-icon="more"></i></button></div>
        <h2><a href="#post">Can a rider get alerts for one stop only?</a></h2>
        <p><b>Sam Kim:</b> A rider asked at the depot. The form has lines, not stops.</p>
        <div class="feed_stats"><span class="feed_stat" role="img" aria-label="1 comments"><i data-icon="comment"></i>1</span><span class="sketch-muted">10 min</span></div>
      </li>
    </ul>
  </section>

  <aside class="sketch-stack feed_pane" aria-label="Post" data-part="pane">
    <h1 class="pattern_hidden_title sketch-until-desktop">Help and ideas</h1>
    <div class="sketch-row"><a class="sketch-until-desktop" href="#feed"><i data-icon="arrow-left"></i>Posts</a><span class="sketch-spacer"></span><button class="sketch-icon-button" type="button" aria-label="Copy link" data-sketch-toast="Link copied"><i data-icon="link"></i></button><a class="sketch-from-desktop" href="#feed" aria-label="Close the post"><i data-icon="close"></i></a></div>
    <h2 style="font-size:24px">Which stops get the paper notice first?</h2>
    <div class="sketch-row"><span class="sketch-badge">Question</span></div>
    <div class="sketch-row"><span class="sketch-avatar">AP</span><b>Ada Park</b><span class="sketch-badge">Author</span><span class="sketch-muted">2 h</span></div>
    <p>The new signs come two weeks late. We have 31 stops on the east line and one person to put the notices up, so we need an order.</p>
    <p>My plan is to start at the 6 stops where two lines meet, because most riders change there. Then the stops near the 2 schools, and then the others from north to south. The picture shows the stops on the map.</p>
    <div class="sketch-placeholder feed_media" role="img" aria-label="Picture"><span>Picture</span></div>
    <div class="sketch-row"><button class="sketch-chip feed_reaction" type="button" aria-pressed="true" aria-label="Thumbs up, 4 members"><span class="emoji" aria-hidden="true">👍</span>4</button><button class="sketch-chip feed_reaction" type="button" aria-pressed="false" aria-label="Thanks, 1 member" data-go="reaction-added" data-part="!reacted"><span class="emoji" aria-hidden="true">🙏</span>1</button><button class="sketch-chip feed_reaction" type="button" aria-pressed="true" aria-label="Thanks, 2 members" data-go="post" data-part="reacted"><span class="emoji" aria-hidden="true">🙏</span>2</button><button class="sketch-icon-button" type="button" aria-label="Add a reaction" data-sketch-popover="picker"><i data-icon="smile"></i></button><span class="sketch-spacer"></span><button class="sketch-chip" type="button" data-sketch-popover="follow"><i data-icon="bell"></i>Follow</button></div>
    <div class="sketch-popover" id="follow"><div class="sketch-placeholder pattern_part"><b>Follow menu</b><span>Pattern: notifications/follow-menu</span></div></div>
    <div class="sketch-popover" id="picker"><div class="sketch-placeholder pattern_part"><b>Reaction picker</b><span>Pattern: content/feed-full-posts</span></div></div>
    <div class="sketch-placeholder pattern_part"><b>Comment thread with its comment field</b><span>Pattern: content/comment-thread</span></div>
  </aside>
<div class="sketch-menu" id="row_menu"><div class="sketch-placeholder pattern_part"><b>Row menu</b><span>Pattern: content/feed-full-posts</span></div></div>
</main>
</template>

<script>
/* Screens of a pattern sketch. This script runs before the kit script.
   A block with data-screen takes a copy of the <template> with that id. Its data-show names the parts that the state shows.
   In a template, data-part="name" shows an element only with that part, and "!name" only without it. On a menu, a popover or a
   dialog, the part opens it. data-select-in="name" selects a tab or an option, data-current-in="name" marks the open row, and
   data-off-in="name" clears a checkbox. A tab that is a link, and a button or an option with data-go, change the state.
   A block with data-toast shows that toast when its state opens. */
(() => {
  const has_part = (shown, names) => {
    const list = names.split(' '), wanted = list.filter(name => name[0] !== '!');
    return list.every(name => name[0] !== '!' || !shown.includes(name.slice(1))) && (!wanted.length || wanted.some(name => shown.includes(name)));
  };
  document.querySelectorAll('[data-screen]').forEach((block, index) => {
    const copy = document.getElementById(block.dataset.screen).content.cloneNode(true);
    const shown = (block.dataset.show || '').split(' ');
    ['id', 'name', 'aria-controls', 'aria-labelledby', 'data-sketch-popover', 'data-sketch-open'].forEach(name =>
      copy.querySelectorAll(`[${name}]`).forEach(node => node.setAttribute(name, `s${index}_${node.getAttribute(name)}`)));
    copy.querySelectorAll('[data-part]').forEach(part => {
      const on = has_part(shown, part.dataset.part);
      if (part.matches('.sketch-menu, .sketch-popover, dialog')) part.toggleAttribute('data-open', on);
      else part.hidden = !on;
    });
    copy.querySelectorAll('[data-select-in]').forEach(node => {
      if (!has_part(shown, node.dataset.selectIn)) return;
      if (node.matches('option')) { node.setAttribute('selected', ''); return; }
      node.parentElement.querySelectorAll('[aria-selected]').forEach(other => other.setAttribute('aria-selected', 'false'));
      node.setAttribute('aria-selected', 'true');
    });
    copy.querySelectorAll('[data-current-in]').forEach(node => { if (has_part(shown, node.dataset.currentIn)) node.setAttribute('aria-current', 'true'); });
    copy.querySelectorAll('[data-off-in]').forEach(box => { if (has_part(shown, box.dataset.offIn)) box.checked = false; });
    block.append(copy);
  });
  /* The kit selects a clicked tab in the state that the reader leaves. Each state gets its own tab and option back. */
  const link_tabs = [...document.querySelectorAll('a[role="tab"]')].map(tab => [tab, tab.getAttribute('aria-selected') === 'true']);
  addEventListener('hashchange', () => {
    link_tabs.forEach(([tab, chosen]) => tab.setAttribute('aria-selected', String(chosen)));
    const block = document.querySelector(`[data-state="${location.hash.slice(1)}"] [data-screen][data-toast]`);
    const toast = document.querySelector('.sketch-toast');
    if (block) sketchToast(block.dataset.toast); else if (toast) toast.hidden = true;
  });
  /* The capture phase keeps the kit from pressing a chip in the state that the reader leaves.
     A sample link with the address "#" leads nowhere, so it keeps the state. Without this, it opens the first state. */
  document.addEventListener('click', event => {
    if (event.target.closest('a[href="#"]')) event.preventDefault();
    const button = event.target.closest('button[data-go]');
    if (!button) return;
    event.stopPropagation();
    location.hash = button.dataset.go;
  }, true);
  document.addEventListener('change', event => {
    const to = event.target.selectedOptions?.[0].dataset.go;
    if (!to) return;
    event.target.selectedIndex = Math.max(0, [...event.target.options].findIndex(option => option.defaultSelected));
    location.hash = to;
  });
})();
/* Line icons that the kit does not have. The kit draws <i data-glyph="name"></i> with the paths in window.sketchGlyphs. */
window.sketchGlyphs = {
    pin: 'M9 4h6l-1 6 3 3H7l3-3zM12 13v7', heart: 'M12 20c-4-3-7-6-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 4-3 7-7 10z',
    repost: 'M7 7h9a2 2 0 0 1 2 2v6M15 12l3 3 3-3M17 17H8a2 2 0 0 1-2-2V9M9 12L6 9l-3 3', views: 'M6 20v-6M12 20V4M18 20v-9',
    'bell-off': 'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4M4 4l16 16', 'bell-ring': 'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4M3 8c0-2 1-3.5 2.5-4.5M21 8c0-2-1-3.5-2.5-4.5',
    mail: 'M4 6h16v12H4zM4 7l8 6 8-6', phone: 'M8 3h8v18H8zM11 18h2', rss: 'M5 19v.5M5 12a7 7 0 0 1 7 7M5 5a14 14 0 0 1 14 14',
    'arrow-up': 'M12 19V5M6 11l6-6 6 6', 'arrow-down': 'M12 5v14M6 13l6 6 6-6', reply: 'M10 8l-5 4 5 4M5 12h9a5 5 0 0 1 5 5v1',
    code: 'M9 7l-5 5 5 5M15 7l5 5-5 5', tag: 'M4 4h8l8 8-8 8-8-8zM8.5 8.5v.5', play: 'M8 5l11 7-11 7z', paperclip: 'M19 11l-7 7a4 4 0 0 1-6-6l8-8a3 3 0 0 1 4 4l-8 8a1.5 1.5 0 0 1-2-2l7-7',
  };
/* The Post button stays off until the title has text. One tag of the new post is pressed at a time. The open form puts the focus in the title. */
document.addEventListener('input', event => {
  const box = event.target.closest('[data-new-post]');
  if (box) box.querySelector('.sketch-button:not(.secondary)').disabled = !box.querySelector('input').value.trim();
});
document.addEventListener('click', event => {
  const chip = event.target.closest('[data-new-post] .sketch-chip');
  if (chip) chip.parentElement.querySelectorAll('.sketch-chip').forEach(other => other.setAttribute('aria-pressed', String(other === chip)));
});
['load', 'hashchange'].forEach(name => addEventListener(name, () =>
  document.querySelector(`[data-state="${location.hash.slice(1)}"] [data-new-post]:not([hidden]) input`)?.focus()));
</script>
<script src="../../../assets/sketch.js"></script>
