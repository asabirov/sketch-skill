<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comment tree with votes sketch</title>
<style data-sketch-kit="0.13.0">
/* One black marker on bare paper. Scoped foundation for disposable review prototypes.
   There is one ink; everything quieter is that ink thinned. A fill is only ever that ink or the
   page, so a drawn frame sits on the page rather than around a card of some other colour. A
   browser paints its own colours into a native control, a link and an autofilled field, so each
   is taken back below. */
[data-sketch] {
  color-scheme: light;
  --sketch-page: #fbfbf8; --sketch-ink: #1b1b19;
  --sketch-muted: color-mix(in srgb, var(--sketch-ink) 68%, transparent);
  --sketch-wash: color-mix(in srgb, var(--sketch-ink) 10%, transparent);
  --sketch-stroke: 1.7px; --sketch-space: 8px;
  /* A drawn box: four unequal corner radii, so no edge looks machine-made. */
  --sketch-wobble: 18px 5px 14px 7px / 6px 16px 5px 17px;
  margin: 0; color: var(--sketch-ink); background: var(--sketch-page);
  font: 14px/1.5 Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
html[data-theme="dark"] [data-sketch], html[data-theme="dark"][data-sketch] {
  /* The marker is the light stroke; the page is what went dark. */
  color-scheme: dark;
  --sketch-page: #141513; --sketch-ink: #efeee6;
}
[data-sketch] *, [data-sketch] *::before, [data-sketch] *::after { box-sizing: border-box; }
[data-sketch] h1 { font-size: 30px; line-height: 1.2; letter-spacing: -1px; }
[data-sketch] h2 { font-size: 18px; line-height: 1.35; letter-spacing: -.3px; }
[data-sketch] h3 { font-size: 14px; line-height: 1.5; }
[data-sketch] :is(button, input, textarea, select) { font: inherit; color: inherit; }
[data-sketch] :is(input[type="radio"], input[type="checkbox"]) {
  appearance: none; -webkit-appearance: none; flex: none; margin: 0;
  width: 18px; height: 18px; background: none; cursor: pointer;
  border: var(--sketch-stroke) solid var(--sketch-ink);
  border-radius: 52% 48% 51% 49% / 49% 52% 48% 51%;
}
[data-sketch] input[type="checkbox"] { border-radius: 5px 2px 4px 3px / 3px 4px 2px 5px; }
[data-sketch] :is(input[type="radio"], input[type="checkbox"]):checked { background: var(--sketch-ink); }
/* Half-chosen: a struck bar, so it is not read as either of the other two. */
[data-sketch] input[type="checkbox"]:indeterminate {
  background: feed-gradient(var(--sketch-ink), var(--sketch-ink)) center / 60% var(--sketch-stroke) no-repeat;
}
[data-sketch] :is(input[type="radio"], input[type="checkbox"]):hover:not(:disabled) { box-shadow: 0 0 0 3px var(--sketch-wash); }
[data-sketch] :is(input[type="radio"], input[type="checkbox"]):active:not(:disabled) { transform: translateY(1px); }
[data-sketch] :is(input[type="radio"], input[type="checkbox"]):disabled { opacity: .4; cursor: not-allowed; }
/* Forced colours repaints an author background, so the chosen state cannot rest on one alone. */
@media (forced-colors: active) {
  [data-sketch] :is(input[type="radio"], input[type="checkbox"]):checked { background: CanvasText; border-color: CanvasText; }
}
/* Covers what is left native: a range track, a progress bar. */
[data-sketch] { accent-color: var(--sketch-ink); }
/* A link keeps the browser's blue and its visited purple unless it is told not to. */
[data-sketch] :is(a, a:link, a:visited, a:active):not(.sketch-button) { color: inherit; text-decoration-color: var(--sketch-muted); }
[data-sketch] ::placeholder { color: var(--sketch-muted); }
[data-sketch] ::selection { background: var(--sketch-wash); }

/* A panel is spacing, not a surface: no fill, so the drawn outline is the only edge. */
[data-sketch] .sketch-panel { background: none; padding: 24px; }
[data-sketch] .sketch-frame { position: relative; isolation: isolate; border: 0; }
[data-sketch] .sketch-outline { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; overflow: visible; }
[data-sketch] .sketch-outline path {
  stroke: var(--sketch-ink); stroke-width: var(--sketch-stroke); fill: none;
  stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke;
}

[data-sketch] .sketch-button {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; min-width: 44px; padding: 10px 16px; cursor: pointer; touch-action: manipulation;
  background: var(--sketch-ink); color: var(--sketch-page); text-decoration: none;
  border: var(--sketch-stroke) solid var(--sketch-ink); border-radius: var(--sketch-wobble);
}
/* Filled in solid with the same marker, or left as the outline alone. */
[data-sketch] .sketch-button.secondary { background: none; color: var(--sketch-ink); }
[data-sketch] .sketch-button:hover:not(:disabled) { background: color-mix(in srgb, var(--sketch-ink) 84%, transparent); }
[data-sketch] .sketch-button.secondary:hover:not(:disabled) { background: var(--sketch-wash); }
[data-sketch] .sketch-button:active:not(:disabled) { transform: translateY(1px); }
[data-sketch] .sketch-button:disabled { opacity: .4; cursor: not-allowed; }
[data-sketch] .sketch-input {
  min-height: 44px; width: 100%; padding: 10px 12px; background: none;
  border: var(--sketch-stroke) solid var(--sketch-ink);
  border-radius: 6px 16px 5px 15px / 15px 5px 17px 6px;
}
/* The native clear button of a search field is blue. It is drawn again as a cross in the ink. */
[data-sketch] input[type="search"]::-webkit-search-cancel-button {
  -webkit-appearance: none; width: 14px; height: 14px; cursor: pointer;
  background: feed-gradient(45deg, transparent 43%, var(--sketch-ink) 43% 57%, transparent 57%),
              feed-gradient(-45deg, transparent 43%, var(--sketch-ink) 43% 57%, transparent 57%);
}
[data-sketch] :is(.sketch-input, input):is(:-webkit-autofill, :autofill) {
  -webkit-text-fill-color: var(--sketch-ink);
  -webkit-box-shadow: inset 0 0 0 100px var(--sketch-page);
}
/* The mark stays 18px; the label around it is the target. */
[data-sketch] .sketch-choice {
  display: flex; align-items: flex-start; gap: 10px; min-height: 44px; padding: 10px 12px; cursor: pointer;
}
[data-sketch] .sketch-choice:hover { background: var(--sketch-wash); }
[data-sketch] :focus-visible { outline: var(--sketch-stroke) solid var(--sketch-ink); outline-offset: 3px; }

/* Layout: the spacing every sketch would otherwise write by hand. */
[data-sketch] .sketch-stack { display: grid; gap: 16px; align-content: start; }
[data-sketch] .sketch-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
[data-sketch] .sketch-spacer { flex: 1; }
[data-sketch] .sketch-muted { color: var(--sketch-muted); }

/* An overlay covers what lies under it, so the page fills its drawn outline. The fill follows the
   wobble: a rectangular background or a box shadow shows its corners outside the line. */
[data-sketch] :is(.sketch-popover, .sketch-menu, .sketch-dialog, .sketch-toast) {
  position: fixed; z-index: 40; isolation: isolate; margin: 0; border: 0; background: none; color: inherit; overflow: visible;
}
[data-sketch] :is(.sketch-popover, .sketch-menu, .sketch-dialog, .sketch-toast) > .sketch-outline path { fill: var(--sketch-page); }
[data-sketch] [hidden] { display: none !important; }
[data-sketch] .sketch-popover { width: max-content; max-width: min(360px, calc(100vw - 16px)); padding: 16px; display: grid; gap: 12px; }
[data-sketch] .sketch-menu { min-width: 200px; max-width: calc(100vw - 16px); padding: 8px; display: grid; }
[data-sketch] .sketch-menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 8px 12px;
  background: none; border: 0; border-radius: var(--sketch-wobble); text-align: left; text-decoration: none; cursor: pointer;
}
[data-sketch] .sketch-menu-item:is(:hover, :focus-visible):not(:disabled) { background: var(--sketch-wash); outline: 0; }
/* A disabled row and a disabled group label take the muted ink, not opacity, so they keep 4.5:1 on the page. */
[data-sketch] .sketch-menu-item:disabled { color: var(--sketch-muted); cursor: not-allowed; }
[data-sketch] .sketch-menu-group-label { padding: 12px 12px 4px; font-weight: 600; }
[data-sketch] .sketch-menu-group[aria-disabled="true"] > .sketch-menu-group-label { color: var(--sketch-muted); cursor: not-allowed; }
[data-sketch] .sketch-menu-item[aria-selected="true"] { background: var(--sketch-wash); font-weight: 600; }
/* A native dialog arrives with a filled box and a dark backdrop; both are taken back. */
[data-sketch] .sketch-dialog { inset: 0; width: min(480px, calc(100vw - 32px)); height: fit-content; margin: auto; padding: 24px; }
[data-sketch] .sketch-dialog[open] { display: grid; gap: 16px; }
[data-sketch] .sketch-dialog::backdrop { background: color-mix(in srgb, var(--sketch-page) 72%, transparent); }
[data-sketch] .sketch-toast { left: 50%; bottom: 24px; transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 12px 16px; display: flex; align-items: center; gap: 12px; }

/* Icons: one line set drawn with the marker. Write <i data-icon="close"></i>. */
[data-sketch] .sketch-icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
[data-sketch] .sketch-icon-button {
  display: inline-grid; place-items: center; width: 44px; height: 44px; padding: 0; flex: none;
  background: none; border: 0; border-radius: var(--sketch-wobble); cursor: pointer; touch-action: manipulation;
}
[data-sketch] .sketch-icon-button:hover:not(:disabled) { background: var(--sketch-wash); }
/* A hover rule outranks a state rule, so each state that fills names its own hover (#155). */
[data-sketch] .sketch-icon-button:is([aria-pressed="true"], [aria-expanded="true"]),
[data-sketch] .sketch-icon-button:is([aria-pressed="true"], [aria-expanded="true"]):hover:not(:disabled) { background: color-mix(in srgb, var(--sketch-ink) 18%, transparent); }
[data-sketch] :is(.sketch-icon-button, .sketch-chip, .sketch-segmented label):active { transform: translateY(1px); }
[data-sketch] :is(.sketch-icon-button, .sketch-chip):disabled { opacity: .4; cursor: not-allowed; }

/* One of a few modes: native radios, so the arrow keys work. The chosen one is filled. */
[data-sketch] .sketch-segmented {
  display: inline-flex; gap: 2px; padding: 2px; border: var(--sketch-stroke) solid var(--sketch-ink); border-radius: var(--sketch-wobble);
}
[data-sketch] .sketch-segmented label {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 44px; min-height: 44px; padding: 0 14px; cursor: pointer; border-radius: var(--sketch-wobble);
}
[data-sketch] .sketch-segmented input { position: absolute; opacity: 0; pointer-events: none; }
[data-sketch] .sketch-segmented label:hover { background: var(--sketch-wash); }
[data-sketch] .sketch-segmented label:has(input:checked) { background: var(--sketch-ink); color: var(--sketch-page); }
[data-sketch] .sketch-segmented label:has(input:focus-visible) { outline: var(--sketch-stroke) solid var(--sketch-ink); outline-offset: 3px; }
[data-sketch] .sketch-segmented label:has(input:disabled) { opacity: .4; cursor: not-allowed; }

/* An immediate on or off setting. The label stays the same in both states. */
[data-sketch] .sketch-switch { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; }
[data-sketch] .sketch-switch input[type="checkbox"] {
  position: relative; width: 40px; height: 24px; border-radius: 13px 11px 12px 13px / 12px 13px 11px 12px;
}
[data-sketch] .sketch-switch input[type="checkbox"]::before {
  content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%;
  background: var(--sketch-ink); transition: transform .16s;
}
[data-sketch] .sketch-switch input[type="checkbox"]:checked::before { background: var(--sketch-page); transform: translateX(16px); }
@media (prefers-reduced-motion: reduce) { [data-sketch] .sketch-switch input::before { transition: none; } }

/* A chip is a filter or a removable tag: a button. A badge is a passive status word. */
[data-sketch] .sketch-chip {
  position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px;
  background: none; border: var(--sketch-stroke) solid var(--sketch-ink); border-radius: 16px 14px 17px 13px / 14px 17px 13px 16px; cursor: pointer;
}
/* The pill is drawn 32px tall; its target reaches 44px. */
[data-sketch] .sketch-chip::after { content: ""; position: absolute; inset: -7px -2px; }
[data-sketch] .sketch-chip:hover:not(:disabled) { background: var(--sketch-wash); }
[data-sketch] .sketch-chip[aria-pressed="true"] { background: var(--sketch-ink); color: var(--sketch-page); }
/* Without this, a pressed chip on hover took the wash and kept the page as its words (#155). */
[data-sketch] .sketch-chip[aria-pressed="true"]:hover:not(:disabled) { background: color-mix(in srgb, var(--sketch-ink) 84%, transparent); }
[data-sketch] .sketch-badge {
  display: inline-block; padding: 1px 8px; font-size: 13px; font-weight: 600; white-space: nowrap;
  border: var(--sketch-stroke) solid var(--sketch-ink); border-radius: 4px 9px 5px 8px / 8px 4px 9px 5px;
}
/* Only the state to act on first is filled. */
[data-sketch] .sketch-badge.strong { background: var(--sketch-ink); color: var(--sketch-page); }

/* A field: a permanent label, the control, then an error tied to it. */
[data-sketch] .sketch-field { display: grid; gap: 6px; color: var(--sketch-muted); }
[data-sketch] .sketch-field :is(input, textarea, select), [data-sketch] .sketch-error { color: var(--sketch-ink); }
[data-sketch] textarea.sketch-input { min-height: 88px; resize: vertical; }
[data-sketch] select.sketch-input {
  appearance: none; -webkit-appearance: none; padding-right: 36px; cursor: pointer;
  background: feed-gradient(45deg, transparent 50%, currentColor 50%) right 19px center / 6px 6px no-repeat,
              feed-gradient(135deg, currentColor 50%, transparent 50%) right 13px center / 6px 6px no-repeat;
}
/* An open select is drawn as a sketch menu. A browser with appearance: base-select draws the list
   from these rules. Every other browser gets a sketch-menu from sketch.js (#154). */
@supports (appearance: base-select) {
  [data-sketch] select.sketch-input, [data-sketch] select.sketch-input::picker(select) { appearance: base-select; }
  [data-sketch] select.sketch-input::picker-icon, [data-sketch] select.sketch-input option::checkmark { display: none; }
  /* The browser opened the list on the side with more space and shrank it to fit, so the list of a
     lower field hid the row above it. The list now opens below at full height, and goes above when
     it does not fit there. A list taller than both sides shrinks and scrolls (#173). */
  @position-try --sketch-list-short { max-block-size: stretch; min-block-size: 160px; }
  [data-sketch] select.sketch-input::picker(select) {
    position-try: normal flip-block, flip-inline, flip-block flip-inline, --sketch-list-short, --sketch-list-short flip-block;
    max-block-size: none;
    min-width: max(200px, anchor-size(width)); max-width: calc(100vw - 16px); margin-block: 8px; padding: 8px;
    color: var(--sketch-ink); background: var(--sketch-page); font: inherit;
    border: var(--sketch-stroke) solid var(--sketch-ink); border-radius: var(--sketch-wobble);
  }
  [data-sketch] select.sketch-input option {
    display: flex; align-items: center; min-height: 44px; padding: 8px 12px; border-radius: var(--sketch-wobble); cursor: pointer;
  }
  [data-sketch] select.sketch-input option:is(:hover, :focus-visible):not(:disabled) { background: var(--sketch-wash); outline: 0; }
  [data-sketch] select.sketch-input option:checked { background: var(--sketch-wash); font-weight: 600; }
  [data-sketch] select.sketch-input optgroup { padding-top: 4px; color: var(--sketch-ink); font-weight: 600; }
  [data-sketch] select.sketch-input optgroup option { font-weight: 400; }
  [data-sketch] select.sketch-input :is(option, optgroup):disabled { color: var(--sketch-muted); cursor: not-allowed; }
}
[data-sketch] .sketch-input[aria-invalid="true"] { border-width: calc(var(--sketch-stroke) * 2); }
[data-sketch] .sketch-error { font-weight: 600; }
[data-sketch] .sketch-input:disabled { opacity: .4; cursor: not-allowed; }

/* Tabs: the chosen tab is underlined with the marker. */
[data-sketch] .sketch-tabs { display: flex; gap: 4px; overflow-x: auto; }
[data-sketch] .sketch-tabs [role="tab"] {
  min-height: 44px; padding: 0 12px; background: none; border: 0; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap;
}
[data-sketch] .sketch-tabs [role="tab"]:hover { background: var(--sketch-wash); }
[data-sketch] .sketch-tabs [role="tab"][aria-selected="true"] { border-bottom-color: var(--sketch-ink); font-weight: 600; }

/* Records in a table. A wide table scrolls inside its own box, not the page. */
[data-sketch] .sketch-table-box { overflow-x: auto; }
[data-sketch] .sketch-table { width: 100%; border-collapse: collapse; }
[data-sketch] .sketch-table th { text-align: left; font-weight: 600; color: var(--sketch-muted); padding: 8px 12px; border-bottom: var(--sketch-stroke) solid var(--sketch-ink); white-space: nowrap; }
[data-sketch] .sketch-table td { padding: 10px 12px; border-bottom: 1px solid var(--sketch-wash); }

/* A picture, an avatar or a chart that is not decided yet: a crossed box. */
[data-sketch] .sketch-placeholder {
  display: grid; place-items: center; min-height: 96px; color: var(--sketch-muted);
  border: var(--sketch-stroke) solid var(--sketch-muted); border-radius: var(--sketch-wobble);
  background: feed-gradient(to top right, transparent calc(50% - 1px), var(--sketch-wash) 50%, transparent calc(50% + 1px)),
              feed-gradient(to bottom right, transparent calc(50% - 1px), var(--sketch-wash) 50%, transparent calc(50% + 1px));
}
/* Page layouts for templates/<category>/<name>.html. Phone first, then a tablet step at 600 px and a desktop step at 1000 px.
   .sketch-phone-only, .sketch-from-tablet, .sketch-from-desktop and .sketch-until-desktop show an element only at those widths. */
[data-sketch] :is(.sketch-main, .sketch-narrow, .sketch-stack) > :is(h1, h2, h3, p, fieldset) { margin: 0; }
[data-sketch] .sketch-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: var(--sketch-stroke) solid var(--sketch-ink); }
[data-sketch] .sketch-nav { display: flex; gap: 4px; padding: 8px 16px; overflow-x: auto; }
[data-sketch] :is(.sketch-nav, .sketch-bar, .sketch-list, .sketch-main, .sketch-narrow) a:not(.sketch-button), [data-sketch] .sketch-split > * > a:not(.sketch-button) { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-width: 44px; min-height: 44px; }
[data-sketch] :is(.sketch-main, .sketch-narrow, .sketch-split > *) > a:not(.sketch-button) { justify-self: start; }
[data-sketch] :is(.sketch-tabs [role="tab"], .sketch-switch, input[type="range"]) { min-width: 44px; min-height: 44px; } /* Every touch target is at least 44 px. */
[data-sketch] .sketch-nav a { padding: 0 12px; white-space: nowrap; text-decoration: none; border-radius: var(--sketch-wobble); }
[data-sketch] .sketch-nav a:hover { background: var(--sketch-wash); }
[data-sketch] .sketch-nav a[aria-current] { font-weight: 600; background: var(--sketch-wash); }
/* An app shell: a bottom tab bar on a phone, an icon rail from 600 px with .sketch-rail, a side nav from 1000 px. */
[data-sketch] .sketch-shell { display: grid; grid-template: auto 1fr auto / minmax(0, 1fr); min-height: 100vh; }
[data-sketch] .sketch-shell > .sketch-bar { grid-column: 1 / -1; }
[data-sketch] .sketch-shell > .sketch-nav { order: 1; position: sticky; bottom: 0; z-index: 1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding: 4px; background: var(--sketch-page); border-top: var(--sketch-stroke) solid var(--sketch-ink); }
[data-sketch] .sketch-shell > .sketch-nav a { flex-direction: column; gap: 2px; padding: 4px; font-size: 12px; }
[data-sketch] .sketch-main { display: grid; gap: 24px; align-content: start; width: 100%; min-width: 0; max-width: 1080px; margin: 0 auto; padding: 24px 16px; }
[data-sketch] .sketch-narrow { display: grid; gap: 16px; align-content: start; width: 100%; max-width: var(--width, 440px); margin: 0 auto; padding: 48px 16px; }
[data-sketch] .sketch-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px 48px; align-items: start; } /* Two columns from 1000 px; --cols sets them. */
[data-sketch] .sketch-grid { display: grid; gap: 16px; grid-template-columns: repeat(var(--phone, 1), minmax(0, 1fr)); } /* 1, 2, then 4 columns; --phone, --tablet and --wide change them. */
[data-sketch] .sketch-grid > :is(.sketch-span, .sketch-span + *) { grid-column: 1 / -1; }
[data-sketch] .sketch-list { display: grid; align-content: start; margin: 0; padding: 0; list-style: none; }
[data-sketch] .sketch-list > li { display: flex; flex-wrap: wrap; align-items: center; gap: 0 12px; min-height: 56px; margin: 0 -8px; padding: 6px 8px; border-radius: var(--sketch-wobble); }
[data-sketch] .sketch-list > li:has([aria-current]) { background: var(--sketch-wash); }
/* An avatar: <span class="sketch-avatar"> with initials, a circle for a person. Add "square" for a group. */
[data-sketch] .sketch-avatar, [data-sketch] .sketch-list > li.sketch-conversation > span:first-child { display: grid; place-items: center; flex: none; width: 36px; height: 36px; box-sizing: border-box; border: var(--sketch-stroke) solid currentColor; border-radius: 50% 46% 52% 48% / 48% 52% 46% 50%; font-size: 13px; font-weight: 600; }
[data-sketch] .sketch-avatar.square, [data-sketch] .sketch-list > li.sketch-conversation > span.square:first-child { border-radius: var(--sketch-wobble); }
/* An inbox row: <li class="sketch-conversation"> holds, in this order, an avatar <span>, a <div> with the name link and a <p> message,
   and a <div> with the time and an unread count. The link covers the row. A count makes the name bold. Selected is the filled ink. */
[data-sketch] .sketch-list > li.sketch-conversation { position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: start; gap: 2px 12px; padding-block: 10px; }
[data-sketch] .sketch-list > li.sketch-conversation > div { display: grid; gap: 2px; min-width: 0; }

/* Screens of a pattern sketch. This script runs before the kit script.

   dialog, the part opens it. data-select-in="name" selects a tab or an option, data-current-in="name" marks the open row, and
   data-off-in="name" clears a checkbox. A tab that is a link, and a button or an option with data-go, change the state.

  const has_part = (shown, names) => {
    const list = names.split(' '), wanted = list.filter(name => name[0] !== '!');
    return list.every(name => name[0] !== '!' || !shown.includes(name.slice(1))) && (!wanted.length || wanted.some(name => shown.includes(name)));
  };
  document.querySelectorAll('[data-screen]').forEach((block, index) => {
    const copy = document.getElementById(block.dataset.screen).content.cloneNode(true);
    const shown = (block.dataset.show || '').split(' ');
    ['id', 'name', 'aria-controls', 'aria-labelledby', 'data-sketch-popover', 'data-sketch-open'].forEach(name =>
      copy.querySelectorAll(`[${name}]`).forEach(node => node.setAttribute(name, `s${index}_${node.getAttribute(name)}`)));
    copy.querySelectorAll('[data-part]').forEach(part => {
      const on = has_part(shown, part.dataset.part);
      if (part.matches('.sketch-menu, .sketch-popover, dialog')) part.toggleAttribute('data-open', on);
      else part.hidden = !on;

    const target = event.target;
    /* A menu button opens or closes the .sketch-collapse right after it. */
    const menu = target.closest('.sketch-menu-button');
    if (menu) menu.setAttribute('aria-expanded', String(menu.getAttribute('aria-expanded') !== 'true'));
    const layerTrigger = open?.layer.contains(target) ? open.trigger : null;
    const popoverTrigger = target.closest('[data-sketch-popover]');
    if (popoverTrigger) {
      const layer = document.getElementById(popoverTrigger.dataset.sketchPopover);
      if (open?.layer === layer) closeLayer(); else openLayer(layer, popoverTrigger);
      return;
    }
    const opener = target.closest('[data-sketch-open]');
    if (opener) showDialog(document.getElementById(opener.dataset.sketchOpen), opener);
    if (target.closest('[data-sketch-close]')) {
      const dialog = target.closest('dialog');
      if (dialog) dialog.close(); else closeLayer();
    }
    if (target.matches('dialog.sketch-dialog')) {
      const r = target.getBoundingClientRect();
      if (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom) target.close();
    }
    const option = open && target.closest('[role="option"].sketch-menu-item');
    if (option) chooseOption(open.trigger, option);
    if (open && target.closest('.sketch-menu-item')) closeLayer();
    const chip = target.closest('.sketch-chip[aria-pressed]');
    if (chip) chip.setAttribute('aria-pressed', String(chip.getAttribute('aria-pressed') !== 'true'));
    const tab = target.closest('.sketch-tabs [role="tab"]');
    if (tab) selectTab(tab, false);
    const toast = target.closest('[data-sketch-toast]');
    if (toast) sketchToast(toast.dataset.sketchToast, layerTrigger || toast);
  });
  page.addEventListener('pointerdown', event => {
    if (open && !open.layer.contains(event.target) && !open.trigger.contains(event.target)) closeLayer(false);
  });
  page.addEventListener('mousedown', event => {
    if (!ownsList(event.target)) return;
    event.preventDefault();
    event.target.focus();
    if (open?.trigger === event.target) closeLayer(); else openList(event.target);
  });
  page.addEventListener('keydown', event => {
    if (event.key === 'Escape' && open) { event.preventDefault(); closeLayer(); return; }
    if (event.key === 'Escape' && !event.target.closest('dialog') && hideToast()) { event.preventDefault(); return; }
    if (ownsList(event.target) && [' ', 'Enter', 'ArrowDown', 'ArrowUp'].includes(event.key)) { event.preventDefault(); openList(event.target); return; }
    const menu = event.target.closest('.sketch-menu');
    if (menu && ['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) {
      const items = menuItems(menu), at = items.indexOf(event.target);
      const next = {ArrowDown: at + 1, ArrowUp: at - 1, Home: 0, End: items.length - 1}[event.key];
      items[(next + items.length) % items.length]?.focus();
      event.preventDefault();
    }
    const tab = event.target.closest('.sketch-tabs [role="tab"]');
    if (tab && ['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(event.key)) {
      const tabs = [...tab.parentElement.querySelectorAll('[role="tab"]')], at = tabs.indexOf(tab);
      const next = {ArrowRight: at + 1, ArrowLeft: at - 1, Home: 0, End: tabs.length - 1}[event.key];
      selectTab(tabs[(next + tabs.length) % tabs.length], true);
      event.preventDefault();
    }
  });
  addEventListener('resize', () => open && place(open.layer, open.trigger));

  /* States: each [data-state="id"] is one screen. The address #id shows it; no address shows the
     first. An overlay marked data-open inside a state opens with it, so a review can link to it. */
  const showState = () => {
    const states = [...page.querySelectorAll('[data-state]')];
    if (!states.length) return;
    const current = states.find(state => state.dataset.state === location.hash.slice(1)) || states[0];
    closeLayer(false);
    page.querySelectorAll('dialog[open]').forEach(dialog => dialog.close());
    states.forEach(state => { state.hidden = state !== current; });
    current.querySelectorAll('[data-open]').forEach(layer => {
      if (layer.matches('dialog')) { showDialog(layer, null); return; }
      const trigger = page.querySelector(`[data-sketch-popover="${layer.id}"]`);
      if (trigger) openLayer(layer, trigger, false);
    });
  };
  addEventListener('hashchange', showState);

  window.initSketch = () => {
    page.querySelectorAll('i[data-icon]').forEach(drawIcon);
    page.querySelectorAll(outlined).forEach(outline);
    page.querySelectorAll('.sketch-popover, .sketch-menu').forEach(layer => {
      if (!layer.matches('dialog')) layer.hidden = !open || open.layer !== layer;
      if (!layer.sketchReady) {
        layer.sketchReady = true;
        /* A layer taller than the screen scrolls, and its outline stays on the visible box. */
        layer.addEventListener('scroll', () => {
          const svg = layer.querySelector(':scope > .sketch-outline');
          if (svg) svg.style.transform = `translateY(${layer.scrollTop}px)`;
        });
      }
      if (layer.matches('.sketch-menu:not([role="listbox"])')) {
        layer.setAttribute('role', 'menu');
        layer.querySelectorAll('.sketch-menu-item').forEach(item => item.setAttribute('role', 'menuitem'));
      }
    });
    page.querySelectorAll('[data-sketch-popover]').forEach(trigger => {
      trigger.setAttribute('aria-controls', trigger.dataset.sketchPopover);
      trigger.setAttribute('aria-haspopup', document.getElementById(trigger.dataset.sketchPopover)?.matches('.sketch-menu') ? 'menu' : 'dialog');
      if (!trigger.hasAttribute('aria-expanded')) trigger.setAttribute('aria-expanded', 'false');
    });
    page.querySelectorAll('dialog.sketch-dialog').forEach(dialog => {
      if (dialog.sketchReady) return;
      dialog.sketchReady = true;
      dialog.addEventListener('close', () => dialog.sketchOpener?.focus());
    });
    page.querySelectorAll('.sketch-tabs').forEach(list => {
      list.setAttribute('role', 'tablist');
      const tabs = [...list.querySelectorAll('[role="tab"]')];
      const chosen = tabs.find(tab => tab.getAttribute('aria-selected') === 'true') || tabs[0];
      if (chosen) selectTab(chosen, false);
    });
    applyTheme();
    showState();
  };
  window.initSketch();
})();
</script>
